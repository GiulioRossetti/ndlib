            const currentModel = models[selectedModelName];
            const isContinuousModel = currentModel && currentModel.discrete_state === false;
            const getDefaultModelForCategory = (category) => {
                if (category === "Epidemics" && models.SIModel) return "SIModel";
                const groups = getModelSelectorGroups(category);
                for (const group of groups) {
                    if (group.items && group.items.length > 0) {
                        return group.items[0][0];
                    }
                }
                return Object.keys(models).find(k => models[k].category === category) || "";
            };
            const getModelSelectorGroups = (category) => {
                const entries = Object.entries(models).filter(([, model]) => model.category === category);
                if (category !== "Epidemics" && category !== "Opinions") {
                    return [{
                        label: null,
                        items: entries.sort((a, b) => {
                            const left = (a[1].name || a[0]).toLowerCase();
                            const right = (b[1].name || b[0]).toLowerCase();
                            return left.localeCompare(right);
                        })
                    }];
                }

                const isEpidemics = category === "Epidemics";
                const groupOrder = isEpidemics ? {
                    "Core Epidemic Models": 0,
                    "Threshold and Cascade Models": 1,
                    "Community-Based Models": 2,
                    "Other Epidemic Models": 3
                } : {
                    "Continuous Opinion Models": 0,
                    "Discrete Opinion Models": 1,
                    "Other Opinion Models": 2
                };
                const grouped = new Map();
                entries.forEach(([key, model]) => {
                    const groupLabel = model.display_group || (isEpidemics ? "Other Epidemic Models" : "Other Opinion Models");
                    if (!grouped.has(groupLabel)) grouped.set(groupLabel, []);
                    grouped.get(groupLabel).push([key, model]);
                });

                return Array.from(grouped.entries())
                    .sort((a, b) => (groupOrder[a[0]] ?? 99) - (groupOrder[b[0]] ?? 99) || a[0].localeCompare(b[0]))
                    .map(([label, items]) => ({
                        label,
                        items: items.sort((a, b) => {
                            const leftOrder = a[1].display_order ?? 999;
                            const rightOrder = b[1].display_order ?? 999;
                            if (leftOrder !== rightOrder) return leftOrder - rightOrder;
                            const left = (a[1].name || a[0]).toLowerCase();
                            const right = (b[1].name || b[0]).toLowerCase();
                            return left.localeCompare(right);
                        })
                    }));
            };

            if (showModelBuilder) {
                return renderModelBuilder();
            }

            return (

                        {/* Model Category Tabs */}
                        <div class="flex bg-slate-900/60 p-1 rounded-lg border border-slate-800">

                            >
                                {getModelSelectorGroups(selectedCategory).map(group => (
                                    group.label ? (
                                        <optgroup key={group.label} label={group.label}>
                                            {group.items.map(([key, model]) => (
                                                <option key={key} value={key}>{model.name}</option>

                                    ) : (

                            </select>
                        </div>

                        {/* Graph Selection & Generation */}
                        <div class="space-y-3 pt-2 border-t border-slate-800">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Network Topology</label>
                            <select 
                                value={graphType}
                                onChange={(e) => handleGraphTypeChange(e.target.value)}

                                                onChange={(e) => setModelParams(prev => ({
                                                    ...prev,
                                                    community_detection_algorithm: e.target.value
                                                }))}
                                                class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                            >
                                                {communityDetectionOptions.map(option => (
                                                    <option key={option.value} value={option.value}>{option.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                        {modelParams["community_detection_algorithm"] === "asyn_fluidc" && (
                                            <div class="flex justify-between items-center text-xs">
                                                <span class="text-slate-300">Target number of communities</span>
                                                <input
                                                    type="number"
                                                    min="2"
                                                    max={graphParams.n}
                                                    step="1"
                                                    value={modelParams["community_detection_k"] || 2}
                                                    onChange={(e) => setModelParams(prev => ({
                                                        ...prev,
                                                        community_detection_k: Math.max(2, parseInt(e.target.value) || 2)
                                                    }))}
                                                    class="w-24 bg-slate-900 border border-slate-800 rounded-md p-1 text-slate-200 text-right neon-border-glow"
                                                />
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Node Configuration Parameters (e.g. stubbornness / zealot) */}
                                {currentModel && Object.keys(currentModel.parameters.nodes).map(paramName => {
                                    if (selectedModelName === "VoterZealotModel" && paramName === "zealot") {
                                        return null;
                                    }
                                    const p = currentModel.parameters.nodes[paramName];
                                    const isBinaryParam = p.range && p.range[0] === 0 && p.range[1] === 1;
                                    return (
                                        <div key={paramName} class="space-y-1">
                                            <label class="text-xs text-slate-300 block mb-1">Node parameter: {paramName} - {p.descr}</label>
                                            <input 
                                                type="number"
                                                min={isBinaryParam ? "0" : undefined}
                                                max={isBinaryParam ? "1" : undefined}
                                                step={isBinaryParam ? "1" : "0.01"}
                                                value={modelParams[paramName] !== undefined ? modelParams[paramName] : (isBinaryParam ? 0 : 0.1)}
                                                onChange={(e) => setModelParams(prev => ({
                                                    ...prev,
                                                    [paramName]: isBinaryParam
                                                        ? Math.min(1, Math.max(0, parseInt(e.target.value) || 0))
                                                        : Math.min(1.0, Math.max(0.0, parseFloat(e.target.value) || 0.0))
                                                }))}
                                                class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                            />
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Simulation Length & Run Button */}
                        <div class="space-y-4 pt-4 border-t border-slate-800 mt-auto">
                            <div class="flex justify-between items-center">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Simulation length</label>
                                <input 
                                    type="number" 
                                    value={iterations} 
                                    onChange={(e) => setIterations(parseInt(e.target.value) || 10)}
                                    class="w-20 bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-center text-slate-200 neon-border-glow"
                                />
                            </div>

                            <button 
                                onClick={runSimulation}
                                disabled={loading}
                                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-900/30 transition flex items-center justify-center space-x-2"
                            >
                                {loading ? (
                                    <>
                                        <i class="fa-solid fa-spinner animate-spin"></i>
                                        <span>Simulating...</span>
                                    </>
                                ) : (
                                    <>
                                        <i class="fa-solid fa-play"></i>
                                        <span>3. Run Simulation</span>
                                    </>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Right Panel - Outputs */}
                    <div class="flex-grow flex flex-col h-full overflow-hidden">
                        {/* Tabs Bar */}
                        {(results || networkPreview) && (
                        <div class="bg-slate-900/50 border-b border-slate-800/80 px-6 py-4 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
                            <div class="flex space-x-4">
                                {results && !isContinuousModel && (
                                    <button 
                                        onClick={() => setActiveTab("trends")}
                                        class={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "trends" ? "bg-slate-800 text-white border border-slate-700" : "text-slate-400 hover:text-white"}`}
                                    >
                                        <i class="fa-solid fa-chart-line mr-2"></i>Trends Plot
                                    </button>
                                )}

                                {results && selectedCategory === "Epidemics" && (
                                    <button 
                                        onClick={() => setActiveTab("prevalence")}
                                        class={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "prevalence" ? "bg-slate-800 text-white border border-slate-700" : "text-slate-400 hover:text-white"}`}
                                    >
                                        <i class="fa-solid fa-chart-bar mr-2"></i>Prevalence
                                    </button>
                                )}

                                {results && selectedCategory === "Epidemics" && (
                                    <button 
                                        onClick={() => setActiveTab("phase")}
                                        class={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "phase" ? "bg-slate-800 text-white border border-slate-700" : "text-slate-400 hover:text-white"}`}
                                    >
                                        <i class="fa-solid fa-rotate mr-2"></i>Phase Space
                                    </button>
                                )}

                                {results && isContinuousModel && (
                                    <button 
                                        onClick={() => setActiveTab("opinion_evolution")}
                                        class={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "opinion_evolution" ? "bg-slate-800 text-white border border-slate-700" : "text-slate-400 hover:text-white"}`}
                                    >
                                        <i class="fa-solid fa-chart-area mr-2"></i>Opinion Evolution
                                    </button>
                                )}

                                {(results || networkPreview) && (
                                    <button 
                                        onClick={() => setActiveTab("network")}
                                        class={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "network" ? "bg-slate-800 text-white border border-slate-700" : "text-slate-400 hover:text-white"}`}
                                    >
                                        <i class="fa-solid fa-network-wired mr-2"></i>Network Graph
                                    </button>
                                )}
                            </div>

                            {/* Export Buttons */}
                            {results && (
                                <div class="flex space-x-2">
                                    <button 
                                        onClick={exportJSON}
                                        class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold py-1.5 px-3 rounded-lg transition"
                                    >
                                        <i class="fa-solid fa-download mr-1"></i>JSON
                                    </button>
                                    <button 
                                        onClick={exportCSV}
                                        class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold py-1.5 px-3 rounded-lg transition"
                                    >
                                        <i class="fa-solid fa-file-csv mr-1"></i>CSV
                                    </button>
                                    {(activeTab === "trends" || activeTab === "phase" || activeTab === "opinion_evolution") && (
                                        <button 
                                            onClick={downloadChart}
                                            class="bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold py-1.5 px-3 rounded-lg transition text-white"
                                        >
                                            <i class="fa-solid fa-image mr-1"></i>Plot PNG
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                        )}

                        {/* Error Alert */}
                        {error && (
                            <div class="bg-red-500/10 border border-red-500/30 text-red-200 px-6 py-4 mx-6 mt-6 rounded-xl flex flex-col space-y-3">
                                <div class="flex items-center space-x-3">
                                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
                                    <span>{error}</span>
                                </div>
                                {Object.keys(models).length === 0 && (
                                    <div class="flex items-center space-x-3 mt-2 bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                                        <label class="text-xs text-slate-400 font-semibold uppercase">Server URL:</label>
                                        <input 
                                            type="text" 
                                            value={apiBaseUrl} 
                                            onChange={(e) => setApiBaseUrl(e.target.value)}
                                            placeholder="http://127.0.0.1:5000"
                                            class="bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none w-64"
                                        />
                                        <button 
                                            onClick={() => loadModels(apiBaseUrl)}
                                            class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1 rounded"
                                        >
                                            Connect
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Visualizer Area */}
                        <div class="flex-grow p-6 overflow-hidden flex flex-col">
                            {!results && !loading && !networkPreview && (
                                <div class="flex-grow flex flex-col justify-center items-center text-slate-500 space-y-4">
                                    <i class="fa-solid fa-network-wired text-6xl text-slate-600"></i>
                                    <p class="text-lg">Step 1: build or load a network, then configure the model and run the simulation.</p>
                                </div>
                            )}

                            {loading && (
                                <div class="flex-grow flex flex-col justify-center items-center text-indigo-400 space-y-4">
                                    <i class="fa-solid fa-spinner animate-spin text-5xl"></i>
                                    <p class="text-lg">{loadingMessage || "Executing network simulation..."}</p>
                                </div>
                            )}

                            {/* Charts & Graph Rendering */}
                            {results && !loading && (
                                <div class="flex-grow flex flex-col h-full">
                                    <div class={`flex-grow bg-slate-950/20 border border-slate-800/80 rounded-2xl p-6 relative h-full ${activeTab !== "trends" || isContinuousModel ? "hidden" : ""}`}>
                                        <canvas id="trendsChart"></canvas>
                                    </div>

                                    <div class={`flex-grow bg-slate-950/20 border border-slate-800/80 rounded-2xl p-6 relative h-full ${activeTab !== "prevalence" ? "hidden" : ""}`}>
                                        <canvas id="prevalenceChart"></canvas>
                                    </div>

                                    <div class={`flex-grow bg-slate-950/20 border border-slate-800/80 rounded-2xl p-6 relative h-full ${activeTab !== "phase" ? "hidden" : ""}`}>
                                        <canvas id="phaseChart"></canvas>
                                    </div>

                                    <div class={`flex-grow bg-slate-950/20 border border-slate-800/80 rounded-2xl p-6 relative h-full ${activeTab !== "opinion_evolution" || !isContinuousModel ? "hidden" : ""}`}>
                                        <canvas id="opinionChart"></canvas>
                                    </div>

                                    <div class={`flex-grow flex flex-col h-full space-y-4 ${activeTab !== "network" ? "hidden" : ""}`}>
                                        {results && (
                                            <>
                                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-950/40 p-4 border border-slate-900 rounded-xl">
                                                    <div class="flex items-center space-x-4 flex-grow">
                                                        <button 
                                                            onClick={() => setIsPlaying(!isPlaying)}
                                                            class="w-10 h-10 flex flex-shrink-0 items-center justify-center bg-indigo-600 hover:bg-indigo-500 rounded-full text-white transition shadow-lg shadow-indigo-900/20 cursor-pointer"
                                                        >
                                                            {isPlaying ? <i class="fa-solid fa-pause"></i> : <i class="fa-solid fa-play ml-0.5"></i>}
                                                        </button>
                                                        <div class="flex-grow flex items-center space-x-3 max-w-xl">
                                                            <span class="text-xs text-slate-400 w-24">Simulation step {currentPlaybackStep}</span>
                                                            <input 
                                                                type="range"
                                                                min="0"
                                                                max={results.iterations.length - 1}
                                                                value={currentPlaybackStep}
                                                                onChange={handlePlaybackSliderChange}
                                                                onInput={handlePlaybackSliderChange}
                                                                class="flex-grow accent-indigo-500 cursor-pointer"
                                                            />
                                                        </div>
                                                    </div>
                                                    
                                                    {showNetworkGraph && (
                                                        <div class="flex items-center space-x-2">
                                                            <label class="text-xs text-slate-400 font-semibold uppercase">Graph layout:</label>
                                                            <select 
                                                                value={networkLayout}
                                                                onChange={(e) => handleLayoutChange(e.target.value)}
                                                                class="bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none cursor-pointer"
                                                            >
                                                                <option value="preset">Preset spring layout</option>
                                                                <option value="cose">Force-directed layout</option>
                                                                <option value="community_clusters">Community clusters</option>
                                                                <option value="breadthfirst">Breadth-first</option>
                                                                <option value="random">Random</option>
                                                                <option value="circle">Circle</option>
                                                                <option value="grid">Grid</option>
                                                                <option value="concentric">Concentric</option>
                                                            </select>
                                                        </div>
                                                    )}
                                                </div>

                                                {showNetworkGraph ? (
                                                    <div class="grid gap-4 flex-grow min-h-[400px] lg:grid-cols-[minmax(0,1.55fr)_minmax(320px,0.85fr)]">
                                                        <div class="relative border border-slate-900 rounded-2xl min-h-[400px] h-full overflow-hidden">
                                                            <div 
                                                                ref={cyContainerRef} 
                                                                class="absolute inset-0 bg-slate-950/60"
                                                            ></div>
                                                            <div class={`absolute bottom-4 left-4 p-4 rounded-xl border z-10 flex flex-col space-y-2 backdrop-blur-md ${isDarkMode ? "bg-slate-900/90 border-slate-800 text-slate-200" : "bg-white/90 border-slate-200 text-slate-800 shadow-lg"} w-48`}>
                                                                <h4 class="text-xs font-bold uppercase tracking-wider mb-1 opacity-80">Status Legend</h4>
                                                                {results && results.isContinuous ? (
                                                                    <div class="space-y-2">
                                                                        <div class="h-3.5 w-full rounded border border-black/10" style={{
                                                                            background: 'linear-gradient(to right, rgb(59, 130, 246), rgb(149, 99, 157), rgb(239, 68, 68))'
                                                                        }}></div>
                                                                        <div class="flex justify-between text-[10px] font-semibold opacity-70">
                                                                            <span>Low ({results.minOpinion !== undefined ? results.minOpinion.toFixed(2) : "-1.0"})</span>
                                                                            <span>High ({results.maxOpinion !== undefined ? results.maxOpinion.toFixed(2) : "1.0"})</span>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    results && Object.keys(results.statuses).map(statusName => {
                                                                        const code = results.statuses[statusName];
                                                                        return (
                                                                            <div key={statusName} class="flex items-center space-x-2.5 text-xs font-medium">
                                                                                <span class="w-3.5 h-3.5 rounded-full border border-black/10" style={{ backgroundColor: getStatusColor(code) }}></span>
                                                                                <span>{statusName}</span>
                                                                            </div>
                                                                        );
                                                                    })
                                                                )}
                                                            </div>
                                                        </div>

                                                        <div class={`border rounded-2xl p-4 flex flex-col min-h-[400px] h-full ${isDarkMode ? "border-slate-800 bg-slate-950/30" : "border-slate-200 bg-white/80"}`}>
                                                            <div class="flex items-center justify-between mb-3">
                                                                <div>
                                                                    <h4 class="text-sm font-semibold text-slate-100">Opinion distribution</h4>
                                                                    <p class="text-xs text-slate-400">Binned from the current simulation step</p>
                                                                </div>
                                                                <div class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Playback-linked</div>
                                                            </div>
                                                            <div class="flex-grow min-h-[320px]">
                                                                <canvas id="opinionDistributionChart"></canvas>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="flex-grow flex items-center justify-center">
                                                        <div class={`w-full max-w-3xl border rounded-2xl p-4 flex flex-col min-h-[400px] h-full ${isDarkMode ? "border-slate-800 bg-slate-950/30" : "border-slate-200 bg-white/80"}`}>
                                                            <div class="flex items-center justify-between mb-3">
                                                                <div>
                                                                    <h4 class="text-sm font-semibold text-slate-100">Opinion distribution</h4>
                                                                    <p class="text-xs text-slate-400">The graph is omitted for large networks.</p>
                                                                </div>
                                                                <div class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Distribution only</div>
                                                            </div>
                                                            <div class="flex-grow min-h-[320px]">
                                                                <canvas id="opinionDistributionChart"></canvas>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            )}

                            {!results && !loading && networkPreview && (
                                <div class="flex-grow flex flex-col h-full">
                                    <div class={`flex-grow flex flex-col h-full space-y-4 ${activeTab !== "network" ? "hidden" : ""}`}>
                                        <div class={`flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-950/40 p-4 border border-slate-900 rounded-xl`}>
                                            <div class="flex items-center space-x-4 flex-grow">
                                                <div class="flex-grow flex items-center space-x-3 max-w-xl">
                                                    <span class="text-xs text-slate-400 w-16">Preview</span>
                                                    <span class="text-xs text-slate-400">No simulation results yet</span>
                                                </div>
                                            </div>
                                        </div>

                                        {showNetworkGraph ? (
                                            <div class="flex-grow relative border border-slate-900 rounded-2xl min-h-[400px] h-full overflow-hidden">
                                                <div 
                                                    ref={cyContainerRef} 
                                                    class="absolute inset-0 bg-slate-950/60"
                                                ></div>
                                            </div>
                                        ) : (
                                            <div class="flex-grow flex items-center justify-center">
                                                <div class={`w-full max-w-3xl border rounded-2xl p-4 flex flex-col min-h-[400px] h-full ${isDarkMode ? "border-slate-800 bg-slate-950/30" : "border-slate-200 bg-white/80"}`}>
                                                    <div class="flex items-center justify-between mb-3">
                                                        <div>
                                                            <h4 class="text-sm font-semibold text-slate-100">Opinion distribution</h4>
                                                            <p class="text-xs text-slate-400">Run a simulation to populate this chart.</p>
                                                        </div>
                                                        <div class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Distribution only</div>
                                                    </div>
                                                    <div class="flex-grow min-h-[320px]">
                                                        <canvas id="opinionDistributionChart"></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
