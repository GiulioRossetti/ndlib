                                            class={`px-3 py-1.5 rounded-xl text-sm transition cursor-pointer flex items-center ${isDarkMode ? "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700" : "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200"}`}
                                            title="Download pipeline image"
                                        >
                                            <i class="fa-solid fa-image mr-2"></i>Export PNG
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Configurations & Properties Right Panel */}
                            <div class={`relative shrink-0 overflow-hidden border-l transition-all duration-300 ${builderRightSidebarCollapsed ? "w-14" : "w-80"} ${isDarkMode ? "border-slate-800 bg-slate-900/50" : "border-slate-200 bg-slate-50"}`}>
                                {!builderRightSidebarCollapsed && (
                                    <div class="h-full overflow-y-auto p-4 flex flex-col space-y-6">
                                        <div>
                                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Element Properties</h4>
                                            {selectedNodeIds.length > 1 && !selectedElement?.source && !selectedElement?.target && (
                                                <div class={`mb-3 p-2 rounded-lg border text-[10px] ${isDarkMode ? "border-indigo-500/30 bg-indigo-500/10 text-indigo-200" : "border-indigo-200 bg-indigo-50 text-indigo-700"}`}>
                                                    {selectedNodeIds.length} blocks selected. Drag any selected block to move the group.
                                                </div>
                                            )}
                                            {!selectedElement ? (
                                                <p class="text-xs text-slate-500 italic">Select a node or edge on the canvas to configure it.</p>
                                            ) : selectedElement.source && selectedElement.target ? (
                                                <div class={`p-3 border rounded-xl space-y-3 ${isDarkMode ? "bg-slate-900 border-slate-800" : "bg-white border-slate-200"}`}>
                                                    <p class="text-xs font-semibold text-red-400">Connection Selected</p>
                                                    <p class={`text-[10px] ${isDarkMode ? "text-slate-400" : "text-slate-500"}`}>Connects: {selectedElement.source} to {selectedElement.target}</p>
                                                    <button 
                                                        onClick={deleteSelectedElement}
                                                        class="w-full bg-red-950/40 hover:bg-red-900/40 border border-red-900/60 hover:border-red-500 text-red-200 text-xs py-1.5 rounded transition cursor-pointer"
                                                    >
                                                        Delete Connection
                                                    </button>
                                                </div>
                                            ) : (
                                                <div class={`p-3 border rounded-xl space-y-4 text-xs ${isDarkMode ? "bg-slate-900 border-slate-800" : "bg-white border-slate-200 text-slate-800"}`}>
                                                    <div class="flex justify-between items-center">
                                                        <span class="font-bold text-indigo-400">Edit {selectedElement.type === "status" ? "Status" : "Compartment"}</span>
                                                        <button onClick={deleteSelectedElement} class="text-slate-500 hover:text-red-400 transition cursor-pointer" title="Delete block">
                                                            <i class="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    </div>
                                            
                                            <div class="space-y-1">
                                                <label class="text-[10px] text-slate-400 block">Identifier / Name</label>
                                                <input 
                                                    type="text" 
                                                    value={selectedElement.data.name}
                                                    onChange={(e) => updateNodeData(selectedElement.id, { name: e.target.value.replace(/[^a-zA-Z0-9_]/g, "") })}
                                                    class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                />
                                            </div>

                                                    {selectedElement.type === "status" && (
                                                <div class="space-y-1">
                                                    <label class="text-[10px] text-slate-400 block">Status Code</label>
                                                    <input 
                                                        type="number" 
                                                        value={selectedElement.data.code}
                                                        onChange={(e) => updateNodeData(selectedElement.id, { code: parseInt(e.target.value) || 0 })}
                                                        class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                    />
                                                </div>
                                                    )}

                                                    {selectedElement.type === "compartment" && (
                                                <div class="space-y-3">
                                                    <div class="space-y-1">
                                                        <label class="text-[10px] text-slate-400 block">Compartment Class</label>
                                                        <select 
                                                            value={selectedElement.data.type}
                                                            onChange={(e) => {
                                                                const type = e.target.value;
                                                                let params = {};
                                                                if (type === "NodeStochastic") params = { rate: 0.1, triggering_status: "" };
                                                                else if (type === "NodeThreshold") params = { threshold: 0.1, triggering_status: "" };
                                                                else if (type === "EdgeStochastic") params = { threshold: 0.1, triggering_status: "" };
                                                                else if (type === "CountDown") params = { iterations: 5 };
                                                                else if (type === "NodeCategoricalAttribute") params = { attribute: "gender", value: "male", probability: 1.0 };
                                                                else if (type === "NodeNumericalAttribute") params = { attribute: "age", op: "==", value: "25", probability: 1.0 };
                                                                else if (type === "NodeNumericalVariable") params = { var: "opinion", var_type: "ATTRIBUTE", value: 0.5, op: ">=", probability: 1.0 };
                                                                else if (type === "ConditionalComposition") params = { condition: "", first_branch: "", second_branch: "" };
                                                                updateNodeData(selectedElement.id, { type, params });
                                                            }}
                                                            class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                        >
                                                            <option value="NodeStochastic">Node Stochastic</option>
                                                            <option value="NodeThreshold">Node Threshold</option>
                                                            <option value="EdgeStochastic">Edge Stochastic</option>
                                                            <option value="CountDown">Count Down</option>
                                                            <option value="NodeCategoricalAttribute">Node Categorical Attribute</option>
                                                            <option value="NodeNumericalAttribute">Node Numerical Attribute</option>
                                                            <option value="NodeNumericalVariable">Node Numerical Variable</option>
                                                            <option value="ConditionalComposition">Conditional Composition</option>
                                                        </select>
                                                    </div>
 
                                                    {selectedElement.data.params.rate !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Transmission Rate (rate)</label>
                                                            <input 
                                                                type="number" 
                                                                min="0" max="1" step="0.01"
                                                                value={selectedElement.data.params.rate}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, rate: parseFloat(e.target.value) || 0 }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            />
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.threshold !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Threshold</label>
                                                            <input 
                                                                type="number" 
                                                                min="0" max="1" step="0.01"
                                                                value={selectedElement.data.params.threshold}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, threshold: parseFloat(e.target.value) || 0 }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            />
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.iterations !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Count Down Iterations</label>
                                                            <input 
                                                                type="number" 
                                                                min="1" step="1"
                                                                value={selectedElement.data.params.iterations}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, iterations: parseInt(e.target.value) || 1 }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            />
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.triggering_status !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Triggering Status</label>
                                                            <select 
                                                                value={selectedElement.data.params.triggering_status}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, triggering_status: e.target.value }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            >
                                                                <option value="">None</option>
                                                                {statusesList.map(n => (
                                                                    <option key={n.id} value={n.data.name}>{n.data.name}</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.attribute !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Attribute Name</label>
                                                            <input 
                                                                type="text" 
                                                                value={selectedElement.data.params.attribute}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, attribute: e.target.value }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            />
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.var !== undefined && (
                                                        <div class="space-y-3">
                                                            <div class="space-y-1">
                                                                <label class="text-[10px] text-slate-400 block">Variable Name</label>
                                                                <input 
                                                                    type="text" 
                                                                    value={selectedElement.data.params.var}
                                                                    onChange={(e) => updateNodeData(selectedElement.id, {
                                                                        params: { ...selectedElement.data.params, var: e.target.value }
                                                                    })}
                                                                    class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                                />
                                                            </div>
                                                            <div class="space-y-1">
                                                                <label class="text-[10px] text-slate-400 block">Variable Kind</label>
                                                                <select 
                                                                    value={selectedElement.data.params.var_type || "ATTRIBUTE"}
                                                                    onChange={(e) => updateNodeData(selectedElement.id, {
                                                                        params: { ...selectedElement.data.params, var_type: e.target.value }
                                                                    })}
                                                                    class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                                >
                                                                    <option value="ATTRIBUTE">Attribute</option>
                                                                    <option value="STATUS">Status</option>
                                                                </select>
                                                            </div>
                                                            <div class="space-y-1">
                                                                <label class="text-[10px] text-slate-400 block">Comparison Source</label>
                                                                <select 
                                                                    value={selectedElement.data.params.value_type || ""}
                                                                    onChange={(e) => updateNodeData(selectedElement.id, {
                                                                        params: {
                                                                            ...selectedElement.data.params,
                                                                            value_type: e.target.value || undefined
                                                                        }
                                                                    })}
                                                                    class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                                >
                                                                    <option value="">Numeric value</option>
                                                                    <option value="ATTRIBUTE">Attribute</option>
                                                                    <option value="STATUS">Status</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.op !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Operator</label>
                                                            <select 
                                                                value={selectedElement.data.params.op}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, op: e.target.value }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            >
                                                                <option value="==">== (Equals)</option>
                                                                <option value="!=">!= (Not Equals)</option>
                                                                <option value="<">&lt; (Less Than)</option>
                                                                <option value=">">&gt; (Greater Than)</option>
                                                                <option value="<=">&lt;= (Less Than or Equal)</option>
                                                                <option value=">=">&gt;= (Greater Than or Equal)</option>
                                                                <option value="IN">IN (Range, e.g. [min,max])</option>
                                                            </select>
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.value !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Value {selectedElement.data.params.op === "IN" && "(min,max)"}</label>
                                                            <input 
                                                                type="text" 
                                                                value={selectedElement.data.params.value}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, value: e.target.value }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            />
                                                        </div>
                                                    )}

                                                    {selectedElement.data.params.probability !== undefined && (
                                                        <div class="space-y-1">
                                                            <label class="text-[10px] text-slate-400 block">Success Probability</label>
                                                            <input 
                                                                type="number" 
                                                                min="0" max="1" step="0.01"
                                                                value={selectedElement.data.params.probability}
                                                                onChange={(e) => updateNodeData(selectedElement.id, {
                                                                    params: { ...selectedElement.data.params, probability: parseFloat(e.target.value) || 0 }
                                                                })}
                                                                class={`w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                            />
                                                        </div>
                                                    )}
                                                </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>

                                        {/* Status Initialization Panel */}
                                        <div class="border-t border-slate-800/80 pt-4">
                                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Initial Allocation Ratios</h4>
                                            <div class={`p-3 border rounded-xl space-y-3 text-xs ${isDarkMode ? "bg-slate-900 border-slate-800" : "bg-white border-slate-200"}`}>
                                                {statusesList.length === 0 ? (
                                                    <p class="text-xs text-slate-500 italic">Declare status nodes to set allocation ratios.</p>
                                                ) : (
                                                    statusesList.map(n => {
                                                        const initItem = builderInitialStatus.find(i => i.status === n.data.name) || { ratio: 0.0 };
                                                        return (
                                                            <div key={n.id} class={`flex items-center justify-between gap-2 ${isDarkMode ? "text-slate-300" : "text-slate-700"}`}>
                                                                <span class="font-semibold truncate max-w-[120px]">{n.data.name} (%)</span>
                                                                <input 
                                                                    type="number"
                                                                    min="0" max="1" step="0.01"
                                                                    value={initItem.ratio}
                                                                    onChange={(e) => updateInitialStatusRatio(n.data.name, e.target.value)}
                                                                    class={`w-20 border rounded px-2 py-1 text-right ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`}
                                                                />
                                                            </div>
                                                        );
                                                    })
                                                )}
                                                {statusesList.length > 0 && (
                                                    <div class={`pt-2 border-t flex justify-between text-[10px] ${isDarkMode ? "border-slate-800/80 text-slate-400" : "border-slate-200 text-slate-500"}`}>
                                                        <span>Total:</span>
                                                        <span class="font-bold">
                                                            {(builderInitialStatus.reduce((acc, curr) => acc + curr.ratio, 0) * 100).toFixed(0)}%
                                                        </span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* Code Preview Panel */}
                                        <div class="border-t border-slate-800/80 pt-4 flex-grow flex flex-col min-h-[200px]">
                                            <div class="flex items-center justify-between mb-3">
                                                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Live NDQL Script</h4>
                                                <button
                                                    onClick={copyNDQLToClipboard}
                                                    class="px-2.5 py-1 text-[10px] font-semibold rounded-lg border border-slate-700 text-slate-300 hover:text-white hover:border-cyan-500 hover:bg-cyan-500/10 transition cursor-pointer"
                                                    title="Copy NDQL script"
                                                >
                                                    <i class="fa-solid fa-copy mr-1"></i>Copy
                                                </button>
                                            </div>
                                            <pre class={`flex-grow p-3 border rounded-xl text-[10px] font-mono overflow-auto whitespace-pre select-text leading-relaxed ${isDarkMode ? "bg-slate-950 border-slate-800 text-emerald-400" : "bg-white border-slate-200 text-emerald-700"}`}>
                                                {liveNDQL}
                                            </pre>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const currentModel = models[selectedModelName];
            const isContinuousModel = currentModel && currentModel.discrete_state === false;

            if (showModelBuilder) {
                return renderModelBuilder();
            }

            return (
                <div class="w-full flex-grow flex flex-col md:flex-row h-screen overflow-hidden">
                    {/* Left Sidebar - Configuration */}
                    <div class="w-full md:w-96 glass-panel border-r border-slate-700/50 flex flex-col h-full overflow-y-auto p-6 space-y-6">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                            <img src="NDlib_logo_full.png" alt="NDlib Logo" class="h-10 w-auto object-contain" />
                            <div class="flex items-center space-x-2">
                                <button 
                                    onClick={() => setShowModelBuilder(true)} 
                                    class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition cursor-pointer"
                                    title="Open Model Builder"
                                >
                                    <i class="fa-solid fa-diagram-project text-indigo-400"></i>
                                </button>
                                <button 
                                    onClick={() => setIsDarkMode(!isDarkMode)} 
                                    class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition cursor-pointer"
                                    title="Toggle Theme"
                                >
                                    {isDarkMode ? <i class="fa-solid fa-sun text-yellow-500"></i> : <i class="fa-solid fa-moon text-indigo-400"></i>}
                                </button>
                            </div>
                        </div>

                        {/* Model Category Tabs */}
                        <div class="flex bg-slate-900/60 p-1 rounded-lg border border-slate-800">
                            <button 
                                onClick={() => handleCategoryChange("Epidemics")}
                                class={`flex-1 py-1.5 text-xs font-medium rounded-md transition ${selectedCategory === "Epidemics" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white"}`}
                            >
                                Epidemics
                            </button>
                            <button 
                                onClick={() => handleCategoryChange("Opinions")}
                                class={`flex-1 py-1.5 text-xs font-medium rounded-md transition ${selectedCategory === "Opinions" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white"}`}
                            >
                                Opinions
                            </button>
                            <button 
                                onClick={() => handleCategoryChange("Custom Models")}
                                class={`flex-1 py-1.5 text-xs font-medium rounded-md transition ${selectedCategory === "Custom Models" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white"}`}
                            >
                                Custom
                            </button>
                        </div>

                        {/* Model Selector */}
                        <div class="space-y-2">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Simulation Model</label>
                            <select 
                                value={selectedModelName}
                                onChange={(e) => selectModel(e.target.value)}
                                class="w-full bg-slate-900/80 border border-slate-800 rounded-lg p-2.5 text-slate-200 neon-border-glow"
                            >
                                {Object.keys(models).filter(k => models[k].category === selectedCategory).map(k => (
                                    <option key={k} value={k}>{models[k].name}</option>
                                ))}
                            </select>
                        </div>

                        {/* Graph Selection & Generation */}
                        <div class="space-y-3 pt-2 border-t border-slate-800">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Network Topology</label>
                            <select 
                                value={graphType}
                                onChange={(e) => handleGraphTypeChange(e.target.value)}
                                class="w-full bg-slate-900/80 border border-slate-800 rounded-lg p-2.5 text-slate-200 neon-border-glow"
                            >
                                <option value="erdos_renyi">Erdos-Renyi random graph</option>
                                <option value="barabasi_albert">Barabasi-Albert scale-free graph</option>
                                <option value="watts_strogatz">Watts-Strogatz small-world graph</option>
                                <option value="lfr">LFR benchmark graph with communities</option>
                                <option value="planted_partition">Planted partition graph</option>
                                <option value="stochastic_block_model">Stochastic block model graph</option>
                                <option value="complete">Complete graph</option>
                                <option value="upload">Upload a custom graph</option>
                            </select>

                            {/* Topology Parameters */}
                            {graphType !== "upload" ? (
                                <div class="grid grid-cols-2 gap-3 bg-slate-950/40 p-3 rounded-lg border border-slate-900">
                                    {graphType !== "planted_partition" && graphType !== "stochastic_block_model" && (
                                        <div>
                                            <label class="text-xs text-slate-400 block mb-1">Number of nodes</label>
                                            <input 
                                                type="number" 
                                                min="10"
                                                max="1000"
                                                value={graphParams.n} 
                                                onChange={(e) => updateGraphParams(prev => ({ ...prev, n: Math.min(1000, Math.max(10, parseInt(e.target.value) || 10)) }))}
                                                class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                            />
                                        </div>
                                    )}
                                    {graphType === "erdos_renyi" && (
                                        <div>
                                            <label class="text-xs text-slate-400 block mb-1">Connection probability</label>
                                                <input 
                                                    type="number" 
                                                    step="0.01" 
                                                    value={graphParams.p} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, p: parseFloat(e.target.value) || 0.1 }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                            />
                                        </div>
                                    )}
                                    {graphType === "lfr" && (
                                        <>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Degree exponent (tau1)</label>
                                                <input 
                                                    type="number" 
                                                    min="1.1"
                                                    step="0.1"
                                                    value={graphParams.tau1} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, tau1: parseFloat(e.target.value) || 2.0 }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Community exponent (tau2)</label>
                                                <input 
                                                    type="number" 
                                                    min="1.0"
                                                    step="0.1"
                                                    value={graphParams.tau2} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, tau2: parseFloat(e.target.value) || 1.5 }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Community mixing ratio</label>
                                                <input 
                                                    type="number" 
                                                    min="0"
                                                    max="1"
                                                    step="0.01"
                                                    value={graphParams.mu} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, mu: Math.min(1.0, Math.max(0.0, parseFloat(e.target.value) || 0.1)) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Average node degree</label>
                                                <input 
                                                    type="number" 
                                                    min="2"
                                                    value={graphParams.average_degree} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, average_degree: Math.max(2, parseInt(e.target.value) || 8) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Minimum node degree</label>
                                                <input 
                                                    type="number" 
                                                    min="1"
                                                    value={graphParams.min_degree} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, min_degree: Math.max(1, parseInt(e.target.value) || 3) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Minimum community size</label>
                                                <input 
                                                    type="number" 
                                                    min="2"
                                                    value={graphParams.min_community} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, min_community: Math.max(2, parseInt(e.target.value) || 20) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">LFR solver iterations</label>
                                                <input 
                                                    type="number" 
                                                    min="100"
                                                    value={graphParams.max_iters} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, max_iters: Math.max(100, parseInt(e.target.value) || 500) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                        </>
                                    )}
                                    {(graphType === "planted_partition" || graphType === "stochastic_block_model") && (
                                        <>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Number of communities</label>
                                                <input 
                                                    type="number" 
                                                    min="2"
                                                    max="20"
                                                    value={graphParams.community_groups} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, community_groups: Math.max(2, parseInt(e.target.value) || 4) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Community size</label>
                                                <input 
                                                    type="number" 
                                                    min="2"
                                                    max="200"
                                                    value={graphParams.community_size} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, community_size: Math.max(2, parseInt(e.target.value) || 25) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Within-community edge probability</label>
                                                <input 
                                                    type="number" 
                                                    min="0"
                                                    max="1"
                                                    step="0.01"
                                                    value={graphParams.p_in} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, p_in: Math.min(1.0, Math.max(0.0, parseFloat(e.target.value) || 0.25)) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs text-slate-400 block mb-1">Between-community edge probability</label>
                                                <input 
                                                    type="number" 
                                                    min="0"
                                                    max="1"
                                                    step="0.01"
                                                    value={graphParams.p_out} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, p_out: Math.min(1.0, Math.max(0.0, parseFloat(e.target.value) || 0.02)) }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                            </div>
                                        </>
                                    )}
                                    {graphType === "barabasi_albert" && (
                                        <div>
                                            <label class="text-xs text-slate-400 block mb-1">Edges added per new node</label>
                                                <input 
                                                    type="number" 
                                                    value={graphParams.m} 
                                                    onChange={(e) => updateGraphParams(prev => ({ ...prev, m: parseInt(e.target.value) || 2 }))}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-md p-1.5 text-slate-200 text-sm neon-border-glow"
                                                />
                                        </div>
                                    )}

                                                    value={networkLayout}
                                                    onChange={(e) => handleLayoutChange(e.target.value)}
                                                    class="bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none cursor-pointer"
                                                >
                                                    <option value="preset">Preset spring layout</option>
                                                    <option value="cose">Force-directed layout</option>
                                                    <option value="community_clusters">Community clusters</option>
                                                    <option value="breadthfirst">Breadth-first</option>
                                                    <option value="random">Random</option>
                                                    <option value="circle">Circle</option>
                                                    <option value="grid">Grid</option>
                                                    <option value="concentric">Concentric</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* Graph Container with Legend */}
                                        <div class="flex-grow relative border border-slate-900 rounded-2xl min-h-[400px] h-full overflow-hidden">
                                            <div 
                                                ref={cyContainerRef} 
                                                class="absolute inset-0 bg-slate-950/60"
                                            ></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
