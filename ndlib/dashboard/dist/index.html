<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDlib Interactive Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Cytoscape.js for Graph rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-border-glow:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            border-color: rgba(99, 102, 241, 0.8);
        }

        /* Day Theme Override */
        body.theme-light {
            background: radial-gradient(circle at top right, #f8fafc, #e2e8f0) !important;
            color: #1e293b !important;
        }
        body.theme-light ::-webkit-scrollbar-track {
            background: #cbd5e1;
        }
        body.theme-light ::-webkit-scrollbar-thumb {
            background: #94a3b8;
        }
        
        /* Sidebar Logo */
        body.theme-light img[alt="NDlib Logo"] {
            filter: invert(0.85) !important;
        }

        /* Glassmorphism sidebar background */
        body.theme-light .glass-panel {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-right: 1px solid #cbd5e1 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05) !important;
        }

        /* Sidebar selectors, inputs, buttons */
        body.theme-light input, 
        body.theme-light select, 
        body.theme-light textarea {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #1e293b !important;
        }
        body.theme-light input:focus, 
        body.theme-light select:focus {
            border-color: #4f46e5 !important;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2) !important;
        }

        /* Label and Text Colors */
        body.theme-light .text-slate-400 {
            color: #475569 !important; /* Dark slate grey for uppercase labels */
            font-weight: 600 !important;
        }
        body.theme-light .text-slate-300 {
            color: #1e293b !important; /* Darker slate for description / labels */
        }
        body.theme-light .text-slate-200 {
            color: #1e293b !important;
        }
        body.theme-light .text-slate-100 {
            color: #0f172a !important;
        }
        body.theme-light .text-white {
            color: #0f172a !important;
        }
        body.theme-light .text-indigo-400 {
            color: #4f46e5 !important; /* Bright accessible indigo */
        }
        body.theme-light .text-indigo-300 {
            color: #4f46e5 !important;
        }

        /* Sidebar category tab bar background & inactive tabs */
        body.theme-light .bg-slate-900\/60 {
            background-color: #e2e8f0 !important;
            border-color: #cbd5e1 !important;
        }
        body.theme-light button.text-slate-400:not(.bg-indigo-600) {
            color: #475569 !important;
        }
        body.theme-light button.text-slate-400:not(.bg-indigo-600):hover {
            color: #0f172a !important;
        }

        /* Right visualizer top panel / tab bar container */
        body.theme-light .bg-slate-900\/50 {
            background-color: #f1f5f9 !important;
            border-bottom: 1px solid #cbd5e1 !important;
        }

        /* Visualizer active/inactive tab buttons */
        body.theme-light .bg-slate-800 {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
            border: 1px solid #4f46e5 !important;
        }
        body.theme-light button.text-slate-400 {
            color: #475569 !important;
        }
        body.theme-light button.text-slate-400:hover {
            color: #0f172a !important;
        }

        /* Export/control buttons */
        body.theme-light button.bg-slate-800 {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #334155 !important;
        }
        body.theme-light button.bg-slate-800:hover {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
            border-color: #94a3b8 !important;
        }
        body.theme-light button.bg-indigo-600 {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
        }
        body.theme-light button.bg-indigo-600:hover {
            background-color: #4338ca !important;
        }

        /* Borders & background panels */
        body.theme-light .border-slate-800 {
            border-color: #cbd5e1 !important;
        }
        body.theme-light .border-slate-900 {
            border-color: #cbd5e1 !important;
        }
        body.theme-light .border-slate-800\/80 {
            border-color: #cbd5e1 !important;
        }
        body.theme-light .bg-slate-950\/20 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1) !important;
        }
        body.theme-light .bg-slate-950\/40 {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05) !important;
        }
        body.theme-light .bg-slate-950\/60 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.theme-light .bg-slate-900\/40 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.theme-light .bg-slate-900 {
            background-color: #ffffff !important;
        }
        body.theme-light .hover_bg-slate-900\/50:hover {
            background-color: #f1f5f9 !important;
        }

        /* Playback control text labels */
        body.theme-light .text-slate-400.w-16 {
            color: #334155 !important;
            font-weight: 500 !important;
        }
    </style>
</head>
<body class="flex flex-col min-height-screen">

    <div id="root" class="w-full flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [models, setModels] = useState({});
            const [selectedCategory, setSelectedCategory] = useState("Epidemics");
            const [selectedModelName, setSelectedModelName] = useState("");
            const [modelParams, setModelParams] = useState({});
            const [graphType, setGraphType] = useState("erdos_renyi");
            const [graphParams, setGraphParams] = useState({
                n: 100,
                p: 0.1,
                m: 2,
                k: 4,
                community_groups: 4,
                community_size: 25,
                p_in: 0.25,
                p_out: 0.02,
                tau1: 2.0,
                tau2: 1.5,
                mu: 0.1,
                average_degree: 8,
                min_degree: 3,
                min_community: 20,
                max_iters: 500,
                file_content: "",
                file_format: "graphml",
                file_name: ""
            });
            const [iterations, setIterations] = useState(50);
            const [activeTab, setActiveTab] = useState("trends");
            const [networkPreview, setNetworkPreview] = useState(null);
            const [loadingMessage, setLoadingMessage] = useState("");
            const [selectedSeedNodes, setSelectedSeedNodes] = useState([]);

            // Simulation results
            const [results, setResults] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [apiBaseUrl, setApiBaseUrl] = useState(
                window.location.protocol === "file:" ? "http://127.0.0.1:5000" : ""
            );

            // Playback controls for network visualization
            const [currentPlaybackStep, setCurrentPlaybackStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const playbackIntervalRef = useRef(null);

            const [isDarkMode, setIsDarkMode] = useState(false); // Default false (Day layout)
            const [networkLayout, setNetworkLayout] = useState("preset");

            // Visual Model Builder State
            const [showModelBuilder, setShowModelBuilder] = useState(false);
            const [builderUseCase, setBuilderUseCase] = useState("epidemics");
            const [builderTemplateId, setBuilderTemplateId] = useState("sir");
            const [builderLeftSidebarCollapsed, setBuilderLeftSidebarCollapsed] = useState(false);
            const [builderRightSidebarCollapsed, setBuilderRightSidebarCollapsed] = useState(false);
            const [builderZoom, setBuilderZoom] = useState(1);
            const [customModels, setCustomModels] = useState([]);
            const [builderModelName, setBuilderModelName] = useState("MyCustomModel");
            const [builderNodes, setBuilderNodes] = useState([
                { id: "status_s", type: "status", x: 100, y: 150, data: { name: "Susceptible", code: 0 } },
                { id: "status_i", type: "status", x: 500, y: 150, data: { name: "Infected", code: 1 } },
                { id: "comp_stoch", type: "compartment", x: 300, y: 120, data: { name: "stochastic", type: "NodeStochastic", params: { rate: 0.05, triggering_status: "Infected" } } }
            ]);
            const [builderEdges, setBuilderEdges] = useState([
                { id: "edge_1", source: "status_s", target: "comp_stoch" },
                { id: "edge_2", source: "comp_stoch", target: "status_i" }
            ]);
            const [builderInitialStatus, setBuilderInitialStatus] = useState([
                { status: "Susceptible", ratio: 0.95 },
                { status: "Infected", ratio: 0.05 }
            ]);
            const [selectedElement, setSelectedElement] = useState(null);
            const [selectedNodeIds, setSelectedNodeIds] = useState([]);
            const [linkingSource, setLinkingSource] = useState(null);
            const [tempEdgeEnd, setTempEdgeEnd] = useState(null);
            const [draggingNodes, setDraggingNodes] = useState([]);
            const [dragAnchor, setDragAnchor] = useState(null);
            const linkingSourceRef = useRef(null);
            const builderNodesRef = useRef(builderNodes);
            const builderEdgesRef = useRef(builderEdges);
            const builderInitialStatusRef = useRef(builderInitialStatus);
            // Chart & Network refs
            const trendsChartRef = useRef(null);
            const prevalenceChartRef = useRef(null);
            const phaseChartRef = useRef(null);
            const opinionChartRef = useRef(null);
            const cytoscapeRef = useRef(null);
            const cyContainerRef = useRef(null);
            const communityDetectionOptions = [
                { value: "louvain_communities", label: "Louvain" },
                { value: "greedy_modularity_communities", label: "Greedy Modularity" },
                { value: "naive_greedy_modularity_communities", label: "Naive Greedy Modularity" },
                { value: "label_propagation_communities", label: "Label Propagation" },
                { value: "asyn_lpa_communities", label: "Async Label Propagation" },
                { value: "fast_label_propagation_communities", label: "Fast Label Propagation" },
                { value: "girvan_newman", label: "Girvan-Newman" },
                { value: "asyn_fluidc", label: "Async Fluid Communities" },
            ];

            const builderTemplates = {
                sir: {
                    useCase: "epidemics",
                    label: "SIR",
                    description: "Classic susceptible-infected-recovered flow with stochastic infection and recovery.",
                    modelName: "SIRBuilderModel",
                    nodes: [
                        { id: "sir_s", type: "status", x: 80, y: 150, data: { name: "Susceptible", code: 0 } },
                        { id: "sir_i", type: "status", x: 430, y: 150, data: { name: "Infected", code: 1 } },
                        { id: "sir_r", type: "status", x: 780, y: 150, data: { name: "Recovered", code: 2 } },
                        { id: "sir_infect", type: "compartment", x: 230, y: 115, data: { name: "infection", type: "NodeStochastic", params: { rate: 0.05, triggering_status: "Infected" } } },
                        { id: "sir_recover", type: "compartment", x: 580, y: 115, data: { name: "recovery", type: "NodeStochastic", params: { rate: 0.1, triggering_status: "Infected" } } }
                    ],
                    edges: [
                        { id: "sir_e1", source: "sir_s", target: "sir_infect" },
                        { id: "sir_e2", source: "sir_infect", target: "sir_i" },
                        { id: "sir_e3", source: "sir_i", target: "sir_recover" },
                        { id: "sir_e4", source: "sir_recover", target: "sir_r" }
                    ],
                    initialStatus: [
                        { status: "Susceptible", ratio: 0.95 },
                        { status: "Infected", ratio: 0.05 },
                        { status: "Recovered", ratio: 0.0 }
                    ]
                },
                algorithmic_bias: {
                    useCase: "continuous_opinions",
                    label: "Algorithmic Bias",
                    description: "Continuous-opinion starter that uses numeric opinion thresholds and influence blocks.",
                    modelName: "AlgorithmicBiasStarter",
                    nodes: [
                        { id: "ab_low", type: "status", x: 90, y: 150, data: { name: "LowOpinion", code: 0 } },
                        { id: "ab_high", type: "status", x: 460, y: 150, data: { name: "HighOpinion", code: 1 } },
                        { id: "ab_gate", type: "compartment", x: 250, y: 110, data: { name: "opinion_gate", type: "NodeNumericalVariable", params: { var: "opinion", var_type: "ATTRIBUTE", value: 0.5, op: ">=", probability: 1.0 } } },
                        { id: "ab_shift", type: "compartment", x: 620, y: 110, data: { name: "opinion_shift", type: "NodeStochastic", params: { rate: 0.15, triggering_status: "HighOpinion" } } },
                        { id: "ab_lock", type: "compartment", x: 620, y: 250, data: { name: "opinion_lock", type: "NodeStochastic", params: { rate: 0.15, triggering_status: "LowOpinion" } } },
                        { id: "ab_mix", type: "compartment", x: 400, y: 260, data: { name: "opinion_mix", type: "ConditionalComposition", params: { condition: "opinion_gate", first_branch: "opinion_shift", second_branch: "opinion_lock" } } }
                    ],
                    edges: [
                        { id: "ab_e1", source: "ab_low", target: "ab_gate" },
                        { id: "ab_e2", source: "ab_gate", target: "ab_mix", targetPort: "condition" },
                        { id: "ab_e3", source: "ab_shift", target: "ab_mix", targetPort: "if_true" },
                        { id: "ab_e4", source: "ab_lock", target: "ab_mix", targetPort: "if_false" },
                        { id: "ab_e5", source: "ab_mix", target: "ab_high" },
                        { id: "ab_e6", source: "ab_high", target: "ab_lock" }
                    ],
                    initialStatus: [
                        { status: "LowOpinion", ratio: 0.5 },
                        { status: "HighOpinion", ratio: 0.5 }
                    ]
                },
                majority_rule: {
                    useCase: "discrete_opinions",
                    label: "Majority Rule",
                    description: "Discrete-label starter that emphasizes categorical influence and consensus routing.",
                    modelName: "MajorityRuleStarter",
                    nodes: [
                        { id: "mr_yes", type: "status", x: 80, y: 150, data: { name: "Agree", code: 0 } },
                        { id: "mr_no", type: "status", x: 460, y: 150, data: { name: "Disagree", code: 1 } },
                        { id: "mr_gate", type: "compartment", x: 250, y: 110, data: { name: "stance_gate", type: "NodeCategoricalAttribute", params: { attribute: "stance", value: "majority", probability: 1.0 } } },
                        { id: "mr_support", type: "compartment", x: 620, y: 110, data: { name: "support", type: "NodeStochastic", params: { rate: 0.2, triggering_status: "Agree" } } },
                        { id: "mr_pushback", type: "compartment", x: 620, y: 250, data: { name: "pushback", type: "NodeStochastic", params: { rate: 0.2, triggering_status: "Disagree" } } }
                    ],
                    edges: [
                        { id: "mr_e1", source: "mr_yes", target: "mr_gate" },
                        { id: "mr_e2", source: "mr_gate", target: "mr_support" },
                        { id: "mr_e3", source: "mr_support", target: "mr_no" },
                        { id: "mr_e4", source: "mr_no", target: "mr_pushback" },
                        { id: "mr_e5", source: "mr_pushback", target: "mr_yes" }
                    ],
                    initialStatus: [
                        { status: "Agree", ratio: 0.5 },
                        { status: "Disagree", ratio: 0.5 }
                    ]
                },
                coupled: {
                    useCase: "coupled",
                    label: "Coupled / Advanced",
                    description: "Mixed epidemic and opinion blocks for more expressive custom dynamics.",
                    modelName: "CoupledStarterModel",
                    nodes: [
                        { id: "cp_s", type: "status", x: 80, y: 150, data: { name: "Susceptible", code: 0 } },
                        { id: "cp_i", type: "status", x: 420, y: 150, data: { name: "Infected", code: 1 } },
                        { id: "cp_r", type: "status", x: 760, y: 150, data: { name: "Recovered", code: 2 } },
                        { id: "cp_opinion", type: "compartment", x: 250, y: 110, data: { name: "opinion_gate", type: "NodeNumericalVariable", params: { var: "opinion", var_type: "ATTRIBUTE", value: 0.4, op: ">", probability: 1.0 } } },
                        { id: "cp_infect", type: "compartment", x: 600, y: 110, data: { name: "infection", type: "NodeStochastic", params: { rate: 0.05, triggering_status: "Infected" } } },
                        { id: "cp_recover", type: "compartment", x: 600, y: 250, data: { name: "recovery", type: "NodeStochastic", params: { rate: 0.08, triggering_status: "Infected" } } },
                        { id: "cp_mix", type: "compartment", x: 400, y: 260, data: { name: "coupling", type: "ConditionalComposition", params: { condition: "opinion_gate", first_branch: "infection", second_branch: "recovery" } } }
                    ],
                    edges: [
                        { id: "cp_e1", source: "cp_s", target: "cp_opinion" },
                        { id: "cp_e2", source: "cp_opinion", target: "cp_mix", targetPort: "condition" },
                        { id: "cp_e3", source: "cp_infect", target: "cp_mix", targetPort: "if_true" },
                        { id: "cp_e4", source: "cp_recover", target: "cp_mix", targetPort: "if_false" },
                        { id: "cp_e5", source: "cp_mix", target: "cp_i" },
                        { id: "cp_e6", source: "cp_i", target: "cp_recover" },
                        { id: "cp_e7", source: "cp_recover", target: "cp_r" }
                    ],
                    initialStatus: [
                        { status: "Susceptible", ratio: 0.9 },
                        { status: "Infected", ratio: 0.1 },
                        { status: "Recovered", ratio: 0.0 }
                    ]
                }
            };

            const builderUseCaseCatalog = {
                epidemics: {
                    label: "Epidemics",
                    description: "Status-based epidemic workflows with stochastic, threshold, and attribute-driven compartments.",
                    templates: ["sir"],
                    palette: ["status", "NodeStochastic", "NodeThreshold", "EdgeStochastic", "CountDown", "NodeCategoricalAttribute", "NodeNumericalAttribute", "ConditionalComposition"]
                },
                continuous_opinions: {
                    label: "Continuous Opinions",
                    description: "Numeric opinion-oriented blocks centered on thresholds, numeric attributes, and conditional routing.",
                    templates: ["algorithmic_bias"],
                    palette: ["status", "NodeNumericalAttribute", "NodeNumericalVariable", "NodeThreshold", "CountDown", "ConditionalComposition"]
                },
                discrete_opinions: {
                    label: "Discrete Opinions",
                    description: "Label-based opinion flows with categorical and stochastic influence blocks.",
                    templates: ["majority_rule"],
                    palette: ["status", "NodeStochastic", "NodeCategoricalAttribute", "NodeNumericalAttribute", "CountDown", "ConditionalComposition"]
                },
                coupled: {
                    label: "Coupled / Advanced",
                    description: "All available blocks for mixed epidemic-opinion experiments and custom couplings.",
                    templates: ["coupled", "sir", "algorithmic_bias", "majority_rule"],
                    palette: ["status", "NodeStochastic", "NodeThreshold", "EdgeStochastic", "CountDown", "NodeCategoricalAttribute", "NodeNumericalAttribute", "NodeNumericalVariable", "ConditionalComposition"]
                }
            };

            const builderAccentColors = {
                sky: { color: "#38bdf8", softBg: "rgba(56, 189, 248, 0.12)", softBorder: "rgba(56, 189, 248, 0.35)" },
                purple: { color: "#c084fc", softBg: "rgba(168, 85, 247, 0.12)", softBorder: "rgba(168, 85, 247, 0.35)" },
                pink: { color: "#f472b6", softBg: "rgba(236, 72, 153, 0.12)", softBorder: "rgba(236, 72, 153, 0.35)" },
                emerald: { color: "#34d399", softBg: "rgba(16, 185, 129, 0.12)", softBorder: "rgba(16, 185, 129, 0.35)" },
                cyan: { color: "#22d3ee", softBg: "rgba(34, 211, 238, 0.12)", softBorder: "rgba(34, 211, 238, 0.35)" }
            };

            const getBuilderCanvasPoint = (e) => {
                const canvas = document.getElementById("builder-canvas")?.getBoundingClientRect();
                if (!canvas) return null;
                return {
                    x: (e.clientX - canvas.left) / builderZoom,
                    y: (e.clientY - canvas.top) / builderZoom
                };
            };

            const clearBuilderInteractionState = () => {
                setDraggingNodes([]);
                setDragAnchor(null);
                setLinkingSource(null);
                setTempEdgeEnd(null);
                linkingSourceRef.current = null;
            };

            useEffect(() => {
                builderNodesRef.current = builderNodes;
            }, [builderNodes]);

            useEffect(() => {
                builderEdgesRef.current = builderEdges;
            }, [builderEdges]);

            useEffect(() => {
                builderInitialStatusRef.current = builderInitialStatus;
            }, [builderInitialStatus]);

            const clearBuilderSelection = () => {
                setSelectedNodeIds([]);
                setSelectedElement(null);
            };

            const focusBuilderNode = (nodeId) => {
                const node = builderNodes.find(n => n.id === nodeId) || null;
                if (!node) return;
                setSelectedNodeIds([nodeId]);
                setSelectedElement(node);
            };

            const toggleBuilderNodeSelection = (nodeId) => {
                const node = builderNodes.find(n => n.id === nodeId) || null;
                if (!node) return;
                setSelectedNodeIds(prev => {
                    const exists = prev.includes(nodeId);
                    const next = exists ? prev.filter(id => id !== nodeId) : [...prev, nodeId];
                    if (!exists || next.length === 0) {
                        setSelectedElement(exists ? (next.length ? builderNodes.find(n => n.id === next[next.length - 1]) || null : null) : node);
                    } else {
                        setSelectedElement(node);
                    }
                    return next;
                });
            };

            const isNodeMultiSelected = (nodeId) => selectedNodeIds.includes(nodeId);

            const clampBuilderZoom = (value) => Math.min(1.75, Math.max(0.5, Math.round(value * 100) / 100));
            const zoomBuilderCanvas = (delta) => {
                setBuilderZoom(prev => clampBuilderZoom(prev + delta));
            };

            const getBuilderTemplate = (templateId) => builderTemplates[templateId] || builderTemplates.sir;

            const loadBuilderTemplate = (templateId, overrideUseCase = null) => {
                const template = getBuilderTemplate(templateId);
                clearBuilderInteractionState();
                clearBuilderSelection();
                setBuilderUseCase(overrideUseCase || template.useCase);
                setBuilderTemplateId(templateId);
                setBuilderModelName(template.modelName);
                setBuilderNodes(template.nodes.map(node => ({
                    ...node,
                    data: {
                        ...node.data,
                        params: node.data && node.data.params ? { ...node.data.params } : undefined
                    }
                })));
                setBuilderEdges(template.edges.map(edge => ({ ...edge })));
                setBuilderInitialStatus(template.initialStatus.map(item => ({ ...item })));
                autoLayoutBuilder(template.nodes, template.edges);
            };

            const queueBuilderTemplateReload = (templateId, useCase) => {
                clearBuilderInteractionState();
                clearBuilderSelection();
                setShowModelBuilder(true);
                loadBuilderTemplate(templateId, useCase);
            };

            const resolveBuilderDropTarget = (event) => {
                const element = event?.target?.closest?.("[data-builder-handle-type], [data-builder-node-id]")
                    || (typeof document !== "undefined" && typeof event?.clientX === "number" && typeof event?.clientY === "number"
                        ? document.elementFromPoint(event.clientX, event.clientY)
                        : null);
                if (!element) return null;

                const handleEl = element.closest?.("[data-builder-handle-type]");
                const nodeEl = element.closest?.("[data-builder-node-id]");
                const targetNodeId = nodeEl?.dataset?.builderNodeId || handleEl?.dataset?.builderNodeId || null;
                if (!targetNodeId) return null;

                const handleType = handleEl?.dataset?.builderHandleType || null;
                return {
                    targetNodeId,
                    targetPort: handleType || null
                };
            };

            const finalizeBuilderLinkFromEvent = (event, source = linkingSourceRef.current || linkingSource) => {
                if (!source) return false;
                const target = resolveBuilderDropTarget(event);
                if (!target) return false;

                const targetNode = builderNodesRef.current.find(n => n.id === target.targetNodeId);
                if (!targetNode) return false;

                if (target.targetPort) {
                    return finalizeBuilderLink(source, target.targetNodeId, target.targetPort);
                }

                let targetPort = "in";
                if (targetNode.data.type === "ConditionalComposition") {
                    const liveEdges = builderEdgesRef.current || builderEdges;
                    const hasCond = liveEdges.some(edge => edge.target === target.targetNodeId && edge.targetPort === "condition");
                    const hasTrue = liveEdges.some(edge => edge.target === target.targetNodeId && edge.targetPort === "if_true");
                    if (!hasCond) targetPort = "condition";
                    else if (!hasTrue) targetPort = "if_true";
                    else targetPort = "if_false";
                }

                return finalizeBuilderLink(source, target.targetNodeId, targetPort);
            };

            useEffect(() => {
                const handleGlobalPointerUp = (event) => {
                    finalizeBuilderLinkFromEvent(event);
                    clearBuilderInteractionState();
                };
                window.addEventListener("mouseup", handleGlobalPointerUp);
                window.addEventListener("pointerup", handleGlobalPointerUp);
                window.addEventListener("blur", handleGlobalPointerUp);
                return () => {
                    window.removeEventListener("mouseup", handleGlobalPointerUp);
                    window.removeEventListener("pointerup", handleGlobalPointerUp);
                    window.removeEventListener("blur", handleGlobalPointerUp);
                };
            }, []);

            const autoLayoutBuilder = (nodes = builderNodes, edges = builderEdges) => {
                if (!Array.isArray(nodes) || nodes.length === 0) return;

                const nodeMap = new Map(nodes.map(node => [node.id, node]));
                const incomingCounts = new Map(nodes.map(node => [node.id, 0]));
                const outgoing = new Map(nodes.map(node => [node.id, []]));

                edges.forEach(edge => {
                    if (!nodeMap.has(edge.source) || !nodeMap.has(edge.target)) {
                        return;
                    }
                    incomingCounts.set(edge.target, (incomingCounts.get(edge.target) || 0) + 1);
                    outgoing.get(edge.source).push(edge.target);
                });

                const levels = new Map();
                const queue = [];

                nodes.forEach(node => {
                    if ((incomingCounts.get(node.id) || 0) === 0) {
                        levels.set(node.id, node.type === "status" ? 0 : 1);
                        queue.push(node.id);
                    }
                });

                if (queue.length === 0) {
                    nodes.forEach(node => {
                        levels.set(node.id, node.type === "status" ? 0 : 1);
                        queue.push(node.id);
                    });
                }

                while (queue.length > 0) {
                    const sourceId = queue.shift();
                    const sourceLevel = levels.get(sourceId) || 0;

                    (outgoing.get(sourceId) || []).forEach(targetId => {
                        const nextLevel = sourceLevel + 1;
                        if (!levels.has(targetId)) {
                            levels.set(targetId, nextLevel);
                            queue.push(targetId);
                        }
                    });
                }

                const grouped = new Map();
                nodes.forEach(node => {
                    const level = levels.has(node.id) ? levels.get(node.id) : (node.type === "status" ? 0 : 1);
                    if (!grouped.has(level)) grouped.set(level, []);
                    grouped.get(level).push(node);
                });

                const sortedLevels = Array.from(grouped.keys()).sort((a, b) => a - b);
                const xGap = 260;
                const yGap = 150;
                const startX = 80;
                const centerY = 220;

                const positionedNodes = nodes.map(node => ({ ...node }));

                sortedLevels.forEach((level, levelIndex) => {
                    const levelNodes = grouped.get(level).slice().sort((a, b) => {
                        const aName = String(a.data?.name || a.id);
                        const bName = String(b.data?.name || b.id);
                        return aName.localeCompare(bName);
                    });
                    const totalHeight = (levelNodes.length - 1) * yGap;
                    const baseY = centerY - totalHeight / 2;

                    levelNodes.forEach((node, index) => {
                        const targetNode = positionedNodes.find(n => n.id === node.id);
                        if (targetNode) {
                            targetNode.x = startX + levelIndex * xGap;
                            targetNode.y = Math.max(70, baseY + index * yGap);
                        }
                    });
                });

                setBuilderNodes(positionedNodes);
            };

            const getVisibleBuilderBlocks = () => {
                const allowed = new Set(builderUseCaseCatalog[builderUseCase]?.palette || []);
                return [
                    {

            const clearPlayState = () => {
                setIsPlaying(false);

            });

                if (results && Array.isArray(results.nodes)) {

            const currentGraphNodeCount = getCurrentGraphNodeCount();

            const toggleSeedNode = (nodeId) => {

            const syncSeedSelection = () => {
                if (!cytoscapeRef.current) return;
                const selected = new Set(selectedSeedNodes.map(String));
                cytoscapeRef.current.batch(() => {
                    cytoscapeRef.current.nodes().forEach(node => {

            const loadModels = (baseUrl = apiBaseUrl) => {
                setError("");
                fetch(baseUrl + "/api/models")
                    .then(res => {

                        return res.json();

                    .then(data => {
                        if (data.error) throw new Error(data.error);
                        setModels(data);
                        // Select first model of selected category as default
                        const firstModel = Object.keys(data).find(k => data[k].category === "Epidemics");
                        if (firstModel) {
                            selectModel(firstModel, data);

                    })
                    .catch(err => {

            // Fetch available models on mount
            useEffect(() => {
                loadModels();

            const selectModel = (name, modelsList = models) => {
                setSelectedModelName(name);
                const model = modelsList[name];
                if (!model) return;
                setSelectedCategory(model.category || selectedCategory);

                // Build default parameters
                const defaults = {};
                // Model level
                Object.keys(model.parameters.model).forEach(k => {
                    defaults[k] = model.parameters.model[k].default !== undefined ? model.parameters.model[k].default : 0.1;
                });
                // Node level
                Object.keys(model.parameters.nodes).forEach(k => {
                    defaults[k] = model.parameters.nodes[k].default !== undefined ? model.parameters.nodes[k].default : 0.1;
                });
                // Edge level
                Object.keys(model.parameters.edges).forEach(k => {
                    defaults[k] = model.parameters.edges[k].default !== undefined ? model.parameters.edges[k].default : 1;
                });

                // Ensure initial infection fraction is set
                if (model.category === "Epidemics" && model.parameters.model["fraction_infected"] && defaults["fraction_infected"] === undefined) {
                    defaults["fraction_infected"] = 0.05;
                }
                if (model.category === "Epidemics" &&
                    model.discrete_state !== false &&
                    defaults["fraction_infected"] === undefined &&
                    defaults["percentage_infected"] === undefined) {
                    defaults["percentage_infected"] = 5;
                }
                if (model.requires_community_assignment) {
                    defaults["community_detection_algorithm"] = model.community_detection_default || "louvain_communities";
                    defaults["community_detection_k"] = 2;
                }

                clearPlayState();
                clearSeedSelection();
                setResults(null);
                setModelParams(defaults);
                setActiveTab(model.discrete_state === false ? "opinion_evolution" : "trends");
            };

            const handleCategoryChange = (cat) => {
                setSelectedCategory(cat);
                const firstModel = Object.keys(models).find(k => models[k].category === cat);
                if (firstModel) {
                    selectModel(firstModel);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                resetGraphState();

                const reader = new FileReader();
                reader.onload = (event) => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let format = "graphml";
                    if (ext === "gml") format = "gml";
                    else if (ext === "txt" || ext === "csv") format = "edgelist";

                    setGraphParams(prev => ({
                        ...prev,
                        file_content: event.target.result,
                        file_format: format,
                        file_name: file.name
                    }));
                };
                reader.readAsText(file);
            };

            const handleGraphTypeChange = (value) => {
                resetGraphState();
                setGraphType(value);
            };

            const updateGraphParams = (updater) => {
                resetGraphState();
                setGraphParams(updater);
            };

            const getGraphSignature = () => JSON.stringify({
                graphType,
                graphParams
            });

            const generateNetwork = async ({ silent = false } = {}) => {
                if (!silent) {
                    setLoading(true);
                    setLoadingMessage("Generating network...");
                }
                setError("");
                try {
                    clearSeedSelection();
                    const payload = getGraphPayload();
                    const res = await fetch(apiBaseUrl + "/api/network", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    data.signature = getGraphSignature();
                    setNetworkPreview(data);
                    setResults(null);
                    setCurrentPlaybackStep(0);
                    setActiveTab("network");
                    if (data.node_count < 1500) {
                        setTimeout(() => {
                            renderNetworkPreview(data);
                        }, 50);
                    }
                    return data;
                } catch (err) {
                    setError(err.message || "Network generation failed.");
                    return null;
                } finally {
                    if (!silent) {
                        setLoading(false);
                        setLoadingMessage("");
                    }
                }
            };

            const runSimulation = async () => {
                setLoading(true);
                setLoadingMessage("Executing network simulation...");
                setError("");
                setResults(null);
                clearPlayState();

                try {
                    const preview = networkPreview && networkPreview.signature === getGraphSignature()
                        ? networkPreview
                        : await generateNetwork({ silent: true });

                    if (!preview) {
                        return;
                    }

                    const payload = {
                        model_class: selectedModelName,
                        category: selectedCategory,
                        graph_data: preview,
                        model_params: modelParams,
                        selected_seed_nodes: selectedSeedNodes,
                        iterations: iterations
                    };

                    const res = await fetch(apiBaseUrl + "/api/simulate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (data.error) {
                        setError(data.error);
                        return;
                    }

                    data.continuousVariable = detectContinuousVariable(data);

                    // Accumulate state changes over iterations to build absolute status history
                    const history = [];
                    const currentStatus = {};
                    
                    let minOp = 0;
                    let maxOp = 1;
                    let firstOp = true;
                    data.nodes.forEach(n => {
                        currentStatus[n.id] = 0;
                    });
                    data.iterations.forEach(it => {
                        Object.keys(it.status).forEach(nodeId => {
                            const val = data.discrete_state === false
                                ? getContinuousValue(it.status[nodeId], data.continuousVariable)
                                : it.status[nodeId];
                            currentStatus[nodeId] = val;
                            
                            if (typeof val === "number" && Number.isFinite(val)) {
                                if (selectedCategory === "Opinions") {
                                    if (firstOp) {
                                        minOp = val;
                                        maxOp = val;
                                        firstOp = false;
                                    } else {
                                        if (val < minOp) minOp = val;
                                        if (val > maxOp) maxOp = val;
                                    }
                                }
                            }
                        });
                        history.push({ ...currentStatus });
                    });
                    data.absoluteStatusHistory = history;
                    data.isContinuous = data.discrete_state === false;
                    
                    if (selectedCategory === "Opinions") {
                        if (maxOp - minOp < 1e-5) {
                            minOp = 0;
                            maxOp = 1;
                        }
                        data.minOpinion = minOp;
                        data.maxOpinion = maxOp;
                    }

                    setResults(data);
                    setCurrentPlaybackStep(0);
                    setActiveTab(data.discrete_state === false ? "opinion_evolution" : "trends");
                    // Render charts automatically
                    setTimeout(() => {
                        if (data.discrete_state !== false) {
                            renderTrendsChart(data);
                        }
                        if (selectedCategory === "Epidemics") {
                            renderPrevalenceChart(data);
                            renderPhasePortrait(data);
                        } else if (data.discrete_state === false) {
                            renderOpinionEvolution(data);
                        }
                        initCytoscape(data);
                    }, 50);
                } catch (err) {
                    setError(err.message || "Network error while running simulation.");
                } finally {
                    setLoading(false);
                    setLoadingMessage("");
                }
            };

            // Color Palette for Compartments / Opinions
            const getStatusColor = (statusCode, value = null, statuses = {}, minOp = 0, maxOp = 1, isContinuous = false) => {
                // If continuous opinions (floating values)
                if (isContinuous && value !== null) {
                    const norm = (maxOp === minOp) ? 0.5 : (value - minOp) / (maxOp - minOp);
                    // Blue rgb(59, 130, 246) to Red rgb(239, 68, 68)
                    const r = Math.floor(59 + norm * (239 - 59));
                    const g = Math.floor(130 + norm * (68 - 130));
                    const b = Math.floor(246 + norm * (68 - 246));
                    return `rgb(${r}, ${g}, ${b})`;
                }

                // Epidemic classes
                const colors = {
                    0: "#38bdf8", // Susceptible (Sky Blue)
                    1: "#f97316", // Infected / Asymptomatic (Orange)
                    2: "#ef4444", // Infected (Symptomatic) (Red)
                    3: "#22c55e", // Removed / Recovered (Green)
                    4: "#10b981", // Removed/Recovered (Emerald)
                    "-1": "#64748b", // Blocked (Slate)
                };
                return colors[statusCode] || "#6366f1";
            };

            const getContinuousValue = (state, preferredKey = null) => {
                if (typeof state === "number" && Number.isFinite(state)) {
                    return state;
                }

                if (!state || typeof state !== "object") {
                    return 0;
                }

                if (preferredKey !== null && state[preferredKey] !== undefined) {
                    const preferredValue = state[preferredKey];
                    if (typeof preferredValue === "number" && Number.isFinite(preferredValue)) {
                        return preferredValue;
                    }
                }

                for (const value of Object.values(state)) {
                    if (typeof value === "number" && Number.isFinite(value)) {
                        return value;
                    }
                }

                for (const value of Object.values(state)) {
                    if (value && typeof value === "object" && !Array.isArray(value)) {
                        const nestedValue = getContinuousValue(value, preferredKey);
                        if (typeof nestedValue === "number" && Number.isFinite(nestedValue)) {
                            return nestedValue;
                        }
                    }
                }

                return 0;
            };

            const getContinuousBinColor = (value, minOp = 0, maxOp = 1, bins = 10) => {
                if (typeof value !== "number" || !Number.isFinite(value)) {
                    return "#64748b";
                }

                const clampedBins = Math.max(2, bins);
                const span = maxOp - minOp;
                const normalized = span === 0 ? 0.5 : (value - minOp) / span;
                const safeNormalized = Math.min(1, Math.max(0, normalized));
                const binIndex = Math.min(
                    clampedBins - 1,
                    Math.max(0, Math.floor(safeNormalized * clampedBins))
                );

                const palette = [
                    "#2563eb",
                    "#3b82f6",
                    "#6366f1",
                    "#8b5cf6",
                    "#a855f7",
                    "#d946ef",
                    "#ec4899",
                    "#f43f5e",
                    "#ef4444",
                    "#f97316",
                ];

                return palette[Math.min(binIndex, palette.length - 1)];
            };

            const isThresholdParameter = (paramName, paramInfo = {}) => {
                const name = String(paramName || "").toLowerCase();
                const descr = String(paramInfo.descr || "").toLowerCase();
                return (
                    name.includes("threshold") ||
                    descr.includes("threshold") ||
                    name === "epsilon"
                );
            };

            const clampUnitFloat = (value, fallback = 0.1) => {
                const parsed = parseFloat(value);
                if (!Number.isFinite(parsed)) return fallback;
                return Math.min(1.0, Math.max(0.0, parsed));
            };

            const getCommunityColor = (communityId) => {
                if (communityId === undefined || communityId === null || Number.isNaN(Number(communityId))) {
                    return "#6366f1";
                }

                const palette = [
                    "#6366f1",
                    "#06b6d4",
                    "#10b981",
                    "#f59e0b",
                    "#ef4444",
                    "#8b5cf6",
                    "#ec4899",
                    "#14b8a6",
                    "#f97316",
                    "#84cc16",
                ];

                return palette[Math.abs(parseInt(communityId, 10)) % palette.length];
            };

            const buildCommunityLayoutPositions = (data) => {
                if (!data || !Array.isArray(data.nodes) || data.nodes.length === 0) {
                    return {};
                }

                const communities = new Map();
                data.nodes.forEach((node, index) => {
                    const communityKey = node.com !== undefined && node.com !== null ? String(node.com) : "__default__";
                    if (!communities.has(communityKey)) {
                        communities.set(communityKey, []);
                    }
                    communities.get(communityKey).push({ node, index });
                });

                const communityKeys = Array.from(communities.keys()).sort((a, b) => {
                    if (a === "__default__") return 1;
                    if (b === "__default__") return -1;
                    return parseInt(a, 10) - parseInt(b, 10);
                });

                const count = communityKeys.length;
                const centerRadius = Math.max(180, Math.min(420, Math.sqrt(data.nodes.length) * 55));
                const positions = {};

                communityKeys.forEach((communityKey, communityIndex) => {
                    const members = communities.get(communityKey);
                    const angle = (2 * Math.PI * communityIndex) / Math.max(1, count);
                    const centerX = Math.cos(angle) * centerRadius;
                    const centerY = Math.sin(angle) * centerRadius;
                    const memberRadius = Math.max(45, Math.min(140, 14 * Math.sqrt(members.length + 1)));

                    members.forEach((entry, memberIndex) => {
                        const memberAngle = (2 * Math.PI * memberIndex) / Math.max(1, members.length);
                        positions[entry.node.id] = {
                            x: centerX + Math.cos(memberAngle) * memberRadius,
                            y: centerY + Math.sin(memberAngle) * memberRadius
                        };
                    });
                });

                return positions;
            };

            const applyNetworkLayout = (cy, layoutName, data) => {
                if (!cy) return;

                if (layoutName === "community_clusters") {
                    const positions = buildCommunityLayoutPositions(data);
                    cy.batch(() => {
                        cy.nodes().forEach(node => {
                            const pos = positions[node.id()];
                            if (pos) {
                                node.position(pos);
                            }
                        });
                    });
                    cy.fit();
                    cy.center();
                    return;
                }

                if (layoutName === "preset") {
                    cy.layout({ name: "preset" }).run();
                } else {
                    cy.layout({ name: layoutName, animate: true, animationDuration: 500 }).run();
                }

                setTimeout(() => {
                    cy.fit();
                    cy.center();
                }, 550);
            };

            const detectContinuousVariable = (data) => {
                if (!data || data.discrete_state !== false || !Array.isArray(data.iterations)) {
                    return null;
                }

                for (const it of data.iterations) {
                    if (!it || !it.status) continue;
                    for (const nodeState of Object.values(it.status)) {
                        if (nodeState && typeof nodeState === "object" && !Array.isArray(nodeState)) {
                            const numericKeys = Object.keys(nodeState).filter(
                                key => typeof nodeState[key] === "number" && Number.isFinite(nodeState[key])
                            );
                            if (numericKeys.length > 0) {
                                return numericKeys[0];
                            }
                        }
                    }
                }

                return null;
            };

            const renderTrendsChart = (data) => {
                if (trendsChartRef.current) trendsChartRef.current.destroy();
                if (data.discrete_state === false) return;

                const ctx = document.getElementById("trendsChart").getContext("2d");
                const iterationsList = data.iterations;
                const T = iterationsList.length;

                // Map state codes to names
                const statusNames = {};
                Object.keys(data.statuses).forEach(k => {
                    statusNames[data.statuses[k]] = k;
                });

                const datasets = [];
                const statusCounts = {};

                // Initialize counts arrays
                Object.keys(statusNames).forEach(code => {
                    statusCounts[code] = [];
                });

                iterationsList.forEach(it => {
                    Object.keys(statusNames).forEach(code => {
                        statusCounts[code].push(it.node_count[code] || 0);
                    });
                });

                Object.keys(statusNames).forEach(code => {
                    datasets.push({
                        label: statusNames[code],
                        data: statusCounts[code],
                        borderColor: getStatusColor(parseInt(code)),
                        backgroundColor: getStatusColor(parseInt(code)) + "20",
                        borderWidth: 2,
                        tension: 0.2
                    });
                });

                trendsChartRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: Array.from({ length: T }, (_, i) => i),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: "#f8fafc" } }
                        },
                        scales: {
                            x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
                            y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } }
                        }
                    }
                });
            };

            const renderPrevalenceChart = (data) => {
                if (prevalenceChartRef.current) prevalenceChartRef.current.destroy();

                const canvas = document.getElementById("prevalenceChart");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const iterationsList = data.iterations;
                const T = iterationsList.length;

                // Map state codes to names
                const statusNames = {};
                Object.keys(data.statuses).forEach(k => {
                    statusNames[data.statuses[k]] = k;
                });

                const datasets = [];
                const statusDeltas = {};

                // Initialize counts arrays
                Object.keys(statusNames).forEach(code => {
                    statusDeltas[code] = [];
                });

                iterationsList.forEach(it => {
                    Object.keys(statusNames).forEach(code => {
                        statusDeltas[code].push(it.status_delta[code] || 0);
                    });
                });

                Object.keys(statusNames).forEach(code => {
                    datasets.push({
                        label: `New ${statusNames[code]}`,
                        data: statusDeltas[code],
                        borderColor: getStatusColor(parseInt(code)),
                        backgroundColor: getStatusColor(parseInt(code)) + "20",
                        borderWidth: 2,
                        tension: 0.2
                    });
                });

                prevalenceChartRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: Array.from({ length: T }, (_, i) => i),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: isDarkMode ? "#f8fafc" : "#1e293b" } }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: "Iterations", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            },
                            y: { 
                                title: { display: true, text: "New Nodes (Delta)", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            }
                        }
                    }
                });
            };

            const renderOpinionEvolution = (data) => {
                if (opinionChartRef.current) opinionChartRef.current.destroy();
                if (data.discrete_state !== false) return;

                const canvas = document.getElementById("opinionChart");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const iterationsList = Array.isArray(data.absoluteStatusHistory)
                    ? data.absoluteStatusHistory
                    : data.iterations;
                const T = iterationsList.length;

                // Reconstruct opinion trajectory for each node
                const nodeTrajectories = {};

                data.nodes.forEach(n => {
                    nodeTrajectories[n.id] = Array(T).fill(0);
                });

                iterationsList.forEach((snapshot, step) => {
                    data.nodes.forEach(n => {
                        nodeTrajectories[n.id][step] = getContinuousValue(
                            snapshot[n.id],
                            data.continuousVariable
                        );
                    });
                });

                data.nodes.forEach(n => {
                    let lastVal = nodeTrajectories[n.id][0];
                    for (let i = 0; i < T; i++) {
                        if (typeof nodeTrajectories[n.id][i] === "number" && Number.isFinite(nodeTrajectories[n.id][i])) {
                            lastVal = nodeTrajectories[n.id][i];
                        } else {
                            nodeTrajectories[n.id][i] = lastVal;
                        }
                    }
                });

                const maxLines = 100;
                const nodeIds = Object.keys(nodeTrajectories);
                const stepSize = Math.max(1, Math.floor(nodeIds.length / maxLines));
                const datasets = [];

                nodeIds.forEach((nodeId, idx) => {
                    if (idx % stepSize !== 0) return;

                    const traj = nodeTrajectories[nodeId];
                    const finalVal = traj[T - 1];
                    let color = "#ff0000";
                    if (finalVal < -0.33 || (selectedCategory !== "Opinions" && finalVal === 0)) {
                        color = "#ef4444";
                    } else if (finalVal > 0.33) {
                        color = "#22c55e";
                    } else {
                        color = "#eab308";
                    }

                    datasets.push({
                        label: `Node ${nodeId}`,
                        data: traj,
                        borderColor: color,
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: false,
                        alpha: 0.4
                    });
                });

                opinionChartRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: Array.from({ length: T }, (_, i) => i),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: "Iterations", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            },
                            y: { 
                                title: { display: true, text: "Opinion Value", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            }
                        }
                    }
                });
            };

            const renderPhasePortrait = (data) => {
                if (phaseChartRef.current) phaseChartRef.current.destroy();

                const canvas = document.getElementById("phaseChart");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const iterationsList = data.iterations;

                // Use Susceptible vs Infected
                const susCode = data.statuses["Susceptible"] !== undefined ? data.statuses["Susceptible"] : 0;
                const infCode = data.statuses["Infected"] !== undefined ? data.statuses["Infected"] : 1;

                const points = iterationsList.map(it => ({
                    x: it.node_count[susCode] || 0,
                    y: it.node_count[infCode] || 0
                }));

                phaseChartRef.current = new Chart(ctx, {
                    type: "scatter",
                    data: {
                        datasets: [{
                            label: "S vs I Trajectory",
                            data: points,
                            showLine: true,
                            borderColor: "#a855f7",
                            backgroundColor: "#c084fc",
                            borderWidth: 2,
                            pointRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: "#f8fafc" } }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: "Susceptible Nodes", color: "#f8fafc" },
                                grid: { color: "#334155" },
                                ticks: { color: "#94a3b8" }
                            },
                            y: {
                                title: { display: true, text: "Infected Nodes", color: "#f8fafc" },
                                grid: { color: "#334155" },
                                ticks: { color: "#94a3b8" }
                            }
                        }
                    }
                });
            };

            const initCytoscape = (data, layoutName = networkLayout) => {
                const elements = [];
                // Add nodes
                data.nodes.forEach(n => {
                    const communityColor = getCommunityColor(n.com);
                    elements.push({
                        data: {
                            id: n.id,
                            label: n.label,
                            com: n.com,
                            statusColor: communityColor
                        },
                        position: { x: n.x, y: n.y }
                    });
                });
                // Add edges
                data.edges.forEach(e => {
                    elements.push({ data: { source: e.source, target: e.target } });
                });

                cytoscapeRef.current = cytoscape({
                    container: cyContainerRef.current,
                    elements: elements,
                    style: [
                        {
                            selector: "node",
                            style: {
                                "background-color": "data(statusColor)",
                                "label": data.nodes.length > 200 ? "" : "data(label)",
                                "color": isDarkMode ? "#f8fafc" : "#0f172a",
                                "font-size": "10px",
                                "width": "16px",
                                "height": "16px"
                            }
                        },
                        {
                            selector: "node.selected-seed",
                            style: {
                                "border-width": 4,
                                "border-color": "#ffffff",
                                "background-color": "#ef4444",
                                "overlay-color": "#ef4444",
                                "overlay-opacity": 0.2,
                                "overlay-padding": 6,
                                "z-index": 999,
                            }
                        },
                        {
                            selector: "edge",
                            style: {
                                "width": 1.5,
                                "line-color": isDarkMode ? "#475569" : "#cbd5e1",
                                "opacity": 0.4
                            }
                        }
                    ],
                    layout: { name: "preset" },
                    userZoomingEnabled: true,
                    userPanningEnabled: true
                });

                cytoscapeRef.current.on("tap", "node", (evt) => {
                    if (results || selectedCategory !== "Epidemics" || !currentModel || currentModel.discrete_state === false) return;
                    toggleSeedNode(evt.target.id());
                });

                cytoscapeRef.current.on("tap", (evt) => {
                    if (results || selectedCategory !== "Epidemics" || !currentModel || currentModel.discrete_state === false) return;
                    if (evt.target === cytoscapeRef.current) {
                        clearSeedSelection();
                    }
                });

                applyNetworkLayout(cytoscapeRef.current, layoutName, data);
                updateNetworkColors(0, data);
                syncSeedSelection();
            };

            const updateNetworkColors = (step, data = results) => {
                if (!cytoscapeRef.current || !data || !data.absoluteStatusHistory) return;

                const safeStep = Math.max(0, Math.min(step, data.absoluteStatusHistory.length - 1));
                const nodeStatus = data.absoluteStatusHistory[safeStep];
                if (!nodeStatus) return;

                const minOp = data.minOpinion !== undefined ? data.minOpinion : 0;
                const maxOp = data.maxOpinion !== undefined ? data.maxOpinion : 1;
                const stepValues = Object.values(nodeStatus)
                    .map(value => getContinuousValue(value, data.continuousVariable))
                    .filter(value => typeof value === "number" && Number.isFinite(value));
                const stepMin = stepValues.length ? Math.min(...stepValues) : minOp;
                const stepMax = stepValues.length ? Math.max(...stepValues) : maxOp;

                const isContinuous = data.isContinuous === true || data.discrete_state === false;
                cytoscapeRef.current.batch(() => {
                    cytoscapeRef.current.nodes().forEach(node => {
                        const id = node.id();
                        const statusVal = nodeStatus[id] !== undefined
                            ? getContinuousValue(nodeStatus[id], data.continuousVariable)
                            : 0;
                        const color = isContinuous
                            ? getContinuousBinColor(statusVal, stepMin, stepMax, 10)
                            : getStatusColor(
                                statusVal,
                                null,
                                data.statuses,
                                minOp,
                                maxOp,
                                false
                            );
                        node.data("statusColor", color);
                        node.style({
                            "background-color": color,
                            "border-color": color,
                        });
                    });
                });
                cytoscapeRef.current.style().update();
            };

            const handlePlaybackSliderChange = (e) => {
                const val = parseInt(e.target.value);
                setCurrentPlaybackStep(val);
                updateNetworkColors(val);
            };

            // Playback automation
            useEffect(() => {
                if (isPlaying) {
                    playbackIntervalRef.current = setInterval(() => {
                        setCurrentPlaybackStep(prev => {
                            const next = prev + 1;
                            if (next >= results.iterations.length) {
                                setIsPlaying(false);
                                clearInterval(playbackIntervalRef.current);
                                return prev;
                            }
                            updateNetworkColors(next);
                            return next;
                        });
                    }, 300);
                } else {
                    if (playbackIntervalRef.current) clearInterval(playbackIntervalRef.current);
                }
                return () => { if (playbackIntervalRef.current) clearInterval(playbackIntervalRef.current); };
            }, [isPlaying, results]);

            // Toggle body class for day/night layouts
            useEffect(() => {
                if (isDarkMode) {
                    document.body.classList.remove("theme-light");
                    document.body.classList.add("theme-dark");
                } else {
                    document.body.classList.remove("theme-dark");
                    document.body.classList.add("theme-light");
                }
            }, [isDarkMode]);

            // Re-render plots and styling when theme changes
            useEffect(() => {
                if (results) {
                    if (results.discrete_state !== false) {
                        renderTrendsChart(results);
                    }
                    if (selectedCategory === "Epidemics") {
                        renderPrevalenceChart(results);
                        renderPhasePortrait(results);
                    } else if (results.discrete_state === false) {
                        renderOpinionEvolution(results);
                    }
                    if (cytoscapeRef.current) {
                        cytoscapeRef.current.style()
                            .selector("node")
