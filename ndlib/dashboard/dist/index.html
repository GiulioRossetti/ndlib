                }

                if (name === "op" && Array.isArray(options)) {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <select
                                value={value || "=="}
                                onChange={(e) => updateParam(e.target.value)}
                                class={commonClass}
                            >
                                {options.map(option => (
                                    <option key={option} value={option}>{option}</option>
                                ))}
                            </select>
                        </div>
                    );
                }

                if (Array.isArray(options) && options.length > 0 && !Array.isArray(value) && typeof value !== "object" && !isBuilderFloatParam(name, paramInfo) && !isBuilderIntegerParam(name, paramInfo) && typeof value !== "number") {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <select
                                value={value !== undefined ? value : options[0]}
                                onChange={(e) => updateParam(e.target.value)}
                                class={commonClass}
                            >
                                {options.map(option => {
                                    const optionValue = typeof option === "object" ? option.value : option;
                                    const optionLabel = typeof option === "object" ? option.label || option.value : option;
                                    return (
                                        <option key={optionValue} value={optionValue}>{optionLabel}</option>
                                    );
                                })}
                            </select>
                        </div>
                    );
                }

                if (typeof value === "boolean") {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <input
                                type="checkbox"
                                checked={!!value}
                                onChange={(e) => updateParam(e.target.checked)}
                                class="h-4 w-4 accent-indigo-500"
                            />
                        </div>
                    );
                }

                if (Array.isArray(value)) {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <textarea
                                value={JSON.stringify(value)}
                                onChange={(e) => {
                                    const parsed = parseBuilderStructuredValue(e.target.value, value);
                                    if (Array.isArray(parsed)) updateParam(parsed);
                                }}
                                rows="2"
                                class={commonClass}
                            />
                        </div>
                    );
                }

                if (value && typeof value === "object") {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <textarea
                                value={JSON.stringify(value, null, 2)}
                                onChange={(e) => {
                                    const parsed = parseBuilderStructuredValue(e.target.value, value);
                                    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) updateParam(parsed);
                                }}
                                rows="3"
                                class={commonClass}
                            />
                        </div>
                    );
                }

                if (isBuilderIntegerParam(name, paramInfo) || Number.isInteger(value)) {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <input
                                type="number"
                                min="0"
                                step="1"
                                value={value !== undefined && value !== null ? value : 0}
                                onChange={(e) => updateParam(Math.max(0, parseInt(e.target.value) || 0))}
                                class={commonClass}
                            />
                        </div>
                    );
                }

                if (isBuilderFloatParam(name, paramInfo) || typeof value === "number") {
                    const min = name.includes("min") || name.includes("max") || name.includes("threshold") || name.includes("epsilon") || name.includes("share") || name.includes("prob") || name.includes("weight") || name.includes("alpha") || name.includes("mu") || name.includes("sigma") ? 0 : undefined;
                    const max = name.includes("min") || name.includes("max") || name.includes("threshold") || name.includes("epsilon") || name.includes("share") || name.includes("prob") || name.includes("weight") || name.includes("alpha") || name.includes("mu") || name.includes("sigma") ? 1 : undefined;
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <input
                                type="number"
                                min={min}
                                max={max}
                                step="0.01"
                                value={value !== undefined && value !== null ? value : 0}
                                onChange={(e) => updateParam(parseFloat(e.target.value) || 0)}
                                class={commonClass}
                            />
                        </div>
                    );
                }

                return (
                    <div key={name} class="space-y-1">
                        <label class="text-[10px] text-slate-400 block">{label}</label>
                        <input
                            type="text"
                            value={value !== undefined && value !== null ? value : ""}
                            onChange={(e) => updateParam(e.target.value)}
                            class={commonClass}
                        />
                    </div>
                );
            };

            const getBuilderParamEntries = (selectedNode) => {
                if (!selectedNode || selectedNode.type !== "compartment") return [];
                const schema = getBlockSchemaEntry(selectedNode.data.type);
                const paramNames = [
                    ...(schema ? Object.keys(schema.parameters || {}) : []),
                    ...Object.keys(selectedNode.data.params || {})
                ];
                return Array.from(new Set(paramNames)).sort((a, b) => a.localeCompare(b));
            };

            const clampUnitFloat = (value, fallback = 0.1) => {
                const parsed = parseFloat(value);
                if (!Number.isFinite(parsed)) return fallback;
                return Math.min(1.0, Math.max(0.0, parsed));
            };

            const getCommunityColor = (communityId) => {
                if (communityId === undefined || communityId === null || Number.isNaN(Number(communityId))) {
                    return "#6366f1";
                }

                const palette = [
                    "#6366f1",
                    "#06b6d4",
                    "#10b981",
                    "#f59e0b",
                    "#ef4444",
                    "#8b5cf6",
                    "#ec4899",
                    "#14b8a6",
                    "#f97316",
                    "#84cc16",
                ];

                return palette[Math.abs(parseInt(communityId, 10)) % palette.length];
            };

            const buildCommunityLayoutPositions = (data) => {
                if (!data || !Array.isArray(data.nodes) || data.nodes.length === 0) {
                    return {};
                }

                const communities = new Map();
                data.nodes.forEach((node, index) => {
                    const communityKey = node.com !== undefined && node.com !== null ? String(node.com) : "__default__";
                    if (!communities.has(communityKey)) {
                        communities.set(communityKey, []);
                    }
                    communities.get(communityKey).push({ node, index });
                });

                const communityKeys = Array.from(communities.keys()).sort((a, b) => {
                    if (a === "__default__") return 1;
                    if (b === "__default__") return -1;
                    return parseInt(a, 10) - parseInt(b, 10);
                });

                const count = communityKeys.length;
                const centerRadius = Math.max(180, Math.min(420, Math.sqrt(data.nodes.length) * 55));
                const positions = {};

                communityKeys.forEach((communityKey, communityIndex) => {
                    const members = communities.get(communityKey);
                    const angle = (2 * Math.PI * communityIndex) / Math.max(1, count);
                    const centerX = Math.cos(angle) * centerRadius;
                    const centerY = Math.sin(angle) * centerRadius;
                    const memberRadius = Math.max(45, Math.min(140, 14 * Math.sqrt(members.length + 1)));

                    members.forEach((entry, memberIndex) => {
                        const memberAngle = (2 * Math.PI * memberIndex) / Math.max(1, members.length);
                        positions[entry.node.id] = {
                            x: centerX + Math.cos(memberAngle) * memberRadius,
                            y: centerY + Math.sin(memberAngle) * memberRadius
                        };
                    });
                });

                return positions;
            };

            const safelyFitCytoscape = (cy) => {
                if (!cy) return;
                try {
                    cy.fit();
                    cy.center();
                } catch (err) {
                    // Cytoscape can briefly report a headless renderer while the container is mounting.
                    // In that case the graph is already positioned, so skipping fit/center is harmless.
                }
            };

            const applyNetworkLayout = (cy, layoutName, data) => {
                if (!cy) return;

                if (layoutName === "community_clusters") {
                    const positions = buildCommunityLayoutPositions(data);
                    cy.batch(() => {
                        cy.nodes().forEach(node => {
                            const pos = positions[node.id()];
                            if (pos) {
                                node.position(pos);
                            }
                        });
                    });
                    safelyFitCytoscape(cy);
                    return;
                }

                if (layoutName === "preset") {
                    cy.layout({ name: "preset" }).run();
                } else {
                    cy.layout({ name: layoutName, animate: true, animationDuration: 500 }).run();
                }

                setTimeout(() => {
                    safelyFitCytoscape(cy);
                }, 550);
            };

            const detectContinuousVariable = (data) => {
                if (!data || data.discrete_state !== false || !Array.isArray(data.iterations)) {
                    return null;
                }

                for (const it of data.iterations) {
                    if (!it || !it.status) continue;
                    for (const nodeState of Object.values(it.status)) {
                        if (nodeState && typeof nodeState === "object" && !Array.isArray(nodeState)) {
                            const numericKeys = Object.keys(nodeState).filter(
                                key => typeof nodeState[key] === "number" && Number.isFinite(nodeState[key])
                            );
                            if (numericKeys.length > 0) {
                                return numericKeys[0];
                            }
                        }
                    }
                }

                return null;
            };

            const renderTrendsChart = (data) => {
                if (trendsChartRef.current) trendsChartRef.current.destroy();
                if (data.discrete_state === false) return;

                const ctx = document.getElementById("trendsChart").getContext("2d");
                const iterationsList = data.iterations;
                const T = iterationsList.length;

                // Map state codes to names
                const statusNames = {};
                Object.keys(data.statuses).forEach(k => {
                    statusNames[data.statuses[k]] = k;
                });

                const datasets = [];
                const statusCounts = {};

                // Initialize counts arrays
                Object.keys(statusNames).forEach(code => {
                    statusCounts[code] = [];
                });

                iterationsList.forEach(it => {
                    Object.keys(statusNames).forEach(code => {
                        statusCounts[code].push(it.node_count[code] || 0);
                    });
                });

                Object.keys(statusNames).forEach(code => {
                    datasets.push({
                        label: statusNames[code],
                        data: statusCounts[code],
                        borderColor: getStatusColor(parseInt(code)),
                        backgroundColor: getStatusColor(parseInt(code)) + "20",
                        borderWidth: 2,
                        tension: 0.2
                    });
                });

                trendsChartRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: Array.from({ length: T }, (_, i) => i),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: "#f8fafc" } }
                        },
                        scales: {
                            x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
                            y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } }
                        }
                    }
                });
            };

            const renderPrevalenceChart = (data) => {
                if (prevalenceChartRef.current) prevalenceChartRef.current.destroy();

                const canvas = document.getElementById("prevalenceChart");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const iterationsList = data.iterations;
                const T = iterationsList.length;

                // Map state codes to names
                const statusNames = {};
                Object.keys(data.statuses).forEach(k => {
                    statusNames[data.statuses[k]] = k;
                });

                const datasets = [];
                const statusDeltas = {};

                // Initialize counts arrays
                Object.keys(statusNames).forEach(code => {
                    statusDeltas[code] = [];
                });

                iterationsList.forEach(it => {
                    Object.keys(statusNames).forEach(code => {
                        statusDeltas[code].push(it.status_delta[code] || 0);
                    });
                });

                Object.keys(statusNames).forEach(code => {
                    datasets.push({
                        label: `New ${statusNames[code]}`,
                        data: statusDeltas[code],
                        borderColor: getStatusColor(parseInt(code)),
                        backgroundColor: getStatusColor(parseInt(code)) + "20",
                        borderWidth: 2,
                        tension: 0.2
                    });
                });

                prevalenceChartRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: Array.from({ length: T }, (_, i) => i),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: isDarkMode ? "#f8fafc" : "#1e293b" } }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: "Iterations", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            },
                            y: { 
                                title: { display: true, text: "New Nodes (Delta)", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            }
                        }
                    }
                });
            };

            const renderOpinionEvolution = (data) => {
                if (opinionChartRef.current) opinionChartRef.current.destroy();
                if (data.discrete_state !== false) return;

                const canvas = document.getElementById("opinionChart");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const iterationsList = Array.isArray(data.absoluteStatusHistory) && data.absoluteStatusHistory.length > 0
                    ? data.absoluteStatusHistory
                    : buildOpinionHistory(data);
                const T = iterationsList.length;

                // Reconstruct opinion trajectory for each node
                const nodeTrajectories = {};

                data.nodes.forEach(n => {
                    nodeTrajectories[n.id] = Array(T).fill(0);
                });

                iterationsList.forEach((snapshot, step) => {
                    data.nodes.forEach(n => {
                        nodeTrajectories[n.id][step] = getContinuousValue(
                            snapshot[n.id],
                            data.continuousVariable
                        );
                    });
                });

                data.nodes.forEach(n => {
                    let lastVal = nodeTrajectories[n.id][0];
                    for (let i = 0; i < T; i++) {
                        if (typeof nodeTrajectories[n.id][i] === "number" && Number.isFinite(nodeTrajectories[n.id][i])) {
                            lastVal = nodeTrajectories[n.id][i];
                        } else {
                            nodeTrajectories[n.id][i] = lastVal;
                        }
                    }
                });

                const nodeIds = Object.keys(nodeTrajectories);

                let minOpinion = Infinity;
                let maxOpinion = -Infinity;
                nodeIds.forEach(nodeId => {
                    nodeTrajectories[nodeId].forEach(value => {
                        if (typeof value === "number" && Number.isFinite(value)) {
                            if (value < minOpinion) minOpinion = value;
                            if (value > maxOpinion) maxOpinion = value;
                        }
                    });
                });
                if (!Number.isFinite(minOpinion) || !Number.isFinite(maxOpinion)) {
                    minOpinion = 0;
                    maxOpinion = 1;
                }
                if (Math.abs(maxOpinion - minOpinion) < 1e-6) {
                    minOpinion = Math.max(-1, minOpinion - 0.5);
                    maxOpinion = Math.min(1, maxOpinion + 0.5);
                } else {
                    const padding = (maxOpinion - minOpinion) * 0.08;
                    minOpinion -= padding;
                    maxOpinion += padding;
                }

                const maxLines = 100;
                const stepSize = Math.max(1, Math.floor(nodeIds.length / maxLines));
                const datasets = [];

                nodeIds.forEach((nodeId, idx) => {
                    if (idx % stepSize !== 0) return;

                    const traj = nodeTrajectories[nodeId];
                    const finalVal = traj[T - 1];
                    let color = "#ff0000";
                    if (finalVal < -0.33 || (selectedCategory !== "Opinions" && finalVal === 0)) {
                        color = "#ef4444";
                    } else if (finalVal > 0.33) {
                        color = "#22c55e";
                    } else {
                        color = "#eab308";
                    }

                    datasets.push({
                        label: `Node ${nodeId}`,
                        data: traj,
                        borderColor: color,
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: false,
                        alpha: 0.4
                    });
                });

                opinionChartRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: Array.from({ length: T }, (_, i) => i),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: "Iterations", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            },
                            y: { 
                                title: { display: true, text: "Opinion Value", color: isDarkMode ? "#f8fafc" : "#1e293b" },
                                min: minOpinion,
                                max: maxOpinion,
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }, 
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" } 
                            }
                        }
                    }
                });
            };

            const renderPhasePortrait = (data) => {
                if (phaseChartRef.current) phaseChartRef.current.destroy();

                const canvas = document.getElementById("phaseChart");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const iterationsList = data.iterations;

                // Use Susceptible vs Infected
                const susCode = data.statuses["Susceptible"] !== undefined ? data.statuses["Susceptible"] : 0;
                const infCode = data.statuses["Infected"] !== undefined ? data.statuses["Infected"] : 1;

                const points = iterationsList.map(it => ({
                    x: it.node_count[susCode] || 0,
                    y: it.node_count[infCode] || 0
                }));

                phaseChartRef.current = new Chart(ctx, {
                    type: "scatter",
                    data: {
                        datasets: [{
                            label: "S vs I Trajectory",
                            data: points,
                            showLine: true,
                            borderColor: "#a855f7",
                            backgroundColor: "#c084fc",
                            borderWidth: 2,
                            pointRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: "#f8fafc" } }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: "Susceptible Nodes", color: "#f8fafc" },
                                grid: { color: "#334155" },
                                ticks: { color: "#94a3b8" }
                            },
                            y: {
                                title: { display: true, text: "Infected Nodes", color: "#f8fafc" },
                                grid: { color: "#334155" },
                                ticks: { color: "#94a3b8" }
                            }
                        }
                    }
                });
            };

            const scheduleCytoscapeInit = (data, layoutName = networkLayout, attempts = 0) => {
                if (!cyContainerRef.current) {
                    if (attempts < 20) {
                        window.setTimeout(() => scheduleCytoscapeInit(data, layoutName, attempts + 1), 50);
                    }
                    return;
                }

                initCytoscape(data, layoutName);
            };

            const initCytoscape = (data, layoutName = networkLayout) => {
                const container = cyContainerRef.current;
                if (!container) {
                    return;
                }

                if (cytoscapeRef.current) {
                    cytoscapeRef.current.destroy();
                    cytoscapeRef.current = null;
                }

                const elements = [];
                const selectionColor = selectedModelName === "VoterZealotModel" ? "#22c55e" : "#ef4444";
                // Add nodes
                data.nodes.forEach(n => {
                    const communityColor = getCommunityColor(n.com);
                    elements.push({
                        data: {
                            id: n.id,
                            label: n.label,
                            com: n.com,
                            statusColor: communityColor
                        },
                        position: { x: n.x, y: n.y }
                    });
                });
                // Add edges
                data.edges.forEach(e => {
                    elements.push({ data: { source: e.source, target: e.target } });
                });

                cytoscapeRef.current = cytoscape({
                    container: container,
                    elements: elements,
                    style: [
                        {
                            selector: "node",
                            style: {
                                "background-color": "data(statusColor)",
                                "label": data.nodes.length > 200 ? "" : "data(label)",
                                "color": isDarkMode ? "#f8fafc" : "#0f172a",
                                "font-size": "10px",
                                "width": "16px",
                                "height": "16px"
                            }
                        },
                        {
                            selector: "node.selected-seed",
                            style: {
                                "border-width": 4,
                                "border-color": "#ffffff",
                                "background-color": selectionColor,
                                "overlay-color": selectionColor,
                                "overlay-opacity": 0.2,
                                "overlay-padding": 6,
                                "z-index": 999,
                            }
                        },
                        {
                            selector: "edge",
                            style: {
                                "width": 1.5,
                                "line-color": isDarkMode ? "#475569" : "#cbd5e1",
                                "opacity": 0.4
                            }
                        }
                    ],
                    layout: { name: "preset" },
                    userZoomingEnabled: true,
                    userPanningEnabled: true
                });

                cytoscapeRef.current.on("tap", "node", (evt) => {
                    const supportsNodeSelection = selectedCategory === "Epidemics" || selectedModelName === "VoterZealotModel";
                    if (results || !supportsNodeSelection || !currentModel || currentModel.discrete_state === false) return;
                    toggleSeedNode(evt.target.id());
                });

                cytoscapeRef.current.on("tap", (evt) => {
                    const supportsNodeSelection = selectedCategory === "Epidemics" || selectedModelName === "VoterZealotModel";
                    if (results || !supportsNodeSelection || !currentModel || currentModel.discrete_state === false) return;
                    if (evt.target === cytoscapeRef.current) {
                        clearSeedSelection();
                    }
                });

                applyNetworkLayout(cytoscapeRef.current, layoutName, data);
                updateNetworkColors(0, data);
                syncSeedSelection();
            };

            const updateNetworkColors = (step, data = results) => {
                if (!data) return;

                renderOpinionDistributionChart(data, step);

                if (!cytoscapeRef.current || !data.absoluteStatusHistory) return;

                const safeStep = Math.max(0, Math.min(step, data.absoluteStatusHistory.length - 1));
                const nodeStatus = data.absoluteStatusHistory[safeStep];
                if (!nodeStatus) return;

                const minOp = data.minOpinion !== undefined ? data.minOpinion : 0;
                const maxOp = data.maxOpinion !== undefined ? data.maxOpinion : 1;
                const stepValues = Object.values(nodeStatus)
                    .map(value => getContinuousValue(value, data.continuousVariable))
                    .filter(value => typeof value === "number" && Number.isFinite(value));
                const stepMin = stepValues.length ? Math.min(...stepValues) : minOp;
                const stepMax = stepValues.length ? Math.max(...stepValues) : maxOp;

                const isContinuous = data.isContinuous === true || data.discrete_state === false;
                const selectionColor = selectedModelName === "VoterZealotModel" ? "#22c55e" : "#ef4444";
                cytoscapeRef.current.batch(() => {
                    cytoscapeRef.current.nodes().forEach(node => {
                        const id = node.id();
                        const statusVal = nodeStatus[id] !== undefined
                            ? getContinuousValue(nodeStatus[id], data.continuousVariable)
                            : 0;
                        const isSelectedZealot = selectedModelName === "VoterZealotModel" && selectedSeedNodes.includes(String(id));
                        const color = isSelectedZealot
                            ? selectionColor
                            : (isContinuous
                                ? getContinuousBinColor(statusVal, stepMin, stepMax, 10)
                                : getStatusColor(
                                    statusVal,
                                    null,
                                    data.statuses,
                                    minOp,
                                    maxOp,
                                    false

                        node.data("statusColor", color);
                        node.style({

                            "border-color": color,

            const downloadChart = () => {

                if (activeTab === "prevalence") chartId = "prevalenceChart";

                const canvas = document.getElementById(chartId);

                document.body.appendChild(downloadAnchor);

            };

            const downloadBuilderPipelineImage = () => {
                if (!builderNodes.length) {
                    alert("There is no pipeline to export.");
                    return;
                }

                const nodeWidths = { status: 140, compartment: 180 };
                const nodeHeights = { status: 78, compartment: 88, conditional: 108 };
                const margin = 60;
                const extraRight = 140;
                const extraBottom = 100;

                const extents = builderNodes.reduce((acc, node) => {
                    const width = nodeWidths[node.type] || 180;
                    const height = node.type === "compartment" && node.data.type === "ConditionalComposition"
                        ? nodeHeights.conditional
                        : (nodeHeights[node.type] || 88);
                    acc.minX = Math.min(acc.minX, node.x);
                    acc.minY = Math.min(acc.minY, node.y);
                    acc.maxX = Math.max(acc.maxX, node.x + width);
                    acc.maxY = Math.max(acc.maxY, node.y + height);
                    return acc;
                }, { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity });

                const width = Math.max(900, Math.ceil(extents.maxX - extents.minX + margin * 2 + extraRight));
                const height = Math.max(600, Math.ceil(extents.maxY - extents.minY + margin * 2 + extraBottom));
                const offsetX = margin - extents.minX;
                const offsetY = margin - extents.minY;

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                if (!ctx) return;

                const roundRect = (x, y, w, h, r) => {
                    const radius = Math.min(r, w / 2, h / 2);
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + w - radius, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                    ctx.lineTo(x + w, y + h - radius);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                    ctx.lineTo(x + radius, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();
                };

                ctx.fillStyle = isDarkMode ? "#020617" : "#f8fafc";
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = isDarkMode ? "#e2e8f0" : "#0f172a";
                ctx.font = "600 18px Outfit, sans-serif";
                ctx.fillText(`${builderModelName} Pipeline`, 24, 32);
                ctx.font = "12px Outfit, sans-serif";
                ctx.fillStyle = isDarkMode ? "#94a3b8" : "#475569";
                ctx.fillText(`Use case: ${builderUseCaseCatalog[builderUseCase]?.label || builderUseCase}`, 24, 52);

                const drawArrow = (x, y, angle, color) => {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-10, -5);
                    ctx.lineTo(-10, 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                };

                builderEdges.forEach(edge => {
                    const fromNode = builderNodes.find(n => n.id === edge.source);
                    const toNode = builderNodes.find(n => n.id === edge.target);
                    if (!fromNode || !toNode) return;

                    const fromWidth = nodeWidths[fromNode.type] || 180;
                    const toWidth = nodeWidths[toNode.type] || 180;
                    const x1 = fromNode.x + fromWidth + offsetX;
                    const y1 = fromNode.y + 39 + offsetY;
                    const x2 = toNode.x + offsetX;
                    let y2 = toNode.y + 39 + offsetY;
                    if (toNode.type === "compartment" && toNode.data.type === "ConditionalComposition") {
                        if (edge.targetPort === "condition") y2 = toNode.y + 43 + offsetY;
                        else if (edge.targetPort === "if_true") y2 = toNode.y + 63 + offsetY;
                        else if (edge.targetPort === "if_false") y2 = toNode.y + 83 + offsetY;
                    }

                    const dx = Math.abs(x2 - x1) * 0.5;
                    const cp1x = x1 + dx;
                    const cp2x = x2 - dx;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.bezierCurveTo(cp1x, y1, cp2x, y2, x2, y2);
                    ctx.strokeStyle = "#4f46e5";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    drawArrow(x2, y2, angle, "#4f46e5");
                });

                builderNodes.forEach(node => {
                    const widthNode = nodeWidths[node.type] || 180;
                    const heightNode = node.type === "compartment" && node.data.type === "ConditionalComposition"
                        ? nodeHeights.conditional
                        : (nodeHeights[node.type] || 88);
                    const x = node.x + offsetX;
                    const y = node.y + offsetY;
                    const selected = selectedNodeIds.includes(node.id);

                    ctx.save();
                    ctx.fillStyle = node.type === "status"
                        ? (isDarkMode ? "#0f172a" : "#ffffff")
                        : (isDarkMode ? "#111827" : "#ffffff");
                    ctx.strokeStyle = selected ? "#6366f1" : (isDarkMode ? "#334155" : "#cbd5e1");
                    ctx.lineWidth = selected ? 3 : 1.5;
                    roundRect(x, y, widthNode, heightNode, 12);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = node.type === "status"
                        ? (isDarkMode ? "#0ea5e9" : "#0284c7")
                            : node.data.type === "ConditionalComposition"
                            ? (isDarkMode ? "#10b981" : "#059669")
                            : (isDarkMode ? "#a855f7" : "#7c3aed");
                    roundRect(x, y, widthNode, 18, 12);
                    ctx.fill();

                    ctx.fillStyle = isDarkMode ? "#f8fafc" : "#0f172a";
                    ctx.font = "700 10px Outfit, sans-serif";
                    ctx.fillText(node.type === "status" ? "Status Node" : node.data.type === "ConditionalComposition" ? "Conditional" : "Compartment", x + 10, y + 12);

                    ctx.font = "700 12px Outfit, sans-serif";
                    const title = String(node.data.name || node.id);
                    ctx.fillText(title.slice(0, 20), x + 10, y + 42);
                    ctx.font = "10px Outfit, sans-serif";
                    ctx.fillStyle = isDarkMode ? "#94a3b8" : "#475569";
                    if (node.type === "status") {
                        ctx.fillText(`Code ${node.data.code}`, x + 10, y + 60);
                    } else {
                        ctx.fillText(String(node.data.type || ""), x + 10, y + 60);
                    }
                    ctx.restore();
                });

                const safeName = (builderModelName || "builder_pipeline").replace(/[^A-Za-z0-9_]/g, "_");
                const downloadAnchor = document.createElement("a");
                downloadAnchor.href = canvas.toDataURL("image/png");
                downloadAnchor.download = `${safeName}_pipeline.png`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const downloadTextFile = (filename, content, mimeType = "text/plain;charset=utf-8") => {
                const blob = new Blob([content], { type: mimeType });
                const objectUrl = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement("a");

                downloadAnchor.remove();
                URL.revokeObjectURL(objectUrl);

            const downloadCustomModelPython = (modelName) => {

                if (!safeName) {

            const copyNDQLToClipboard = async () => {

            const fetchCustomModels = (baseUrl = apiBaseUrl) => {
                fetch(baseUrl + "/api/custom-models")
                    .then(res => res.json())
                    .then(data => {

                    .catch(err => console.error("Failed to fetch custom models:", err));

            useEffect(() => {

            }, [showModelBuilder]);

            const saveCustomModel = () => {
                const liveNodes = builderNodesRef.current || builderNodes;
                const liveEdges = builderEdgesRef.current || builderEdges;
                const liveInitialStatus = builderInitialStatusRef.current || builderInitialStatus;
                const payload = {
                    name: builderModelName,
                    use_case: builderUseCase,
                    template_id: builderTemplateId,
                    initial_opinion_distribution: builderOpinionDistribution,
                    declarations: builderDeclarations.map(item => ({ ...item })),
                    observables: builderObservables.map(item => ({ ...item })),
                    updates: builderUpdates.map(item => ({
                        ...item,
                        schedule: item.schedule && typeof item.schedule === "object" ? { ...item.schedule } : item.schedule
                    })),
                    statuses: liveNodes.filter(n => n.type === "status").map(n => ({
                        name: n.data.name,
                        code: n.data.code
                    })),
                    compartments: liveNodes.filter(n => n.type === "compartment").map(n => {
                        const cData = {
                            name: n.data.name,
                            type: n.data.type,
                            params: { ...n.data.params }
                        };
                        if (n.data.type === "ConditionalComposition") {
                            const condEdge = liveEdges.find(e => e.target === n.id && e.targetPort === "condition");
                            const trueEdge = liveEdges.find(e => e.target === n.id && e.targetPort === "if_true");
                            const falseEdge = liveEdges.find(e => e.target === n.id && e.targetPort === "if_false");
                            
                            const condNode = condEdge ? liveNodes.find(node => node.id === condEdge.source) : null;
                            const trueNode = trueEdge ? liveNodes.find(node => node.id === trueEdge.source) : null;
                            const falseNode = falseEdge ? liveNodes.find(node => node.id === falseEdge.source) : null;
                            
                            cData.params.condition = condNode ? condNode.data.name : "";
                            cData.params.first_branch = trueNode ? trueNode.data.name : "";
                            cData.params.second_branch = falseNode ? falseNode.data.name : "";
                        }
                        return cData;
                    }),
                    rules: [],
                    initial_status: liveInitialStatus,
                    nodes: liveNodes,
                    edges: liveEdges
                };

                liveNodes.filter(n => n.type === "compartment").forEach(compNode => {
                    const incoming = liveEdges.filter(e => e.target === compNode.id && (e.targetPort === "in" || !e.targetPort));
                    const outgoing = liveEdges.filter(e => e.source === compNode.id);
                    
                    incoming.forEach(incEdge => {
                        const fromNode = liveNodes.find(n => n.id === incEdge.source);
                        if (fromNode && fromNode.type === "status") {
                            outgoing.forEach(outEdge => {
                                const toNode = liveNodes.find(n => n.id === outEdge.target);
                                if (toNode && toNode.type === "status") {
                                    payload.rules.push({
                                        from: fromNode.data.name,
                                        to: toNode.data.name,
                                        using: compNode.data.name
                                    });
                                }
                            });
                        }
                    });
                });

                fetch(apiBaseUrl + "/api/custom-models/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert("Error saving model: " + data.error);
                    } else {
                        alert("Model saved and registered successfully!");
                        fetchCustomModels();
                        loadModels();
                    }

                .catch(err => alert("Connection error: " + err.message));

            const deleteCustomModel = (modelName) => {

                fetch(apiBaseUrl + "/api/custom-models/delete", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: modelName })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert("Error deleting model: " + data.error);
                    } else {
                        alert("Model deleted successfully!");
                        fetchCustomModels();
                        loadModels();
                        if (selectedModelName === modelName) {
                            setSelectedCategory("Epidemics");
                            selectModel("SIRModel");
                        }
                    }
                })
                .catch(err => alert("Connection error: " + err.message));
            };

            const loadCustomModelLayout = (modelData) => {
                if (modelData.nodes && modelData.edges) {
                    if (modelData.use_case && builderUseCaseCatalog[modelData.use_case]) {
                        setBuilderUseCase(modelData.use_case);
                    }
                    if (modelData.template_id && builderTemplates[modelData.template_id]) {
                        setBuilderTemplateId(modelData.template_id);
                    }
                    setBuilderModelName(modelData.name);
                    setBuilderOpinionDistribution(modelData.initial_opinion_distribution || "uniform");
                    setBuilderNodes(modelData.nodes);
                    setBuilderEdges(modelData.edges);
                    setBuilderInitialStatus(modelData.initial_status || []);
                    setBuilderDeclarations(Array.isArray(modelData.declarations) ? modelData.declarations.map(item => ({ ...item })) : []);
                    setBuilderObservables(Array.isArray(modelData.observables) ? modelData.observables.map(item => ({ ...item })) : []);
                    setBuilderUpdates(Array.isArray(modelData.updates) ? modelData.updates.map(item => ({ ...item })) : []);
                    clearBuilderSelection();
                    clearBuilderInteractionState();
                } else {
                    alert("This model has no saved visual layout.");
                }
            };

            const getLiveNDQLPreview = () => {
                const lines = [];
                lines.push(`MODEL ${builderModelName}`);
                lines.push("");

                const isContinuousOpinionBuilder = builderUseCase === "continuous_opinions" || builderTemplateId === "algorithmic_bias";
                if (isContinuousOpinionBuilder) {
                    lines.push("TYPE CONTINUOUS_OPINION");
                    lines.push(`INITIAL_OPINION_DISTRIBUTION ${builderOpinionDistribution}`);
                    lines.push("");
                }

                const statuses = builderNodes.filter(n => n.type === "status");
                statuses.forEach(n => {
                    lines.push(isContinuousOpinionBuilder ? `BIN ${n.data.name}` : `STATUS ${n.data.name}`);
                });
                if (statuses.length > 0) lines.push("");

                builderDeclarations.forEach(declaration => {
                    const kind = String(declaration.kind || "PARAM").toUpperCase();
                    const bits = [`DECLARE ${kind}`, declaration.name || ""];
                    if (declaration.type !== undefined && declaration.type !== null && declaration.type !== "") {
                        bits.push(`TYPE ${Array.isArray(declaration.type) ? JSON.stringify(declaration.type) : declaration.type}`);
                    }
                    if (declaration.scope !== undefined && declaration.scope !== null && declaration.scope !== "") {
                        bits.push(`SCOPE ${declaration.scope}`);
                    }
                    if (declaration.range !== undefined && declaration.range !== null && declaration.range !== "") {
                        bits.push(`RANGE ${Array.isArray(declaration.range) ? JSON.stringify(declaration.range) : declaration.range}`);
                    }
                    if (declaration.values !== undefined && declaration.values !== null && declaration.values !== "") {
                        bits.push(`VALUES ${Array.isArray(declaration.values) ? JSON.stringify(declaration.values) : declaration.values}`);
                    }
                    if (declaration.default !== undefined && declaration.default !== null && declaration.default !== "") {
                        bits.push(`DEFAULT ${Array.isArray(declaration.default) ? JSON.stringify(declaration.default) : declaration.default}`);
                    }
                    lines.push(bits.join(" ").trim());
                });
                if (builderDeclarations.length > 0) lines.push("");

                const compartments = builderNodes.filter(n => n.type === "compartment");
                compartments.forEach(n => {
                    if (isContinuousOpinionBuilder && n.data.type === "OpinionDistanceThreshold") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionDistanceThreshold`);
                        lines.push(`PARAM epsilon ${n.data.params.epsilon}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionSelectionBias") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionSelectionBias`);
                        lines.push(`PARAM gamma ${n.data.params.gamma}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionCompromise") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionCompromise`);
                        lines.push(`PARAM mu ${n.data.params.mu}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionStubbornness") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionStubbornness`);
                        lines.push(`PARAM theta ${n.data.params.theta}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionNoise") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionNoise`);
                        lines.push(`PARAM sigma ${n.data.params.sigma}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionPolarization") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionPolarization`);
                        lines.push(`PARAM strength ${n.data.params.strength}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionExternalField") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionExternalField`);
                        lines.push(`PARAM target ${n.data.params.target}`);
                        lines.push(`PARAM strength ${n.data.params.strength}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionTrustFilter") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionTrustFilter`);
                        lines.push(`PARAM trust_threshold ${n.data.params.trust_threshold}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionMemory") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionMemory`);
                        lines.push(`PARAM alpha ${n.data.params.alpha}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionNormalization") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionNormalization`);
                        lines.push(`PARAM min ${n.data.params.min}`);
                        lines.push(`PARAM max ${n.data.params.max}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionQuantization") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionQuantization`);
                        lines.push(`PARAM bins ${n.data.params.bins}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionMediaInfluence") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionMediaInfluence`);
                        lines.push(`PARAM weight ${n.data.params.weight}`);
                        lines.push("");
                    } else if (isContinuousOpinionBuilder && n.data.type === "OpinionZealot") {
                        lines.push(`BLOCK ${n.data.name}`);
                        lines.push(`TYPE OpinionZealot`);
                        lines.push(`PARAM share ${n.data.params.share}`);
                        lines.push(`PARAM fixed_value ${n.data.params.fixed_value}`);
                        lines.push("");
                    } else if (n.data.type === "ConditionalComposition") {
                        const condEdge = builderEdges.find(e => e.target === n.id && e.targetPort === "condition");
                        const trueEdge = builderEdges.find(e => e.target === n.id && e.targetPort === "if_true");
                        const falseEdge = builderEdges.find(e => e.target === n.id && e.targetPort === "if_false");
                        
                        const condNode = condEdge ? builderNodes.find(node => node.id === condEdge.source) : null;
                        const trueNode = trueEdge ? builderNodes.find(node => node.id === trueEdge.source) : null;
                        const falseNode = falseEdge ? builderNodes.find(node => node.id === falseEdge.source) : null;
                        
                        const condName = condNode ? condNode.data.name : "";
                        const trueName = trueNode ? trueNode.data.name : "";
                        const falseName = falseNode ? falseNode.data.name : "";
                        
                        lines.push(`IF ${condName} THEN ${trueName} ELSE ${falseName} AS ${n.data.name}`);
                        lines.push("");
                    } else {
                        lines.push(`COMPARTMENT ${n.data.name}`);
                        lines.push(`TYPE ${n.data.type}`);
                        if (n.data.type === "NodeNumericalVariable" && n.data.params.var === "opinion" && n.data.params.var_type === "ATTRIBUTE") {
                            lines.push(`TEST opinion ${n.data.params.op} ${n.data.params.value}`);
                        }
                        if (n.data.params.triggering_status) {
                            lines.push(`TRIGGER ${n.data.params.triggering_status}`);
                        }
                        Object.keys(n.data.params).forEach(k => {
                            if (k !== "triggering_status" && !(n.data.type === "NodeNumericalVariable" && k === "var" && n.data.params.var === "opinion")) {
                                lines.push(`PARAM ${k} ${n.data.params[k]}`);
                            }
                        });
                        lines.push("");
                    }
                });

                compartments.forEach(compNode => {
                    const incoming = builderEdges.filter(e => e.target === compNode.id && (e.targetPort === "in" || !e.targetPort));
                    const outgoing = builderEdges.filter(e => e.source === compNode.id);
                    
                    incoming.forEach(incEdge => {
                        const fromNode = builderNodes.find(n => n.id === incEdge.source);
                        if (fromNode && fromNode.type === "status") {
                            outgoing.forEach(outEdge => {
                                const toNode = builderNodes.find(n => n.id === outEdge.target);
                                if (toNode && toNode.type === "status") {
                                    lines.push(`RULE`);
                                    lines.push(`FROM ${fromNode.data.name}`);
                                    lines.push(`TO ${toNode.data.name}`);
                                    lines.push(`USING ${compNode.data.name}`);
                                    lines.push("");
                                }
                            });
                        }
                    });
                });

                builderObservables.forEach(observable => {
                    const bits = [`OBSERVE ${observable.variable || ""}`];
                    if (observable.mode !== undefined && observable.mode !== null && observable.mode !== "") {
                        bits.push(`AS ${observable.mode}`);
                    }
                    if (observable.bins !== undefined && observable.bins !== null && observable.bins !== "") {
                        bits.push(`BINS ${observable.bins}`);
                    }
                    if (observable.range !== undefined && observable.range !== null && observable.range !== "") {
                        bits.push(`RANGE ${Array.isArray(observable.range) ? JSON.stringify(observable.range) : observable.range}`);
                    }
                    lines.push(bits.join(" ").trim());
                });
                if (builderObservables.length > 0) lines.push("");

                builderUpdates.forEach(update => {
                    serializeBuilderUpdate(update).forEach(line => lines.push(line));
                    lines.push("");
                });

                lines.push("INITIALIZE");
                if (isContinuousOpinionBuilder) {
                    lines.push(`SET INITIAL_OPINION_DISTRIBUTION ${builderOpinionDistribution}`);
                }
                builderInitialStatus.forEach(init => {
                    lines.push(`SET ${init.status} ${init.ratio}`);
                });

                return lines.join("\n");
            };

            const handleCanvasMouseMove = (e) => {
                const point = getBuilderCanvasPoint(e);
                if (!point) return;

                if (draggingNodes.length > 0 && dragAnchor) {
                    const deltaX = point.x - dragAnchor.x;
                    const deltaY = point.y - dragAnchor.y;
                    const draggingMap = new Map(draggingNodes.map(item => [item.id, item]));
                    setBuilderNodes(prev => prev.map(node => {
                        const dragItem = draggingMap.get(node.id);
                        if (!dragItem) return node;
                        return {
                            ...node,
                            x: Math.max(10, Math.min(4000, dragItem.startX + deltaX)),
                            y: Math.max(10, Math.min(4000, dragItem.startY + deltaY))
                        };
                    }));
                }

                if (linkingSource !== null) {
                    setTempEdgeEnd({ x: point.x, y: point.y });
                }
            };

            const handleCanvasMouseUp = (e) => {
                finalizeBuilderLinkFromEvent(e);
                clearBuilderInteractionState();
            };

            const startNodeDrag = (e, id) => {
                if (e.target.closest('.handle')) return;
                e.preventDefault();
                const node = builderNodes.find(n => n.id === id);
                if (!node) return;

                const isAdditive = e.shiftKey || e.metaKey || e.ctrlKey;
                const alreadySelected = selectedNodeIds.includes(id);
                const dragIds = alreadySelected && selectedNodeIds.length > 1 ? selectedNodeIds : [id];
                const dragState = dragIds
                    .map(nodeId => {
                        const dragNode = builderNodes.find(n => n.id === nodeId);
                        return dragNode ? { id: nodeId, startX: dragNode.x, startY: dragNode.y } : null;
                    })
                    .filter(Boolean);

                if (isAdditive) {
                    if (!alreadySelected) {
                        setSelectedNodeIds(prev => [...prev, id]);
                    }
                } else if (!alreadySelected || selectedNodeIds.length > 1) {
                    setSelectedNodeIds([id]);
                }

                setSelectedElement(node);
                setDraggingNodes(dragState);
                setDragAnchor(getBuilderCanvasPoint(e));
            };

            const handleNodeSelection = (e, id) => {
                if (e.shiftKey || e.metaKey || e.ctrlKey) {
                    toggleBuilderNodeSelection(id);
                    return;
                }
                if (!selectedNodeIds.includes(id) || selectedNodeIds.length > 1) {
                    focusBuilderNode(id);
                }
            };

            const handleHandleMouseDown = (e, nodeId, handleType) => {
                e.stopPropagation();
                e.preventDefault();
                const rect = e.currentTarget.getBoundingClientRect();
                const canvasEl = builderCanvasRef.current;
                const canvas = canvasEl?.getBoundingClientRect();
                if (!canvas || !canvasEl) return;
                const startX = (rect.left + rect.width / 2 - canvas.left + canvasEl.scrollLeft) / builderZoom;
                const startY = (rect.top + rect.height / 2 - canvas.top + canvasEl.scrollTop) / builderZoom;
                
                const source = { nodeId, handleType, startX, startY };
                linkingSourceRef.current = source;
                setLinkingSource(source);
                setTempEdgeEnd({ x: startX, y: startY });
            };

            const createBuilderEdge = (sourceNodeId, targetNodeId, targetPort) => {
                const liveEdges = builderEdgesRef.current || builderEdges;
                const exists = liveEdges.some(edge =>
                    edge.source === sourceNodeId &&
                    edge.target === targetNodeId &&
                    edge.targetPort === targetPort
                );
                if (exists) return false;
                setBuilderEdges(prev => [...prev, {
                    id: `edge_${Date.now()}`,
                    source: sourceNodeId,
                    target: targetNodeId,
                    targetPort
                }]);
                return true;
            };

            const finalizeBuilderLink = (source, targetNodeId, targetPort) => {
                if (!source || source.nodeId === targetNodeId) return false;
                if (source.handleType !== "out") return false;
                if (!["in", "condition", "if_true", "if_false"].includes(targetPort)) return false;
                return createBuilderEdge(source.nodeId, targetNodeId, targetPort);
            };

            const handleHandleMouseUp = (e, targetNodeId, handleType) => {
                e.stopPropagation();
                finalizeBuilderLink(linkingSourceRef.current || linkingSource, targetNodeId, handleType);
                linkingSourceRef.current = null;
                setLinkingSource(null);
                setTempEdgeEnd(null);
            };
            const handleCardMouseUp = (e, targetNodeId) => {
                finalizeBuilderLinkFromEvent(e, linkingSourceRef.current || linkingSource);
                linkingSourceRef.current = null;
                setLinkingSource(null);
                setTempEdgeEnd(null);
            };

            const addStatusNode = () => {
                clearBuilderInteractionState();
                const id = `status_${Date.now()}`;
                const name = `State_${builderNodes.filter(n => n.type === "status").length + 1}`;
                const code = builderNodes.filter(n => n.type === "status").length;
                const newNode = {
                    id,
                    type: "status",
                    x: 100 + Math.random() * 50,
                    y: 100 + Math.random() * 50,
                    data: { name, code }
                };
                setBuilderNodes(prev => [...prev, newNode]);
                setBuilderInitialStatus(prev => [...prev, { status: name, ratio: 0.0 }]);
            };

            const addCompartmentNode = (type) => {
                clearBuilderInteractionState();
                const id = `comp_${Date.now()}`;
                const name = `comp_${builderNodes.filter(n => n.type === "compartment").length + 1}`;
                
                let params = getSchemaBackedCompartmentParams(type);
                if (type === "NodeStochastic") params = { rate: 0.1, triggering_status: "" };
                else if (type === "NodeThreshold") params = { threshold: 0.1, triggering_status: "" };
                else if (type === "EdgeStochastic") params = { threshold: 0.1, triggering_status: "" };
                else if (type === "CountDown") params = { iterations: 5 };
                else if (type === "NodeCategoricalAttribute") params = { attribute: "gender", value: "male", probability: 1.0 };
                else if (type === "NodeNumericalAttribute") params = { attribute: "age", op: "==", value: 25, probability: 1.0 };
                else if (type === "NodeNumericalVariable") params = { var: "opinion", var_type: "ATTRIBUTE", value: 0.5, op: ">=", probability: 1.0 };
                else if (type === "Parameter") params = { name: "epsilon", type: "float", default: 0.1 };
                else if (type === "Constant") params = { name: "tau", type: "float", value: 0.5 };
                else if (type === "Variable") params = { name: "opinion", scope: "node", type: "continuous", range: [0, 1], default: 0.5 };
                else if (type === "Distribution") params = { family: "uniform", bounds: [0, 1] };
                else if (type === "OpinionDistribution") params = { family: "uniform", bounds: [0, 1] };
                else if (type === "Selector") params = { policy: "random", share: 1.0 };
                else if (type === "Filter") params = { predicate: "True" };
                else if (type === "Aggregator") params = { mode: "mean", target: "opinion" };
                else if (type === "Kernel") params = { rate: 1.0 };
                else if (type === "Transform") params = { expression: "value", target: "opinion" };
                else if (type === "Compose") params = { condition: "", if_true: "", if_false: "" };
                else if (type === "Schedule") params = { start: 0, end: 100, period: 1, phase: 0 };
                else if (type === "Observe") params = { variable: "opinion", mode: "bins", bins: 20, range: [0, 1] };
                else if (type === "ClampNormalize") params = { min: 0.0, max: 1.0, target: "opinion" };
                else if (type === "ExposureRate") params = { beta: 0.1, contact_weight: 1.0, mixing: 1.0 };
                else if (type === "TransmissionKernel") params = { function: "", saturation: 1.0, source: "exposure", target: "transmission_probability" };
                else if (type === "DoseResponseBlock") params = { shape: "logistic", scale: 1.0, offset: 0.0, source: "exposure", target: "infection_probability" };
                else if (type === "LatencyPeriod") params = { duration: 1, distribution: "fixed", target: "latent" };
                else if (type === "IncubationState") params = { infectiousness: 0.5, duration: 1, target: "incubating" };
                else if (type === "RecoveryKernel") params = { gamma: 0.1, source: "recovery_rate" };
                else if (type === "WaningImmunity") params = { rate: 0.1, delay: 0, target: "susceptibility" };
                else if (type === "VaccinationBlock") params = { coverage: 0.0, efficacy: 1.0, priority: null };
                else if (type === "QuarantineBlock") params = { duration: 1, trigger: null, coverage: 1.0, target: "quarantined" };
                else if (type === "TestingBlock") params = { sensitivity: 1.0, specificity: 1.0, frequency: 1, target: "tested_positive" };
                else if (type === "TreatmentBlock") params = { efficacy: 0.5, delay: 0, capacity: null, target: "treatment_effect" };
                else if (type === "HospitalizationBlock") params = { capacity: null, rate: 0.1, mortality: 0.0, target: "hospitalized" };
                else if (type === "MortalityBlock") params = { fatality: 0.0, delay: 0, cause: null, target_status: "Removed", target: "dead" };
                else if (type === "ReinfectionBlock") params = { susceptibility: 1.0, cooldown: 0, target: "susceptibility" };
                else if (type === "StrainBlock") params = { strain_id: 0, cross_immunity: 0.0, fitness: 1.0, target: "strain_id" };
                else if (type === "SuperSpreaderBlock") params = { activity: 1.0, burst_rate: 0.0, target: "activity" };
                else if (type === "SeasonalityBlock") params = { period: 1, amplitude: 0.0, phase: 0, target: "seasonality_factor" };
                else if (type === "ImportationBlock") params = { arrival_rate: 0.0, source: null, target: "imported", infectious_status: "Infected" };
                else if (type === "RewiringBlock") params = { rewire_rate: 0.0, preference: null, target: "rewired" };
                else if (type === "CommunityMixingBlock") params = { intra_rate: 1.0, inter_rate: 0.5, community_field: "com", target: "mixing_rate" };
                else if (type === "EdgeActivationBlock") params = { threshold: 0.5, duration: 1, target: "active" };
                else if (type === "OpinionDistanceThreshold") params = { epsilon: 0.1 };
                else if (type === "OpinionSelectionBias") params = { gamma: 1.5 };
                else if (type === "OpinionCompromise") params = { mu: 0.5 };
                else if (type === "OpinionStubbornness") params = { theta: 0.1 };
                else if (type === "OpinionNoise") params = { sigma: 0.0 };
                else if (type === "OpinionPolarization") params = { strength: 0.0 };
                else if (type === "OpinionExternalField") params = { target: 0.5, strength: 0.0 };
                else if (type === "OpinionTrustFilter") params = { trust_threshold: 0.1 };
                else if (type === "OpinionMemory") params = { alpha: 0.5 };
                else if (type === "OpinionNormalization") params = { min: 0.0, max: 1.0 };
                else if (type === "OpinionQuantization") params = { bins: 10 };
                else if (type === "OpinionMediaInfluence") params = { weight: 0.5 };
                else if (type === "OpinionZealot") params = { share: 0.1, fixed_value: 0.0 };
                else if (type === "SeedSelection") params = { share: 0.1, target: "seed_nodes" };
                else if (type === "NodeRoleAssignment") params = { role: "seed", share: 0.1, target: "role" };
                else if (type === "AttributeInitializer") params = { attribute: "opinion", distribution: "uniform", scope: "node" };
                else if (type === "GraphImport") params = { graph_data: { graph: {}, nodes: {}, edges: {} }, merge: true, scope: "graph" };
                else if (type === "CommunityAssignment") params = { algorithm: "louvain_communities", target: "com", field: "com" };
                else if (type === "RuleAlias") params = { alias: "", target: "", description: "" };
                else if (type === "PreviewObservable") params = { variable: "opinion", mode: "bins", bins: 20, range: [0, 1] };
                else if (type === "ValidationHint") params = { name: "opinion_range", minimum: 0.0, maximum: 1.0, target: "opinion" };
                else if (type === "ConditionalComposition") params = { condition: "", first_branch: "", second_branch: "" };

                const newNode = {
                    id,
                    type: "compartment",
                    x: 250 + Math.random() * 50,
                    y: 100 + Math.random() * 50,
                    data: {
                        name,
                        type,
                        params
                    }
                };
                setBuilderNodes(prev => [...prev, newNode]);
            };

            const deleteSelectedElement = () => {
                if (!selectedElement) return;

                if (selectedNodeIds.length > 1 && !selectedElement.source && !selectedElement.target) {
                    const idsToDelete = new Set(selectedNodeIds);
                    const namesToDelete = new Set(
                        builderNodes
                            .filter(n => idsToDelete.has(n.id) && n.type === "status")
                            .map(n => n.data.name)
                    );
                    setBuilderNodes(prev => prev.filter(n => !idsToDelete.has(n.id)));
                    setBuilderEdges(prev => prev.filter(e => !idsToDelete.has(e.source) && !idsToDelete.has(e.target)));
                    setBuilderInitialStatus(prev => prev.filter(init => !namesToDelete.has(init.status)));
                    clearBuilderSelection();
                    clearBuilderInteractionState();
                    return;
                }
                
                if (selectedElement.source && selectedElement.target) {
                    setBuilderEdges(prev => prev.filter(e => e.id !== selectedElement.id));
                    clearBuilderSelection();
                } else {
                    const nodeId = selectedElement.id;
                    setBuilderNodes(prev => prev.filter(n => n.id !== nodeId));
                    setBuilderEdges(prev => prev.filter(e => e.source !== nodeId && e.target !== nodeId));
                    
                    if (selectedElement.type === "status") {
                        setBuilderInitialStatus(prev => prev.filter(init => init.status !== selectedElement.data.name));
                    }
                    clearBuilderSelection();
                }
            };

            const updateNodeData = (nodeId, updatedData) => {
                const oldNode = builderNodes.find(n => n.id === nodeId);
                if (oldNode && oldNode.type === "status" && updatedData.name !== oldNode.data.name) {
                    const oldName = oldNode.data.name;
                    const newName = updatedData.name;
                    
                    setBuilderInitialStatus(prev => prev.map(init => 
                        init.status === oldName ? { ...init, status: newName } : init
                    ));

                    setBuilderNodes(prev => prev.map(node => {
                        if (node.type === "compartment" && node.data.params.triggering_status === oldName) {
                            return {
                                ...node,
                                data: {
                                    ...node.data,
                                    params: {
                                        ...node.data.params,
                                        triggering_status: newName
                                    }
                                }
                            };
                        }
                        return node;
                    }));
                }
