                            .selector("edge")
                            .style({ "line-color": isDarkMode ? "#475569" : "#cbd5e1" })
                            .update();
                    }
                }
            }, [isDarkMode]);

            // Center network visualization when activeTab switches to network
            useEffect(() => {
                if (activeTab === "network" && results) {
                    setTimeout(() => {
                        if (cytoscapeRef.current) {
                            cytoscapeRef.current.resize();
                            cytoscapeRef.current.fit();
                            cytoscapeRef.current.center();
                            updateNetworkColors(currentPlaybackStep, results);
                        }
                    }, 100);
                }
            }, [activeTab, currentPlaybackStep, results]);

            useEffect(() => {
                if (results && cytoscapeRef.current) {
                    updateNetworkColors(currentPlaybackStep, results);
                }
            }, [results, currentPlaybackStep]);

            useEffect(() => {
                if (!results && cytoscapeRef.current) {
                    syncSeedSelection();
                }
            }, [selectedSeedNodes, results]);

            useEffect(() => {
                if (!results && !loading && networkPreview && isNetworkTabAllowed) {
                    renderNetworkPreview(networkPreview);
                }
            }, [networkPreview, results, loading, networkLayout]);

            const handleLayoutChange = (newLayout) => {
                setNetworkLayout(newLayout);
                if (cytoscapeRef.current) {
                    applyNetworkLayout(cytoscapeRef.current, newLayout, results || networkPreview);
                }
            };

            const exportJSON = () => {
                if (!results) return;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(results, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `${selectedModelName}_simulation.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const exportCSV = () => {
                if (!results) return;
                // Header: Iteration, Compartment counts
                const statusNames = {};
                Object.keys(results.statuses).forEach(k => {
                    statusNames[results.statuses[k]] = k;
                });

                const headers = ["Iteration", ...Object.values(statusNames)];
                let csvRows = [headers.join(",")];

                results.iterations.forEach(it => {
                    const row = [it.iteration];
                    Object.keys(statusNames).forEach(code => {
                        row.push(it.node_count[code] || 0);
                    });
                    csvRows.push(row.join(","));
                });

                const csvStr = "data:text/csv;charset=utf-8," + encodeURIComponent(csvRows.join("\n"));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", csvStr);
                downloadAnchor.setAttribute("download", `${selectedModelName}_trends.csv`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const downloadChart = () => {
                let chartId = "trendsChart";
                if (activeTab === "prevalence") chartId = "prevalenceChart";
                else if (activeTab === "phase") chartId = "phaseChart";
                else if (activeTab === "opinion_evolution") chartId = "opinionChart";

                const canvas = document.getElementById(chartId);
                if (!canvas) return;
                const imgUrl = canvas.toDataURL("image/png");
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", imgUrl);
                downloadAnchor.setAttribute("download", `${selectedModelName}_plot_${activeTab}.png`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const downloadBuilderPipelineImage = () => {
                if (!builderNodes.length) {
                    alert("There is no pipeline to export.");
                    return;
                }

                const nodeWidths = { status: 140, compartment: 180 };
                const nodeHeights = { status: 78, compartment: 88, conditional: 108 };
                const margin = 60;
                const extraRight = 140;
                const extraBottom = 100;

                const extents = builderNodes.reduce((acc, node) => {
                    const width = nodeWidths[node.type] || 180;
                    const height = node.type === "compartment" && node.data.type === "ConditionalComposition"
                        ? nodeHeights.conditional
                        : (nodeHeights[node.type] || 88);
                    acc.minX = Math.min(acc.minX, node.x);
                    acc.minY = Math.min(acc.minY, node.y);
                    acc.maxX = Math.max(acc.maxX, node.x + width);
                    acc.maxY = Math.max(acc.maxY, node.y + height);
                    return acc;
                }, { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity });

                const width = Math.max(900, Math.ceil(extents.maxX - extents.minX + margin * 2 + extraRight));
                const height = Math.max(600, Math.ceil(extents.maxY - extents.minY + margin * 2 + extraBottom));
                const offsetX = margin - extents.minX;
                const offsetY = margin - extents.minY;

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                if (!ctx) return;

                const roundRect = (x, y, w, h, r) => {
                    const radius = Math.min(r, w / 2, h / 2);
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + w - radius, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                    ctx.lineTo(x + w, y + h - radius);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                    ctx.lineTo(x + radius, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();
                };

                ctx.fillStyle = isDarkMode ? "#020617" : "#f8fafc";
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = isDarkMode ? "#e2e8f0" : "#0f172a";
                ctx.font = "600 18px Outfit, sans-serif";
                ctx.fillText(`${builderModelName} Pipeline`, 24, 32);
                ctx.font = "12px Outfit, sans-serif";
                ctx.fillStyle = isDarkMode ? "#94a3b8" : "#475569";
                ctx.fillText(`Use case: ${builderUseCaseCatalog[builderUseCase]?.label || builderUseCase}`, 24, 52);

                const drawArrow = (x, y, angle, color) => {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-10, -5);
                    ctx.lineTo(-10, 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                };

                builderEdges.forEach(edge => {
                    const fromNode = builderNodes.find(n => n.id === edge.source);
                    const toNode = builderNodes.find(n => n.id === edge.target);
                    if (!fromNode || !toNode) return;

                    const fromWidth = nodeWidths[fromNode.type] || 180;
                    const toWidth = nodeWidths[toNode.type] || 180;
                    const x1 = fromNode.x + fromWidth + offsetX;
                    const y1 = fromNode.y + 39 + offsetY;
                    const x2 = toNode.x + offsetX;
                    let y2 = toNode.y + 39 + offsetY;
                    if (toNode.type === "compartment" && toNode.data.type === "ConditionalComposition") {
                        if (edge.targetPort === "condition") y2 = toNode.y + 43 + offsetY;
                        else if (edge.targetPort === "if_true") y2 = toNode.y + 63 + offsetY;
                        else if (edge.targetPort === "if_false") y2 = toNode.y + 83 + offsetY;
                    }

                    const dx = Math.abs(x2 - x1) * 0.5;
                    const cp1x = x1 + dx;
                    const cp2x = x2 - dx;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.bezierCurveTo(cp1x, y1, cp2x, y2, x2, y2);
                    ctx.strokeStyle = "#4f46e5";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    drawArrow(x2, y2, angle, "#4f46e5");
                });

                builderNodes.forEach(node => {
                    const widthNode = nodeWidths[node.type] || 180;
                    const heightNode = node.type === "compartment" && node.data.type === "ConditionalComposition"
                        ? nodeHeights.conditional
                        : (nodeHeights[node.type] || 88);
                    const x = node.x + offsetX;
                    const y = node.y + offsetY;
                    const selected = selectedNodeIds.includes(node.id);

                    ctx.save();
                    ctx.fillStyle = node.type === "status"
                        ? (isDarkMode ? "#0f172a" : "#ffffff")
                        : (isDarkMode ? "#111827" : "#ffffff");
                    ctx.strokeStyle = selected ? "#6366f1" : (isDarkMode ? "#334155" : "#cbd5e1");
                    ctx.lineWidth = selected ? 3 : 1.5;
                    roundRect(x, y, widthNode, heightNode, 12);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = node.type === "status"
                        ? (isDarkMode ? "#0ea5e9" : "#0284c7")
                            : node.data.type === "ConditionalComposition"
                            ? (isDarkMode ? "#10b981" : "#059669")
                            : (isDarkMode ? "#a855f7" : "#7c3aed");
                    roundRect(x, y, widthNode, 18, 12);
                    ctx.fill();

                    ctx.fillStyle = isDarkMode ? "#f8fafc" : "#0f172a";
                    ctx.font = "700 10px Outfit, sans-serif";
                    ctx.fillText(node.type === "status" ? "Status Node" : node.data.type === "ConditionalComposition" ? "Conditional" : "Compartment", x + 10, y + 12);

                    ctx.font = "700 12px Outfit, sans-serif";
                    const title = String(node.data.name || node.id);
                    ctx.fillText(title.slice(0, 20), x + 10, y + 42);
                    ctx.font = "10px Outfit, sans-serif";
                    ctx.fillStyle = isDarkMode ? "#94a3b8" : "#475569";
                    if (node.type === "status") {
                        ctx.fillText(`Code ${node.data.code}`, x + 10, y + 60);
                    } else {
                        ctx.fillText(String(node.data.type || ""), x + 10, y + 60);
                    }
                    ctx.restore();
                });

                const safeName = (builderModelName || "builder_pipeline").replace(/[^A-Za-z0-9_]/g, "_");
                const downloadAnchor = document.createElement("a");
                downloadAnchor.href = canvas.toDataURL("image/png");
                downloadAnchor.download = `${safeName}_pipeline.png`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const downloadTextFile = (filename, content, mimeType = "text/plain;charset=utf-8") => {
                const blob = new Blob([content], { type: mimeType });
                const objectUrl = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement("a");
                downloadAnchor.href = objectUrl;
                downloadAnchor.download = filename;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                URL.revokeObjectURL(objectUrl);
            };

            const downloadCustomModelPython = (modelName) => {
                const safeName = (modelName || "").replace(/[^A-Za-z0-9_]/g, "");
                if (!safeName) {
                    alert("Invalid model name.");
                    return;
                }

                const downloadUrl = `${apiBaseUrl}/api/custom-models/download?name=${encodeURIComponent(safeName)}`;
                const downloadAnchor = document.createElement("a");
                downloadAnchor.href = downloadUrl;
                downloadAnchor.download = `${safeName}.py`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const copyNDQLToClipboard = async () => {
                const ndql = getLiveNDQLPreview();
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(ndql);
                    } else {
                        const fallbackArea = document.createElement("textarea");
                        fallbackArea.value = ndql;
                        fallbackArea.style.position = "fixed";
                        fallbackArea.style.opacity = "0";
                        document.body.appendChild(fallbackArea);
                        fallbackArea.focus();
                        fallbackArea.select();
                        document.execCommand("copy");
                        fallbackArea.remove();
                    }
                    alert("NDQL script copied to clipboard.");
                } catch (err) {
                    const fallbackArea = document.createElement("textarea");
                    fallbackArea.value = ndql;
                    fallbackArea.style.position = "fixed";
                    fallbackArea.style.opacity = "0";
                    document.body.appendChild(fallbackArea);
                    fallbackArea.focus();
                    fallbackArea.select();
                    document.execCommand("copy");
                    fallbackArea.remove();
                    alert("NDQL script copied to clipboard.");
                }
            };

            const fetchCustomModels = (baseUrl = apiBaseUrl) => {
                fetch(baseUrl + "/api/custom-models")
                    .then(res => res.json())
                    .then(data => {
                        if (!data.error) {
                            setCustomModels(data);
                        }
                    })
                    .catch(err => console.error("Failed to fetch custom models:", err));
            };

            useEffect(() => {
                if (showModelBuilder) {
                    fetchCustomModels();
                }
            }, [showModelBuilder]);

            const saveCustomModel = () => {
                const liveNodes = builderNodesRef.current || builderNodes;
                const liveEdges = builderEdgesRef.current || builderEdges;
                const liveInitialStatus = builderInitialStatusRef.current || builderInitialStatus;
                const payload = {
                    name: builderModelName,
                    use_case: builderUseCase,
                    template_id: builderTemplateId,
                    statuses: liveNodes.filter(n => n.type === "status").map(n => ({
                        name: n.data.name,
                        code: n.data.code
                    })),
                    compartments: liveNodes.filter(n => n.type === "compartment").map(n => {
                        const cData = {
                            name: n.data.name,
                            type: n.data.type,
                            params: { ...n.data.params }
                        };
                        if (n.data.type === "ConditionalComposition") {
                            const condEdge = liveEdges.find(e => e.target === n.id && e.targetPort === "condition");
                            const trueEdge = liveEdges.find(e => e.target === n.id && e.targetPort === "if_true");
                            const falseEdge = liveEdges.find(e => e.target === n.id && e.targetPort === "if_false");
                            
                            const condNode = condEdge ? liveNodes.find(node => node.id === condEdge.source) : null;
                            const trueNode = trueEdge ? liveNodes.find(node => node.id === trueEdge.source) : null;
                            const falseNode = falseEdge ? liveNodes.find(node => node.id === falseEdge.source) : null;
                            
                            cData.params.condition = condNode ? condNode.data.name : "";
                            cData.params.first_branch = trueNode ? trueNode.data.name : "";
                            cData.params.second_branch = falseNode ? falseNode.data.name : "";
                        }
                        return cData;
                    }),
                    rules: [],
                    initial_status: liveInitialStatus,
                    nodes: liveNodes,
                    edges: liveEdges
                };

                liveNodes.filter(n => n.type === "compartment").forEach(compNode => {
                    const incoming = liveEdges.filter(e => e.target === compNode.id && (e.targetPort === "in" || !e.targetPort));
                    const outgoing = liveEdges.filter(e => e.source === compNode.id);
                    
                    incoming.forEach(incEdge => {
                        const fromNode = liveNodes.find(n => n.id === incEdge.source);
                        if (fromNode && fromNode.type === "status") {
                            outgoing.forEach(outEdge => {
                                const toNode = liveNodes.find(n => n.id === outEdge.target);
                                if (toNode && toNode.type === "status") {
                                    payload.rules.push({
                                        from: fromNode.data.name,
                                        to: toNode.data.name,
                                        using: compNode.data.name
                                    });
                                }
                            });
                        }
                    });
                });

                fetch(apiBaseUrl + "/api/custom-models/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert("Error saving model: " + data.error);
                    } else {
                        alert("Model saved and registered successfully!");
                        fetchCustomModels();
                        loadModels();
                    }
                })
                .catch(err => alert("Connection error: " + err.message));
            };

            const deleteCustomModel = (modelName) => {
                if (!confirm("Are you sure you want to delete this custom model? This will remove its files and class definition.")) return;
                
                fetch(apiBaseUrl + "/api/custom-models/delete", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: modelName })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert("Error deleting model: " + data.error);
                    } else {
                        alert("Model deleted successfully!");
                        fetchCustomModels();
                        loadModels();
                        if (selectedModelName === modelName) {
                            setSelectedCategory("Epidemics");
                            selectModel("SIRModel");
                        }
                    }
                })
                .catch(err => alert("Connection error: " + err.message));
            };

            const loadCustomModelLayout = (modelData) => {
                if (modelData.nodes && modelData.edges) {
                    if (modelData.use_case && builderUseCaseCatalog[modelData.use_case]) {
                        setBuilderUseCase(modelData.use_case);
                    }
                    if (modelData.template_id && builderTemplates[modelData.template_id]) {
                        setBuilderTemplateId(modelData.template_id);
                    }
                    setBuilderModelName(modelData.name);
                    setBuilderNodes(modelData.nodes);
                    setBuilderEdges(modelData.edges);
                    setBuilderInitialStatus(modelData.initial_status || []);
                    clearBuilderSelection();
                    clearBuilderInteractionState();
                } else {
                    alert("This model has no saved visual layout.");
                }
            };

            const getLiveNDQLPreview = () => {
                const lines = [];
                lines.push(`MODEL ${builderModelName}`);
                lines.push("");

                const statuses = builderNodes.filter(n => n.type === "status");
                statuses.forEach(n => {
                    lines.push(`STATUS ${n.data.name}`);
                });
                if (statuses.length > 0) lines.push("");

                const compartments = builderNodes.filter(n => n.type === "compartment");
                compartments.forEach(n => {
                    if (n.data.type === "ConditionalComposition") {
                        const condEdge = builderEdges.find(e => e.target === n.id && e.targetPort === "condition");
                        const trueEdge = builderEdges.find(e => e.target === n.id && e.targetPort === "if_true");
                        const falseEdge = builderEdges.find(e => e.target === n.id && e.targetPort === "if_false");
                        
                        const condNode = condEdge ? builderNodes.find(node => node.id === condEdge.source) : null;
                        const trueNode = trueEdge ? builderNodes.find(node => node.id === trueEdge.source) : null;
                        const falseNode = falseEdge ? builderNodes.find(node => node.id === falseEdge.source) : null;
                        
                        const condName = condNode ? condNode.data.name : "";
                        const trueName = trueNode ? trueNode.data.name : "";
                        const falseName = falseNode ? falseNode.data.name : "";
                        
                        lines.push(`IF ${condName} THEN ${trueName} ELSE ${falseName} AS ${n.data.name}`);
                        lines.push("");
                    } else {
                        lines.push(`COMPARTMENT ${n.data.name}`);
                        lines.push(`TYPE ${n.data.type}`);
                        if (n.data.params.triggering_status) {
                            lines.push(`TRIGGER ${n.data.params.triggering_status}`);
                        }
                        Object.keys(n.data.params).forEach(k => {
                            if (k !== "triggering_status") {
                                lines.push(`PARAM ${k} ${n.data.params[k]}`);
                            }
                        });
                        lines.push("");
                    }
                });

                compartments.forEach(compNode => {
                    const incoming = builderEdges.filter(e => e.target === compNode.id && (e.targetPort === "in" || !e.targetPort));
                    const outgoing = builderEdges.filter(e => e.source === compNode.id);
                    
                    incoming.forEach(incEdge => {
                        const fromNode = builderNodes.find(n => n.id === incEdge.source);
                        if (fromNode && fromNode.type === "status") {
                            outgoing.forEach(outEdge => {
                                const toNode = builderNodes.find(n => n.id === outEdge.target);
                                if (toNode && toNode.type === "status") {
                                    lines.push(`RULE`);
                                    lines.push(`FROM ${fromNode.data.name}`);
                                    lines.push(`TO ${toNode.data.name}`);
                                    lines.push(`USING ${compNode.data.name}`);
                                    lines.push("");
                                }
                            });
                        }
                    });
                });

                lines.push("INITIALIZE");
                builderInitialStatus.forEach(init => {
                    lines.push(`SET ${init.status} ${init.ratio}`);
                });

                return lines.join("\n");
            };

            const handleCanvasMouseMove = (e) => {
                const point = getBuilderCanvasPoint(e);
                if (!point) return;

                if (draggingNodes.length > 0 && dragAnchor) {
                    const deltaX = point.x - dragAnchor.x;
                    const deltaY = point.y - dragAnchor.y;
                    const draggingMap = new Map(draggingNodes.map(item => [item.id, item]));
                    setBuilderNodes(prev => prev.map(node => {
                        const dragItem = draggingMap.get(node.id);
                        if (!dragItem) return node;
                        return {
                            ...node,
                            x: Math.max(10, Math.min(4000, dragItem.startX + deltaX)),
                            y: Math.max(10, Math.min(4000, dragItem.startY + deltaY))
                        };
                    }));
                }

                if (linkingSource !== null) {
                    setTempEdgeEnd({ x: point.x, y: point.y });
                }
            };

            const handleCanvasMouseUp = (e) => {
                finalizeBuilderLinkFromEvent(e);
                clearBuilderInteractionState();
            };

            const startNodeDrag = (e, id) => {
                if (e.target.closest('.handle')) return;
                e.preventDefault();
                const node = builderNodes.find(n => n.id === id);
                if (!node) return;

                const isAdditive = e.shiftKey || e.metaKey || e.ctrlKey;
                const alreadySelected = selectedNodeIds.includes(id);
                const dragIds = alreadySelected && selectedNodeIds.length > 1 ? selectedNodeIds : [id];
                const dragState = dragIds
                    .map(nodeId => {
                        const dragNode = builderNodes.find(n => n.id === nodeId);
                        return dragNode ? { id: nodeId, startX: dragNode.x, startY: dragNode.y } : null;
                    })
                    .filter(Boolean);

                if (isAdditive) {
                    if (!alreadySelected) {
                        setSelectedNodeIds(prev => [...prev, id]);
                    }
                } else if (!alreadySelected || selectedNodeIds.length > 1) {
                    setSelectedNodeIds([id]);
                }

                setSelectedElement(node);
                setDraggingNodes(dragState);
                setDragAnchor(getBuilderCanvasPoint(e));
            };

            const handleNodeSelection = (e, id) => {
                if (e.shiftKey || e.metaKey || e.ctrlKey) {
                    toggleBuilderNodeSelection(id);
                    return;
                }
                if (!selectedNodeIds.includes(id) || selectedNodeIds.length > 1) {
                    focusBuilderNode(id);
                }
            };

            const handleHandleMouseDown = (e, nodeId, handleType) => {
                e.stopPropagation();
                e.preventDefault();
                const rect = e.currentTarget.getBoundingClientRect();
                const canvas = document.getElementById("builder-canvas")?.getBoundingClientRect();
                if (!canvas) return;
                const startX = (rect.left + rect.width / 2 - canvas.left) / builderZoom;
                const startY = (rect.top + rect.height / 2 - canvas.top) / builderZoom;
                
                const source = { nodeId, handleType, startX, startY };
                linkingSourceRef.current = source;
                setLinkingSource(source);
                setTempEdgeEnd({ x: startX, y: startY });
            };

            const createBuilderEdge = (sourceNodeId, targetNodeId, targetPort) => {
                const liveEdges = builderEdgesRef.current || builderEdges;
                const exists = liveEdges.some(edge =>
                    edge.source === sourceNodeId &&
                    edge.target === targetNodeId &&
                    edge.targetPort === targetPort
                );
                if (exists) return false;
                setBuilderEdges(prev => [...prev, {
                    id: `edge_${Date.now()}`,
                    source: sourceNodeId,
                    target: targetNodeId,
                    targetPort
                }]);
                return true;
            };

            const finalizeBuilderLink = (source, targetNodeId, targetPort) => {
                if (!source || source.nodeId === targetNodeId) return false;
                if (source.handleType !== "out") return false;
                if (!["in", "condition", "if_true", "if_false"].includes(targetPort)) return false;
                return createBuilderEdge(source.nodeId, targetNodeId, targetPort);
            };

            const handleHandleMouseUp = (e, targetNodeId, handleType) => {
                e.stopPropagation();
                finalizeBuilderLink(linkingSourceRef.current || linkingSource, targetNodeId, handleType);
                linkingSourceRef.current = null;
                setLinkingSource(null);
                setTempEdgeEnd(null);
            };
            const handleCardMouseUp = (e, targetNodeId) => {
                finalizeBuilderLinkFromEvent(e, linkingSourceRef.current || linkingSource);
                linkingSourceRef.current = null;
                setLinkingSource(null);
                setTempEdgeEnd(null);
            };

            const addStatusNode = () => {
                clearBuilderInteractionState();
                const id = `status_${Date.now()}`;
                const name = `State_${builderNodes.filter(n => n.type === "status").length + 1}`;
                const code = builderNodes.filter(n => n.type === "status").length;
                const newNode = {
                    id,
                    type: "status",
                    x: 100 + Math.random() * 50,
                    y: 100 + Math.random() * 50,
                    data: { name, code }
                };
                setBuilderNodes(prev => [...prev, newNode]);
                setBuilderInitialStatus(prev => [...prev, { status: name, ratio: 0.0 }]);
            };

            const addCompartmentNode = (type) => {
                clearBuilderInteractionState();
                const id = `comp_${Date.now()}`;
                const name = `comp_${builderNodes.filter(n => n.type === "compartment").length + 1}`;
                
                let params = {};
                if (type === "NodeStochastic") params = { rate: 0.1, triggering_status: "" };
                else if (type === "NodeThreshold") params = { threshold: 0.1, triggering_status: "" };
                else if (type === "EdgeStochastic") params = { threshold: 0.1, triggering_status: "" };
                else if (type === "CountDown") params = { iterations: 5 };
                else if (type === "NodeCategoricalAttribute") params = { attribute: "gender", value: "male", probability: 1.0 };
                else if (type === "NodeNumericalAttribute") params = { attribute: "age", op: "==", value: 25, probability: 1.0 };
                else if (type === "NodeNumericalVariable") params = { var: "opinion", var_type: "ATTRIBUTE", value: 0.5, op: ">=", probability: 1.0 };
                else if (type === "ConditionalComposition") params = { condition: "", first_branch: "", second_branch: "" };

                const newNode = {
                    id,
                    type: "compartment",
                    x: 250 + Math.random() * 50,
                    y: 100 + Math.random() * 50,
                    data: {
                        name,
                        type,
                        params
                    }
                };
                setBuilderNodes(prev => [...prev, newNode]);
            };

            const deleteSelectedElement = () => {
                if (!selectedElement) return;

                if (selectedNodeIds.length > 1 && !selectedElement.source && !selectedElement.target) {
                    const idsToDelete = new Set(selectedNodeIds);
                    const namesToDelete = new Set(
                        builderNodes
                            .filter(n => idsToDelete.has(n.id) && n.type === "status")
                            .map(n => n.data.name)
                    );
                    setBuilderNodes(prev => prev.filter(n => !idsToDelete.has(n.id)));
                    setBuilderEdges(prev => prev.filter(e => !idsToDelete.has(e.source) && !idsToDelete.has(e.target)));
                    setBuilderInitialStatus(prev => prev.filter(init => !namesToDelete.has(init.status)));
                    clearBuilderSelection();
                    clearBuilderInteractionState();
                    return;
                }
                
                if (selectedElement.source && selectedElement.target) {
                    setBuilderEdges(prev => prev.filter(e => e.id !== selectedElement.id));
                    clearBuilderSelection();
                } else {
                    const nodeId = selectedElement.id;
                    setBuilderNodes(prev => prev.filter(n => n.id !== nodeId));
                    setBuilderEdges(prev => prev.filter(e => e.source !== nodeId && e.target !== nodeId));
                    
                    if (selectedElement.type === "status") {
                        setBuilderInitialStatus(prev => prev.filter(init => init.status !== selectedElement.data.name));
                    }
                    clearBuilderSelection();
                }
            };

            const updateNodeData = (nodeId, updatedData) => {
                const oldNode = builderNodes.find(n => n.id === nodeId);
                if (oldNode && oldNode.type === "status" && updatedData.name !== oldNode.data.name) {
                    const oldName = oldNode.data.name;
                    const newName = updatedData.name;
                    
                    setBuilderInitialStatus(prev => prev.map(init => 
                        init.status === oldName ? { ...init, status: newName } : init
                    ));

                    setBuilderNodes(prev => prev.map(node => {
                        if (node.type === "compartment" && node.data.params.triggering_status === oldName) {
                            return {
                                ...node,
                                data: {
                                    ...node.data,
                                    params: {
                                        ...node.data.params,
                                        triggering_status: newName
                                    }
                                }
                            };
                        }
                        return node;
                    }));
                }

                setBuilderNodes(prev => prev.map(node => {
                    if (node.id === nodeId) {
                        return {
                            ...node,
                            data: {
                                ...node.data,
                                ...updatedData
                            }
                        };
                    }
                    return node;
                }));

                setSelectedElement(prev => {
                    if (prev && prev.id === nodeId) {
                        return {
                            ...prev,
                            data: {
                                ...prev.data,
                                ...updatedData
                            }
                        };
                    }
                    return prev;
                });
            };

            const updateInitialStatusRatio = (statusName, ratio) => {
                setBuilderInitialStatus(prev => prev.map(init => 
                    init.status === statusName ? { ...init, ratio: parseFloat(ratio) || 0 } : init
                ));
            };

            const renderModelBuilder = () => {
                const liveNDQL = getLiveNDQLPreview();
                const statusesList = builderNodes.filter(n => n.type === "status");
                const compartmentsList = builderNodes.filter(n => n.type === "compartment");
                const activeUseCaseConfig = builderUseCaseCatalog[builderUseCase] || builderUseCaseCatalog.epidemics;
                const visibleBlocks = getVisibleBuilderBlocks();
                const visibleTemplates = activeUseCaseConfig.templates.map(templateId => ({
                    id: templateId,
                    ...getBuilderTemplate(templateId)
                }));

                return (
                    <div class={`w-full flex-grow flex flex-col h-screen overflow-hidden ${isDarkMode ? "text-slate-200 bg-slate-950" : "text-slate-800 bg-slate-100"}`}>
                        {/* Builder Header */}
                        <div class={`h-16 border-b px-6 flex items-center gap-4 z-10 shrink-0 ${isDarkMode ? "border-slate-800 bg-slate-900" : "border-slate-200 bg-white"}`}>
                            <div class="flex items-center space-x-4 shrink-0">
                                <button 
                                    onClick={() => {
                                        setShowModelBuilder(false);
                                        loadModels();
                                    }} 
                                    class={`px-3 py-1.5 rounded-lg text-sm transition cursor-pointer ${isDarkMode ? "bg-slate-800 hover:bg-slate-700 text-slate-300" : "bg-slate-200 hover:bg-slate-300 text-slate-700"}`}
                                >
                                    <i class="fa-solid fa-arrow-left mr-2"></i>Back to Dashboard
                                </button>
                                <div class={`h-5 w-[1px] ${isDarkMode ? "bg-slate-800" : "bg-slate-200"}`}></div>
                                <span class="text-sm font-semibold tracking-wide uppercase text-indigo-400">Visual Model Builder</span>
                            </div>
                            <div class="flex-1 flex justify-center min-w-0">
                                <input 
                                    type="text" 
                                    value={builderModelName}
                                    onChange={(e) => setBuilderModelName(e.target.value.replace(/[^a-zA-Z0-9_]/g, ""))}
                                    placeholder="ModelName"
                                    class={`w-full max-w-md rounded px-3 py-1.5 text-sm font-bold focus:outline-none focus:border-indigo-500 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-slate-50 border-slate-200 text-slate-800"}`}
                                />
                            </div>
                            <div class="flex items-center justify-end shrink-0">
                                <button 
                                    onClick={saveCustomModel}
                                    class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-1.5 rounded-lg text-sm transition cursor-pointer flex items-center shadow-md shadow-cyan-950/20 whitespace-nowrap"
                                >
                                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Save & Register Model
                                </button>
                            </div>
                        </div>

                        {/* Editor Body */}
                        <div class="flex-grow flex h-[calc(100vh-64px)] overflow-hidden">
                            {/* Draggable Blocks Sidebar */}
                            <div class={`relative shrink-0 overflow-hidden border-r transition-all duration-300 ${builderLeftSidebarCollapsed ? "w-14" : "w-full md:w-96"} ${isDarkMode ? "border-slate-800 bg-slate-900/50" : "border-slate-200 bg-slate-50"}`}>
                                <div class="absolute top-3 right-3 z-20">
                                    <button
                                        type="button"
                                        onClick={() => setBuilderLeftSidebarCollapsed(prev => !prev)}
                                        class={`h-8 w-8 rounded-lg border flex items-center justify-center transition cursor-pointer ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-300 hover:text-white hover:border-slate-700" : "bg-white border-slate-200 text-slate-700 hover:text-slate-900 hover:border-slate-300"}`}
                                        title={builderLeftSidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                                    >
                                        <i class={`fa-solid ${builderLeftSidebarCollapsed ? "fa-angles-right" : "fa-angles-left"}`}></i>
                                    </button>
                                </div>

                                {!builderLeftSidebarCollapsed && (
                                    <div class="h-full overflow-y-auto p-4 space-y-6">
                                        <div>
                                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Use Case</h4>
                                            <div class="grid grid-cols-2 gap-2">
                                                {Object.entries(builderUseCaseCatalog).map(([key, useCase]) => (
                                                    <button
                                                        key={key}
                                                        type="button"
                                                        onMouseDown={(e) => e.preventDefault()}
                                                        onClick={() => {
                                                            clearBuilderInteractionState();
                                                            setBuilderUseCase(key);
                                                        }}
                                                        class={`px-2 py-2 rounded-xl border text-left transition cursor-pointer ${builderUseCase === key ? "border-indigo-500 bg-indigo-500/10 text-white" : isDarkMode ? "border-slate-800 bg-slate-900 text-slate-300 hover:border-slate-700" : "border-slate-200 bg-white text-slate-700 hover:border-slate-300"}`}
                                                        title={useCase.description}
                                                    >
                                                        <div class="text-[10px] font-bold uppercase tracking-wider">{useCase.label}</div>
                                                        <div class="text-[9px] text-slate-400">{useCase.description}</div>
                                                    </button>
                                                ))}
                                            </div>
                                            <p class="text-[10px] text-slate-500 mt-3 italic">{activeUseCaseConfig.description}</p>
                                        </div>

                                        <div>
                                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Starter Examples</h4>
                                            <div class="space-y-2">
                                                {visibleTemplates.map(template => (
                                                    <button
                                                        key={template.id}
                                                        type="button"
                                                        onMouseDown={(e) => e.preventDefault()}

                                                                onClick={() => loadCustomModelLayout(m)}

                                                                onClick={() => downloadCustomModelPython(m.name)}

                                <div
                                    class="relative w-full h-full origin-top-left"
                                    style={{ transform: `scale(${builderZoom})` }}
                                >
                                    <svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
                                        <defs>
                                            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5" />
                                            </marker>
                                        </defs>
                                        
                                        {builderEdges.map(edge => {
                                            const fromNode = builderNodes.find(n => n.id === edge.source);
                                            const toNode = builderNodes.find(n => n.id === edge.target);
                                            if (!fromNode || !toNode) return null;
                                            
                                            const x1 = fromNode.x + (fromNode.type === "status" ? 140 : 180);
                                            const y1 = fromNode.y + 39;
                                            const x2 = toNode.x;
                                            let y2 = toNode.y + 39;
                                            if (toNode.type === "compartment" && toNode.data.type === "ConditionalComposition") {
                                                if (edge.targetPort === "condition") y2 = toNode.y + 43;
                                                else if (edge.targetPort === "if_true") y2 = toNode.y + 63;
                                                else if (edge.targetPort === "if_false") y2 = toNode.y + 83;
                                            }
                                            
                                            const isSelected = selectedElement && selectedElement.source === edge.source && selectedElement.target === edge.target;
                                            const dx = Math.abs(x2 - x1) * 0.5;
                                            const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
                                            
                                            return (
                                                <g key={edge.id} class="pointer-events-auto cursor-pointer" onClick={(e) => { e.stopPropagation(); setSelectedElement(edge); }}>
                                                    <path d={d} fill="none" stroke="transparent" strokeWidth="12" />
                                                    <path 
                                                        d={d} 
                                                        fill="none" 
                                                        stroke={isSelected ? "#ef4444" : "#4f46e5"} 
                                                        strokeWidth={isSelected ? 3 : 2} 
                                                        markerEnd="url(#arrow)"
                                                        class="transition"
                                                    />
                                                </g>
                                            );
                                        })}
                                        
                                        {linkingSource && tempEdgeEnd && (
                                            <line 
                                                x1={linkingSource.startX} 
                                                y1={linkingSource.startY} 
                                                x2={tempEdgeEnd.x} 
                                                y2={tempEdgeEnd.y}

                                                strokeDasharray="4 4"

                                                        <span>{node.type === "status" ? "Status Node" : node.data.type === "ConditionalComposition" ? "Conditional" : "Compartment"}</span>

                                                    </div>

                                                    <div class="p-3 flex flex-col text-xs font-semibold">
                                                        {node.type === "status" ? (
                                                            <div class="flex items-center justify-between">
                                                                <span class={`truncate max-w-[100px] ${isDarkMode ? "text-slate-100" : "text-slate-900"}`}>{node.data.name}</span>
                                                                <span class={`px-1.5 py-0.5 rounded text-[10px] ${isDarkMode ? "bg-sky-500/10 text-sky-400" : "bg-sky-100 text-sky-700"}`}>Code {node.data.code}</span>
                                                            </div>
                                                        ) : (
                                                            <div class="space-y-1">
                                                                <p class={`truncate font-bold ${isDarkMode ? "text-slate-100" : "text-slate-900"}`}>{node.data.name}</p>
                                                                <p class={`text-[10px] truncate ${isDarkMode ? "text-slate-400" : "text-slate-500"}`}>{node.data.type}</p>
                                                            </div>
                                                        )}
                                                    </div>

                                                    {node.type === "compartment" && node.data.type === "ConditionalComposition" ? (
                                                        <>
                                                            <div 
                                                                onMouseDown={(e) => handleHandleMouseDown(e, node.id, "condition")}
                                                                onMouseUp={(e) => handleHandleMouseUp(e, node.id, "condition")}
                                                                data-builder-node-id={node.id}
                                                                data-builder-handle-type="condition"
                                                                class="handle absolute left-0 top-[36px] -translate-x-[7px] w-3.5 h-3.5 rounded-full bg-red-500 border-2 border-red-500 hover:bg-red-400 hover:scale-150 transition cursor-crosshair z-20 pointer-events-auto"
                                                                title="Connect condition compartment"
                                                            />
                                                            <span class="absolute left-3 top-[34px] text-[8px] font-bold text-slate-400 pointer-events-none">cond</span>
                                                            
                                                            <div 
                                                                onMouseDown={(e) => handleHandleMouseDown(e, node.id, "if_true")}
                                                                onMouseUp={(e) => handleHandleMouseUp(e, node.id, "if_true")}
                                                                data-builder-node-id={node.id}
                                                                data-builder-handle-type="if_true"
                                                                class="handle absolute left-0 top-[56px] -translate-x-[7px] w-3.5 h-3.5 rounded-full bg-red-500 border-2 border-red-500 hover:bg-red-400 hover:scale-150 transition cursor-crosshair z-20 pointer-events-auto"
                                                                title="Connect IF_TRUE branch"
                                                            />
                                                            <span class="absolute left-3 top-[54px] text-[8px] font-bold text-slate-400 pointer-events-none">true</span>

                                                            <div 
                                                                onMouseDown={(e) => handleHandleMouseDown(e, node.id, "if_false")}
                                                                onMouseUp={(e) => handleHandleMouseUp(e, node.id, "if_false")}
                                                                data-builder-node-id={node.id}
                                                                data-builder-handle-type="if_false"
                                                                class="handle absolute left-0 top-[76px] -translate-x-[7px] w-3.5 h-3.5 rounded-full bg-red-500 border-2 border-red-500 hover:bg-red-400 hover:scale-150 transition cursor-crosshair z-20 pointer-events-auto"
                                                                title="Connect IF_FALSE branch"
                                                            />
                                                            <span class="absolute left-3 top-[74px] text-[8px] font-bold text-red-400 pointer-events-none">false</span>
                                                        </>
                                                    ) : (
                                                        <div 
                                                            onMouseDown={(e) => handleHandleMouseDown(e, node.id, "in")}
                                                            onMouseUp={(e) => handleHandleMouseUp(e, node.id, "in")}
                                                            data-builder-node-id={node.id}
                                                            data-builder-handle-type="in"
                                                            class="handle absolute left-0 top-[32px] -translate-x-[7px] w-3.5 h-3.5 rounded-full bg-red-500 border-2 border-red-500 hover:bg-red-400 hover:scale-150 transition cursor-crosshair z-20 pointer-events-auto"
                                                            title="Connect input"
                                                        />
                                                    )}
                                                    <div 
                                                        onMouseDown={(e) => handleHandleMouseDown(e, node.id, "out")}
                                                        onMouseUp={(e) => handleHandleMouseUp(e, node.id, "out")}
                                                        data-builder-node-id={node.id}
                                                        data-builder-handle-type="out"
                                                        class="handle absolute right-0 top-[32px] translate-x-[7px] w-3.5 h-3.5 rounded-full bg-slate-800 border-2 border-blue-500 hover:bg-blue-500 hover:scale-150 transition cursor-crosshair z-20 pointer-events-auto"
                                                        title="Connect output to compartment/status"
                                                    />
                                                </div>
                                            );
                                        })}

                                </div>

                                <div class="absolute top-3 right-3 z-20 flex flex-col items-end gap-2">

                                                title="Zoom out"
                                            >
                                                <i class="fa-solid fa-magnifying-glass-minus"></i>
                                            </button>

                                                title="Zoom in"

                                                title="Reset zoom"

                                                <i class="fa-solid fa-rotate-left"></i>
                                            </button>

                                        <button 
                                            onClick={() => {

                                                    setBuilderNodes([]);
                                                    setBuilderEdges([]);
                                                    setBuilderInitialStatus([]);
                                                    clearBuilderSelection();
                                                    clearBuilderInteractionState();
                                                }

                                            class={`px-3 py-1.5 rounded-xl text-sm transition cursor-pointer ${isDarkMode ? "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700" : "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200"}`}

                                            <i class="fa-solid fa-trash-can mr-2"></i>Clear Canvas

                                        <button 
                                            onClick={() => autoLayoutBuilder()}

                                            class={`px-3 py-1.5 rounded-xl text-sm transition cursor-pointer flex items-center ${builderNodes.length === 0 ? "opacity-50 cursor-not-allowed" : isDarkMode ? "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700" : "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200"}`}
                                        >
                                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Auto Layout
