<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDlib Interactive Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Cytoscape.js for Graph rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-border-glow:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            border-color: rgba(99, 102, 241, 0.8);
        }

        /* Day Theme Override */
        body.theme-light {
            background: radial-gradient(circle at top right, #f8fafc, #e2e8f0) !important;
            color: #1e293b !important;
        }
        body.theme-light ::-webkit-scrollbar-track {
            background: #cbd5e1;
        }
        body.theme-light ::-webkit-scrollbar-thumb {
            background: #94a3b8;
        }
        
        /* Sidebar Logo */
        body.theme-light img[alt="NDlib Logo"] {
            filter: invert(0.85) !important;
        }

        /* Glassmorphism sidebar background */
        body.theme-light .glass-panel {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-right: 1px solid #cbd5e1 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05) !important;
        }

        /* Sidebar selectors, inputs, buttons */
        body.theme-light input, 
        body.theme-light select, 
        body.theme-light textarea {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #1e293b !important;
        }
        body.theme-light input:focus, 
        body.theme-light select:focus {
            border-color: #4f46e5 !important;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2) !important;
        }

        /* Label and Text Colors */
        body.theme-light .text-slate-400 {
            color: #475569 !important; /* Dark slate grey for uppercase labels */
            font-weight: 600 !important;
        }
        body.theme-light .text-slate-300 {
            color: #1e293b !important; /* Darker slate for description / labels */
        }
        body.theme-light .text-slate-200 {
            color: #1e293b !important;
        }
        body.theme-light .text-slate-100 {
            color: #0f172a !important;
        }
        body.theme-light .text-white {
            color: #0f172a !important;
        }
        body.theme-light .text-indigo-400 {
            color: #4f46e5 !important; /* Bright accessible indigo */
        }
        body.theme-light .text-indigo-300 {
            color: #4f46e5 !important;
        }

        /* Sidebar category tab bar background & inactive tabs */
        body.theme-light .bg-slate-900\/60 {
            background-color: #e2e8f0 !important;
            border-color: #cbd5e1 !important;
        }
        body.theme-light button.text-slate-400:not(.bg-indigo-600) {
            color: #475569 !important;
        }
        body.theme-light button.text-slate-400:not(.bg-indigo-600):hover {
            color: #0f172a !important;
        }

        /* Right visualizer top panel / tab bar container */
        body.theme-light .bg-slate-900\/50 {
            background-color: #f1f5f9 !important;
            border-bottom: 1px solid #cbd5e1 !important;
        }

        /* Visualizer active/inactive tab buttons */
        body.theme-light .bg-slate-800 {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
            border: 1px solid #4f46e5 !important;
        }
        body.theme-light button.text-slate-400 {
            color: #475569 !important;
        }
        body.theme-light button.text-slate-400:hover {
            color: #0f172a !important;
        }

        /* Export/control buttons */
        body.theme-light button.bg-slate-800 {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #334155 !important;
        }
        body.theme-light button.bg-slate-800:hover {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
            border-color: #94a3b8 !important;
        }
        body.theme-light button.bg-indigo-600 {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
        }
        body.theme-light button.bg-indigo-600:hover {
            background-color: #4338ca !important;
        }

        /* Borders & background panels */
        body.theme-light .border-slate-800 {
            border-color: #cbd5e1 !important;
        }
        body.theme-light .border-slate-900 {
            border-color: #cbd5e1 !important;
        }
        body.theme-light .border-slate-800\/80 {
            border-color: #cbd5e1 !important;
        }
        body.theme-light .bg-slate-950\/20 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1) !important;
        }
        body.theme-light .bg-slate-950\/40 {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05) !important;
        }
        body.theme-light .bg-slate-950\/60 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.theme-light .bg-slate-900\/40 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.theme-light .bg-slate-900 {
            background-color: #ffffff !important;
        }
        body.theme-light .hover_bg-slate-900\/50:hover {
            background-color: #f1f5f9 !important;
        }

        /* Playback control text labels */
        body.theme-light .text-slate-400.w-16 {
            color: #334155 !important;
            font-weight: 500 !important;
        }
    </style>
</head>
<body class="flex flex-col min-height-screen">

    <div id="root" class="w-full flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [models, setModels] = useState({});
            const [selectedCategory, setSelectedCategory] = useState("Epidemics");
            const [selectedModelName, setSelectedModelName] = useState("");
            const [modelParams, setModelParams] = useState({});
            const [graphType, setGraphType] = useState("erdos_renyi");
            const [graphParams, setGraphParams] = useState({
                n: 100,
                p: 0.1,
                m: 2,
                k: 4,
                community_groups: 4,
                community_size: 25,
                p_in: 0.25,
                p_out: 0.02,
                tau1: 2.0,
                tau2: 1.5,
                mu: 0.1,
                average_degree: 8,
                min_degree: 3,
                min_community: 20,
                max_iters: 500,
                file_content: "",
                file_format: "graphml",
                file_name: ""
            });
            const [iterations, setIterations] = useState(50);
            const [activeTab, setActiveTab] = useState("trends");
            const [networkPreview, setNetworkPreview] = useState(null);
            const [loadingMessage, setLoadingMessage] = useState("");
            const [selectedSeedNodes, setSelectedSeedNodes] = useState([]);

            // Simulation results
            const [results, setResults] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [apiBaseUrl, setApiBaseUrl] = useState(
                window.location.protocol === "file:" ? "http://127.0.0.1:5000" : ""
            );
            const [blockSchemaRegistry, setBlockSchemaRegistry] = useState({});

            // Playback controls for network visualization
            const [currentPlaybackStep, setCurrentPlaybackStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const playbackIntervalRef = useRef(null);

            const [isDarkMode, setIsDarkMode] = useState(false); // Default false (Day layout)
            const [networkLayout, setNetworkLayout] = useState("preset");

            // Visual Model Builder State
            const [showModelBuilder, setShowModelBuilder] = useState(false);
            const [builderUseCase, setBuilderUseCase] = useState("epidemics");
            const [builderTemplateId, setBuilderTemplateId] = useState("sir");
            const [builderLeftSidebarCollapsed, setBuilderLeftSidebarCollapsed] = useState(false);
            const [builderRightSidebarCollapsed, setBuilderRightSidebarCollapsed] = useState(false);
            const [builderZoom, setBuilderZoom] = useState(1);
            const [customModels, setCustomModels] = useState([]);
            const [builderModelName, setBuilderModelName] = useState("MyCustomModel");
            const [builderNodes, setBuilderNodes] = useState([
                { id: "status_s", type: "status", x: 100, y: 150, data: { name: "Susceptible", code: 0 } },
                { id: "status_i", type: "status", x: 500, y: 150, data: { name: "Infected", code: 1 } },
                { id: "comp_stoch", type: "compartment", x: 300, y: 120, data: { name: "stochastic", type: "NodeStochastic", params: { rate: 0.05, triggering_status: "Infected" } } }
            ]);
            const [builderEdges, setBuilderEdges] = useState([
                { id: "edge_1", source: "status_s", target: "comp_stoch" },
                { id: "edge_2", source: "comp_stoch", target: "status_i" }
            ]);
            const [builderInitialStatus, setBuilderInitialStatus] = useState([
                { status: "Susceptible", ratio: 0.95 },
                { status: "Infected", ratio: 0.05 }
            ]);
            const [builderDeclarations, setBuilderDeclarations] = useState([]);
            const [builderObservables, setBuilderObservables] = useState([]);
            const [builderUpdates, setBuilderUpdates] = useState([]);
            const [builderOpinionDistribution, setBuilderOpinionDistribution] = useState("uniform");
            const [selectedElement, setSelectedElement] = useState(null);
            const [selectedNodeIds, setSelectedNodeIds] = useState([]);
            const [linkingSource, setLinkingSource] = useState(null);
            const [tempEdgeEnd, setTempEdgeEnd] = useState(null);
            const [builderShowMinimap, setBuilderShowMinimap] = useState(true);
            const [builderCanvasViewport, setBuilderCanvasViewport] = useState({
                scrollLeft: 0,
                scrollTop: 0,
                clientWidth: 0,
                clientHeight: 0,
                scrollWidth: 0,
                scrollHeight: 0
            });
            const [draggingNodes, setDraggingNodes] = useState([]);
            const [dragAnchor, setDragAnchor] = useState(null);
            const linkingSourceRef = useRef(null);
            const builderNodesRef = useRef(builderNodes);
            const builderEdgesRef = useRef(builderEdges);
            const builderInitialStatusRef = useRef(builderInitialStatus);
            const builderCanvasRef = useRef(null);
            // Chart & Network refs
            const trendsChartRef = useRef(null);
            const prevalenceChartRef = useRef(null);
            const phaseChartRef = useRef(null);
            const opinionChartRef = useRef(null);
            const opinionDistributionChartRef = useRef(null);
            const cytoscapeRef = useRef(null);
            const cyContainerRef = useRef(null);
            const communityDetectionOptions = [
                { value: "louvain_communities", label: "Louvain" },
                { value: "greedy_modularity_communities", label: "Greedy Modularity" },
                { value: "naive_greedy_modularity_communities", label: "Naive Greedy Modularity" },
                { value: "label_propagation_communities", label: "Label Propagation" },
                { value: "asyn_lpa_communities", label: "Async Label Propagation" },
                { value: "fast_label_propagation_communities", label: "Fast Label Propagation" },
                { value: "girvan_newman", label: "Girvan-Newman" },
                { value: "asyn_fluidc", label: "Async Fluid Communities" },
            ];

            const cloneBuilderValue = (value) => {
                if (Array.isArray(value) || (value && typeof value === "object")) {
                    return JSON.parse(JSON.stringify(value));
                }
                return value;
            };

            const getBlockSchemaEntry = (blockType) => (
                blockSchemaRegistry && blockSchemaRegistry[blockType] ? blockSchemaRegistry[blockType] : null
            );

            const getBlockSchemaSummary = (blockType) => {
                const schema = getBlockSchemaEntry(blockType);
                if (!schema || !schema.parameters) return null;
                const entries = Object.entries(schema.parameters);
                if (!entries.length) return null;
                return {
                    family: schema.family,
                    required: schema.required_parameters || [],
                    parameters: entries.slice(0, 6).map(([name, info]) => ({
                        name,
                        default: info.default,
                        kind: info.kind,
                        required: !!info.required,
                    })),
                    count: entries.length,
                };
            };

            const getSchemaBackedCompartmentParams = (type) => {
                const schema = getBlockSchemaEntry(type);
                const params = {};
                if (schema && schema.parameters) {
                    Object.entries(schema.parameters).forEach(([name, info]) => {
                        if (info && Object.prototype.hasOwnProperty.call(info, "default") && info.default !== undefined && info.default !== null) {
                            params[name] = cloneBuilderValue(info.default);
                        }
                    });
                }
                return params;
            };

            const builderTemplates = {
                sir: {
                    useCase: "epidemics",
                    label: "SIR",
                    description: "Classic susceptible-infected-recovered flow with stochastic infection and recovery.",
                    modelName: "SIRBuilderModel",
                    nodes: [
                        { id: "sir_s", type: "status", x: 80, y: 150, data: { name: "Susceptible", code: 0 } },
                        { id: "sir_i", type: "status", x: 430, y: 150, data: { name: "Infected", code: 1 } },
                        { id: "sir_r", type: "status", x: 780, y: 150, data: { name: "Recovered", code: 2 } },
                        { id: "sir_infect", type: "compartment", x: 230, y: 115, data: { name: "infection", type: "NodeStochastic", params: { rate: 0.05, triggering_status: "Infected" } } },
                        { id: "sir_recover", type: "compartment", x: 580, y: 115, data: { name: "recovery", type: "NodeStochastic", params: { rate: 0.1, triggering_status: "" } } }
                    ],
                    edges: [
                        { id: "sir_e1", source: "sir_s", target: "sir_infect" },
                        { id: "sir_e2", source: "sir_infect", target: "sir_i" },
                        { id: "sir_e3", source: "sir_i", target: "sir_recover" },
                        { id: "sir_e4", source: "sir_recover", target: "sir_r" }
                    ],
                    initialStatus: [
                        { status: "Susceptible", ratio: 0.95 },
                        { status: "Infected", ratio: 0.05 },
                        { status: "Recovered", ratio: 0.0 }
                    ]
                },
                seir: {
                    useCase: "epidemics",
                    label: "SEIR",
                    description: "Adds an exposed stage and a short latency period before infection becomes active.",
                    modelName: "SEIRBuilderModel",
                    nodes: [
                        { id: "seir_s", type: "status", x: 70, y: 170, data: { name: "Susceptible", code: 0 } },
                        { id: "seir_e", type: "status", x: 290, y: 170, data: { name: "Exposed", code: 1 } },
                        { id: "seir_i", type: "status", x: 510, y: 170, data: { name: "Infected", code: 2 } },
                        { id: "seir_r", type: "status", x: 730, y: 170, data: { name: "Recovered", code: 3 } },
                        { id: "seir_exposure", type: "compartment", x: 180, y: 85, data: { name: "exposure", type: "ExposureRate", params: { beta: 0.18, contact_weight: 1.0, mixing: 1.0 } } },
                        { id: "seir_latency", type: "compartment", x: 400, y: 85, data: { name: "latency", type: "LatencyPeriod", params: { duration: 2 } } },
                        { id: "seir_recovery", type: "compartment", x: 620, y: 85, data: { name: "recovery", type: "RecoveryKernel", params: { gamma: 0.12 } } }
                    ],
                    edges: [
                        { id: "seir_e1", source: "seir_s", target: "seir_exposure" },
                        { id: "seir_e2", source: "seir_exposure", target: "seir_latency" },
                        { id: "seir_e3", source: "seir_latency", target: "seir_e" },
                        { id: "seir_e4", source: "seir_e", target: "seir_i" },
                        { id: "seir_e5", source: "seir_i", target: "seir_recovery" },
                        { id: "seir_e6", source: "seir_recovery", target: "seir_r" }
                    ],
                    initialStatus: [
                        { status: "Susceptible", ratio: 0.93 },
                        { status: "Exposed", ratio: 0.02 },
                        { status: "Infected", ratio: 0.03 },
                        { status: "Recovered", ratio: 0.02 }
                    ]
                },
                late_stage_epidemic: {
                    useCase: "epidemics",
                    label: "Late-Stage Epidemic",
                    description: "Full epidemic starter with exposure, intervention, recovery, waning immunity, and graph-level control blocks.",
                    modelName: "LateStageEpidemicStarter",
                    nodes: [
                        { id: "lse_s", type: "status", x: 70, y: 170, data: { name: "Susceptible", code: 0 } },
                        { id: "lse_e", type: "status", x: 240, y: 170, data: { name: "Exposed", code: 1 } },
                        { id: "lse_i", type: "status", x: 410, y: 170, data: { name: "Infected", code: 2 } },
                        { id: "lse_r", type: "status", x: 580, y: 170, data: { name: "Recovered", code: 3 } },
                        { id: "lse_v", type: "status", x: 750, y: 170, data: { name: "Vaccinated", code: 4 } },
                        { id: "lse_exposure", type: "compartment", x: 160, y: 85, data: { name: "exposure", type: "ExposureRate", params: { beta: 0.25, contact_weight: 1.0, mixing: 1.0 } } },
                        { id: "lse_kernel", type: "compartment", x: 320, y: 85, data: { name: "transmission", type: "TransmissionKernel", params: { saturation: 1.0 } } },
                        { id: "lse_dose", type: "compartment", x: 470, y: 85, data: { name: "dose_response", type: "DoseResponseBlock", params: { shape: "logistic", scale: 2.0, offset: 0.1 } } },
                        { id: "lse_latency", type: "compartment", x: 620, y: 85, data: { name: "latency", type: "LatencyPeriod", params: { duration: 2 } } },
                        { id: "lse_recovery", type: "compartment", x: 320, y: 280, data: { name: "recovery", type: "RecoveryKernel", params: { gamma: 0.15 } } },
                        { id: "lse_waning", type: "compartment", x: 470, y: 280, data: { name: "waning", type: "WaningImmunity", params: { rate: 0.05 } } },
                        { id: "lse_vaccination", type: "compartment", x: 620, y: 280, data: { name: "vaccination", type: "VaccinationBlock", params: { coverage: 0.2, efficacy: 0.9 } } },
                        { id: "lse_quarantine", type: "compartment", x: 780, y: 85, data: { name: "quarantine", type: "QuarantineBlock", params: { duration: 3, coverage: 0.25 } } },
                        { id: "lse_testing", type: "compartment", x: 920, y: 85, data: { name: "testing", type: "TestingBlock", params: { sensitivity: 0.9, specificity: 0.95 } } },
                        { id: "lse_treatment", type: "compartment", x: 920, y: 280, data: { name: "treatment", type: "TreatmentBlock", params: { efficacy: 0.75 } } },
                        { id: "lse_hospital", type: "compartment", x: 1080, y: 85, data: { name: "hospitalization", type: "HospitalizationBlock", params: { rate: 0.2, mortality: 0.05 } } },
                        { id: "lse_mortality", type: "compartment", x: 1080, y: 280, data: { name: "mortality", type: "MortalityBlock", params: { fatality: 0.05, target_status: "Removed" } } },

                        { id: "lse_seasonality", type: "compartment", x: 1400, y: 280, data: { name: "seasonality", type: "SeasonalityBlock", params: { period: 12, amplitude: 0.3 } } },
                        { id: "lse_importation", type: "compartment", x: 1560, y: 85, data: { name: "importation", type: "ImportationBlock", params: { arrival_rate: 0.05, infectious_status: "Infected" } } },

                        { id: "lse_activation", type: "compartment", x: 1720, y: 280, data: { name: "edge_activation", type: "EdgeActivationBlock", params: { threshold: 0.5, duration: 2 } } }
                    ],
                    edges: [
                        { id: "lse_e1", source: "lse_s", target: "lse_exposure" },
                        { id: "lse_e2", source: "lse_exposure", target: "lse_kernel" },
                        { id: "lse_e3", source: "lse_kernel", target: "lse_dose" },
                        { id: "lse_e4", source: "lse_dose", target: "lse_latency" },
                        { id: "lse_e5", source: "lse_latency", target: "lse_e" },
                        { id: "lse_e6", source: "lse_e", target: "lse_recovery" },
                        { id: "lse_e7", source: "lse_recovery", target: "lse_r" },
                        { id: "lse_e8", source: "lse_r", target: "lse_waning" },
                        { id: "lse_e9", source: "lse_waning", target: "lse_s" },
                        { id: "lse_e10", source: "lse_i", target: "lse_vaccination" },
                        { id: "lse_e11", source: "lse_vaccination", target: "lse_v" },
                        { id: "lse_e12", source: "lse_s", target: "lse_quarantine" },
                        { id: "lse_e13", source: "lse_quarantine", target: "lse_testing" },
                        { id: "lse_e14", source: "lse_testing", target: "lse_treatment" },
                        { id: "lse_e15", source: "lse_treatment", target: "lse_hospital" },
                        { id: "lse_e16", source: "lse_hospital", target: "lse_mortality" },

                        { id: "lse_e18", source: "lse_reinfection", target: "lse_strain" },

                setBuilderTemplateId(templateId);
                setBuilderModelName(template.modelName);
                setBuilderOpinionDistribution(template.initialOpinionDistribution || "uniform");
                setBuilderDeclarations(Array.isArray(template.declarations) ? template.declarations.map(item => ({ ...item })) : []);
                setBuilderObservables(Array.isArray(template.observables) ? template.observables.map(item => ({ ...item })) : []);
                setBuilderUpdates(Array.isArray(template.updates) ? template.updates.map(item => ({ ...item })) : []);
                setBuilderNodes(template.nodes.map(node => ({
                    ...node,
                    data: {
                        ...node.data,
                        params: node.data && node.data.params ? { ...node.data.params } : undefined
                    }
                })));
                setBuilderEdges(template.edges.map(edge => ({ ...edge })));
                setBuilderInitialStatus(template.initialStatus.map(item => ({ ...item })));
                autoLayoutBuilder(template.nodes, template.edges);
            };

            const queueBuilderTemplateReload = (templateId, useCase) => {
                clearBuilderInteractionState();
                clearBuilderSelection();
                setShowModelBuilder(true);
                loadBuilderTemplate(templateId, useCase);
            };

            const resolveBuilderDropTarget = (event) => {
                const element = event?.target?.closest?.("[data-builder-handle-type], [data-builder-node-id]")
                    || (typeof document !== "undefined" && typeof event?.clientX === "number" && typeof event?.clientY === "number"
                        ? document.elementFromPoint(event.clientX, event.clientY)
                        : null);
                if (!element) return null;

                const handleEl = element.closest?.("[data-builder-handle-type]");
                const nodeEl = element.closest?.("[data-builder-node-id]");
                const targetNodeId = nodeEl?.dataset?.builderNodeId || handleEl?.dataset?.builderNodeId || null;
                if (!targetNodeId) return null;

                const handleType = handleEl?.dataset?.builderHandleType || null;
                return {
                    targetNodeId,
                    targetPort: handleType || null
                };
            };

            const finalizeBuilderLinkFromEvent = (event, source = linkingSourceRef.current || linkingSource) => {
                if (!source) return false;
                const target = resolveBuilderDropTarget(event);
                if (!target) return false;

                const targetNode = builderNodesRef.current.find(n => n.id === target.targetNodeId);
                if (!targetNode) return false;

                if (target.targetPort) {
                    return finalizeBuilderLink(source, target.targetNodeId, target.targetPort);
                }

                let targetPort = "in";
                if (targetNode.data.type === "ConditionalComposition") {
                    const liveEdges = builderEdgesRef.current || builderEdges;
                    const hasCond = liveEdges.some(edge => edge.target === target.targetNodeId && edge.targetPort === "condition");
                    const hasTrue = liveEdges.some(edge => edge.target === target.targetNodeId && edge.targetPort === "if_true");
                    if (!hasCond) targetPort = "condition";
                    else if (!hasTrue) targetPort = "if_true";
                    else targetPort = "if_false";
                }

                return finalizeBuilderLink(source, target.targetNodeId, targetPort);
            };

            useEffect(() => {
                const handleGlobalPointerUp = (event) => {
                    finalizeBuilderLinkFromEvent(event);
                    clearBuilderInteractionState();
                };
                window.addEventListener("mouseup", handleGlobalPointerUp);
                window.addEventListener("pointerup", handleGlobalPointerUp);
                window.addEventListener("blur", handleGlobalPointerUp);
                return () => {
                    window.removeEventListener("mouseup", handleGlobalPointerUp);
                    window.removeEventListener("pointerup", handleGlobalPointerUp);
                    window.removeEventListener("blur", handleGlobalPointerUp);
                };
            }, []);

            const autoLayoutBuilder = (nodes = builderNodes, edges = builderEdges) => {
                if (!Array.isArray(nodes) || nodes.length === 0) return;

                const nodeMap = new Map(nodes.map(node => [node.id, node]));
                const incomingCounts = new Map(nodes.map(node => [node.id, 0]));
                const outgoing = new Map(nodes.map(node => [node.id, []]));

                edges.forEach(edge => {
                    if (!nodeMap.has(edge.source) || !nodeMap.has(edge.target)) {
                        return;
                    }
                    incomingCounts.set(edge.target, (incomingCounts.get(edge.target) || 0) + 1);
                    outgoing.get(edge.source).push(edge.target);
                });

                const levels = new Map();
                const queue = [];

                nodes.forEach(node => {
                    if ((incomingCounts.get(node.id) || 0) === 0) {
                        levels.set(node.id, node.type === "status" ? 0 : 1);
                        queue.push(node.id);
                    }
                });

                if (queue.length === 0) {
                    nodes.forEach(node => {
                        levels.set(node.id, node.type === "status" ? 0 : 1);
                        queue.push(node.id);
                    });
                }

                while (queue.length > 0) {
                    const sourceId = queue.shift();
                    const sourceLevel = levels.get(sourceId) || 0;

                    (outgoing.get(sourceId) || []).forEach(targetId => {
                        const nextLevel = sourceLevel + 1;
                        if (!levels.has(targetId)) {
                            levels.set(targetId, nextLevel);
                            queue.push(targetId);
                        }
                    });
                }

                const grouped = new Map();
                nodes.forEach(node => {
                    const level = levels.has(node.id) ? levels.get(node.id) : (node.type === "status" ? 0 : 1);
                    if (!grouped.has(level)) grouped.set(level, []);
                    grouped.get(level).push(node);
                });

                const sortedLevels = Array.from(grouped.keys()).sort((a, b) => a - b);
                const xGap = 260;
                const yGap = 150;
                const startX = 80;
                const centerY = 220;

                const positionedNodes = nodes.map(node => ({ ...node }));

                sortedLevels.forEach((level, levelIndex) => {
                    const levelNodes = grouped.get(level).slice().sort((a, b) => {
                        const aName = String(a.data?.name || a.id);
                        const bName = String(b.data?.name || b.id);
                        return aName.localeCompare(bName);
                    });
                    const totalHeight = (levelNodes.length - 1) * yGap;
                    const baseY = centerY - totalHeight / 2;

                    levelNodes.forEach((node, index) => {
                        const targetNode = positionedNodes.find(n => n.id === node.id);
                        if (targetNode) {
                            targetNode.x = startX + levelIndex * xGap;
                            targetNode.y = Math.max(70, baseY + index * yGap);
                        }
                    });
                });

                setBuilderNodes(positionedNodes);
            };

                    "State Initialization": { order: 0, blocks: ["status", "NodeStochastic", "NodeThreshold", "EdgeStochastic", "CountDown", "NodeCategoricalAttribute", "NodeNumericalAttribute"] },
                    "Transmission & Progression": { order: 1, blocks: ["ExposureRate", "TransmissionKernel", "DoseResponseBlock", "LatencyPeriod", "IncubationState", "RecoveryKernel", "WaningImmunity", "ReinfectionBlock", "StrainBlock", "SuperSpreaderBlock"] },
                    "Interventions & Network": { order: 2, blocks: ["VaccinationBlock", "QuarantineBlock", "TestingBlock", "TreatmentBlock", "HospitalizationBlock", "MortalityBlock", "SeasonalityBlock", "ImportationBlock", "RewiringBlock", "CommunityMixingBlock", "EdgeActivationBlock"] },
                    "Builder Utilities": { order: 3, blocks: ["Parameter", "Constant", "Variable", "Distribution", "Selector", "Filter", "Aggregator", "Kernel", "Transform", "Compose", "Schedule", "Observe", "ClampNormalize", "SeedSelection", "NodeRoleAssignment", "AttributeInitializer", "GraphImport", "CommunityAssignment", "RuleAlias", "PreviewObservable", "ValidationHint", "ConditionalComposition"] }
                } : builderUseCase === "continuous_opinions" ? {
                    "Opinion Initialization": { order: 0, blocks: ["status", "OpinionDistribution", "Parameter", "Constant", "Variable", "Distribution"] },
                    "Opinion Interaction": { order: 1, blocks: ["OpinionDistanceThreshold", "OpinionSelectionBias", "OpinionCompromise", "OpinionStubbornness", "OpinionNoise", "OpinionPolarization", "OpinionExternalField", "OpinionTrustFilter"] },
                    "Opinion Post-Processing": { order: 2, blocks: ["OpinionMemory", "OpinionNormalization", "OpinionQuantization", "OpinionBoundedDrift"] },
                    "Opinion Extensions": { order: 3, blocks: ["OpinionMediaInfluence", "OpinionZealot", "OpinionMultiTopic", "OpinionLabelSwitch"] },
                    "Shared Utilities": { order: 4, blocks: ["NodeNumericalAttribute", "NodeNumericalVariable", "Selector", "Filter", "Aggregator", "Kernel", "Transform", "Compose", "Schedule", "Observe", "ClampNormalize", "NodeThreshold", "CountDown", "SeedSelection", "NodeRoleAssignment", "AttributeInitializer", "GraphImport", "CommunityAssignment", "RuleAlias", "PreviewObservable", "ValidationHint", "ConditionalComposition"] }
                } : builderUseCase === "discrete_opinions" ? {
                    "Opinion State Setup": { order: 0, blocks: ["status", "OpinionZealot"] },
                    "Discrete Transitions": { order: 1, blocks: ["NodeStochastic", "NodeThreshold", "NodeCategoricalAttribute", "NodeNumericalAttribute", "CountDown"] },
                    "Shared Utilities": { order: 2, blocks: ["Parameter", "Constant", "Variable", "Distribution", "Selector", "Filter", "Aggregator", "Kernel", "Transform", "Compose", "Schedule", "Observe", "ClampNormalize", "SeedSelection", "NodeRoleAssignment", "AttributeInitializer", "GraphImport", "CommunityAssignment", "RuleAlias", "PreviewObservable", "ValidationHint", "ConditionalComposition"] }
                } : {
                    "Epidemic Blocks": { order: 0, blocks: ["status", "NodeStochastic", "NodeThreshold", "EdgeStochastic", "CountDown", "NodeCategoricalAttribute", "NodeNumericalAttribute", "NodeNumericalVariable"] },
                    "Opinion Blocks": { order: 1, blocks: ["OpinionDistribution", "OpinionDistanceThreshold", "OpinionSelectionBias", "OpinionCompromise", "OpinionStubbornness", "OpinionNoise", "OpinionPolarization", "OpinionExternalField", "OpinionTrustFilter", "OpinionMemory", "OpinionNormalization", "OpinionQuantization", "OpinionMediaInfluence", "OpinionZealot", "OpinionMultiTopic", "OpinionLabelSwitch", "OpinionBoundedDrift"] },
                    "Cross-Coupling": { order: 2, blocks: ["Selector", "Filter", "Aggregator", "Kernel", "Transform", "Compose", "Schedule", "Observe", "ClampNormalize", "Parameter", "Constant", "Variable", "Distribution", "SeedSelection", "NodeRoleAssignment", "AttributeInitializer", "GraphImport", "CommunityAssignment", "RuleAlias", "PreviewObservable", "ValidationHint", "ConditionalComposition", "ExposureRate", "TransmissionKernel", "DoseResponseBlock", "LatencyPeriod", "IncubationState", "RecoveryKernel", "WaningImmunity", "VaccinationBlock", "QuarantineBlock", "TestingBlock", "TreatmentBlock", "HospitalizationBlock", "MortalityBlock", "ReinfectionBlock", "StrainBlock", "SuperSpreaderBlock", "SeasonalityBlock", "ImportationBlock", "RewiringBlock", "CommunityMixingBlock", "EdgeActivationBlock"] },
                    "Shared Utilities": { order: 3, blocks: [] }
                };

                const sectionOrder = Object.fromEntries(Object.entries(sectionMeta).map(([title, meta]) => [title, meta.order]));

                const sectionForBlock = (block) => {
                    const id = block.id;
                    if (id === "status") {
                        return builderUseCase === "continuous_opinions" ? "Opinion Initialization" : builderUseCase === "discrete_opinions" ? "Opinion State Setup" : builderUseCase === "coupled" ? "Epidemic Blocks" : "State Initialization";
                    }

                    if (builderUseCase === "epidemics") {
                        if (sectionMeta["State Initialization"].blocks.includes(id)) return "State Initialization";
                        if (sectionMeta["Transmission & Progression"].blocks.includes(id)) return "Transmission & Progression";
                        if (sectionMeta["Interventions & Network"].blocks.includes(id)) return "Interventions & Network";
                        return "Builder Utilities";
                    }

                    if (builderUseCase === "continuous_opinions") {
                        if (["OpinionDistribution", "Parameter", "Constant", "Variable", "Distribution"].includes(id)) return "Opinion Initialization";
                        if (sectionMeta["Opinion Interaction"].blocks.includes(id)) return "Opinion Interaction";
                        if (sectionMeta["Opinion Post-Processing"].blocks.includes(id)) return "Opinion Post-Processing";
                        if (["OpinionMediaInfluence", "OpinionZealot", "OpinionMultiTopic", "OpinionLabelSwitch", "OpinionBoundedDrift"].includes(id)) return "Opinion Extensions";
                        return "Shared Utilities";
                    }

                    if (builderUseCase === "discrete_opinions") {
                        if (sectionMeta["Opinion State Setup"].blocks.includes(id)) return "Opinion State Setup";
                        if (sectionMeta["Discrete Transitions"].blocks.includes(id)) return "Discrete Transitions";
                        return "Shared Utilities";
                    }

                    if (sectionMeta["Epidemic Blocks"].blocks.includes(id)) return "Epidemic Blocks";
                    if (sectionMeta["Opinion Blocks"].blocks.includes(id)) return "Opinion Blocks";
                    if (sectionMeta["Cross-Coupling"].blocks.includes(id)) return "Cross-Coupling";
                    return "Shared Utilities";
                };

                const grouped = new Map();
                blocks.forEach(block => {
                    const section = sectionForBlock(block);
                    if (!grouped.has(section)) grouped.set(section, []);
                    grouped.get(section).push(block);
                });

                return Array.from(grouped.entries())
                    .sort((a, b) => (sectionOrder[a[0]] ?? 99) - (sectionOrder[b[0]] ?? 99) || a[0].localeCompare(b[0]))
                    .map(([title, items]) => {
                        const order = sectionMeta[title]?.blocks || [];
                        const indexFor = (blockId) => {
                            const idx = order.indexOf(blockId);
                            return idx === -1 ? 999 : idx;
                        };
                        return {
                            title,
                            items: items.slice().sort((left, right) => indexFor(left.id) - indexFor(right.id) || left.label.localeCompare(right.label))
                        };
                    });
            };

            const clearPlayState = () => {
                setIsPlaying(false);
                setCurrentPlaybackStep(0);
                if (playbackIntervalRef.current) {
                    clearInterval(playbackIntervalRef.current);
                }
            };

            const clearSeedSelection = () => {
                setSelectedSeedNodes([]);
            };

            const resetGraphState = () => {
                clearPlayState();
                clearSeedSelection();
                setResults(null);
                setNetworkPreview(null);
                if (cytoscapeRef.current) {
                    cytoscapeRef.current.destroy();
                    cytoscapeRef.current = null;
                }
            };

            const getGraphPayload = () => ({
                graph_type: graphType,
                graph_params: graphParams
            });

            const getCurrentGraphNodeCount = () => {
                if (results && Array.isArray(results.nodes)) {
                    return results.nodes.length;
                }
                if (networkPreview && Array.isArray(networkPreview.nodes)) {
                    return networkPreview.nodes.length;
                }
                return 0;
            };

            const currentGraphNodeCount = getCurrentGraphNodeCount();
            const isNetworkTabAllowed = currentGraphNodeCount > 0 && currentGraphNodeCount < 1500;
            const showNetworkGraph = isNetworkTabAllowed;

            const renderNetworkPreview = (data) => {
                if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) return;
                scheduleCytoscapeInit(data);
            };

            const toggleSeedNode = (nodeId) => {
                const supportsNodeSelection = selectedCategory === "Epidemics" || selectedModelName === "VoterZealotModel";
                if (!supportsNodeSelection || !currentModel || currentModel.discrete_state === false || results) return;
                const nodeKey = String(nodeId);
                setSelectedSeedNodes(prev => (
                    prev.includes(nodeKey)
                        ? prev.filter(id => id !== nodeKey)
                        : [...prev, nodeKey]
                ));
            };

            const syncSeedSelection = () => {
                if (!cytoscapeRef.current) return;
                const selected = new Set(selectedSeedNodes.map(String));
                const selectionColor = selectedModelName === "VoterZealotModel" ? "#22c55e" : "#ef4444";
                cytoscapeRef.current.batch(() => {
                    cytoscapeRef.current.nodes().forEach(node => {
                        const isSelected = selected.has(String(node.id()));
                        node.toggleClass("selected-seed", isSelected);
                        if (!results) {
                            const baseColor = getCommunityColor(node.data("com"));
                            const color = isSelected ? selectionColor : baseColor;
                            node.data("statusColor", color);
                            node.style({
                                "background-color": color,
                                "border-color": color,
                            });
                        }
                    });
                });
            };

            const loadModels = (baseUrl = apiBaseUrl) => {
                setError("");
                fetch(baseUrl + "/api/models")
                    .then(res => {
                        if (!res.ok) throw new Error("Server returned status " + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data.error) throw new Error(data.error);
                        setModels(data);
                        const firstModel = data.SIModel ? "SIModel" : Object.keys(data).find(k => data[k].category === "Epidemics");
                        if (firstModel) {
                            selectModel(firstModel, data);
                        }
                    })
                    .catch(err => {
                        setError("Failed to fetch models list from server. Connection error or invalid URL: " + err.message);
                    });
            };

            // Fetch available models on mount
            useEffect(() => {
                loadModels();
            }, []);

            useEffect(() => {
                fetch(apiBaseUrl + "/api/block-schema")
                    .then(res => {
                        if (!res.ok) throw new Error("Server returned status " + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data && data.blocks) {
                            setBlockSchemaRegistry(data.blocks);
                        }
                    })
                    .catch(err => {
                        console.error("Failed to fetch block schema registry:", err);
                    });
            }, [apiBaseUrl]);

            const selectModel = (name, modelsList = models) => {
                setSelectedModelName(name);
                const model = modelsList[name];
                if (!model) return;
                setSelectedCategory(model.category || selectedCategory);

                // Build default parameters
                const defaults = {};
                // Model level
                Object.keys(model.parameters.model).forEach(k => {
                    const paramInfo = model.parameters.model[k];
                    const isCountParam = ["q", "k", "iterations"].includes(k);
                    defaults[k] = paramInfo.default !== undefined ? paramInfo.default : (isCountParam ? 1 : 0.1);
                });
                // Node level
                Object.keys(model.parameters.nodes).forEach(k => {
                    defaults[k] = model.parameters.nodes[k].default !== undefined ? model.parameters.nodes[k].default : 0.1;
                });
                // Edge level
                Object.keys(model.parameters.edges).forEach(k => {
                    defaults[k] = model.parameters.edges[k].default !== undefined ? model.parameters.edges[k].default : 1;
                });

                // Ensure initial infection fraction is set
                if (model.category === "Epidemics" && model.parameters.model["fraction_infected"] && defaults["fraction_infected"] === undefined) {
                    defaults["fraction_infected"] = 0.05;
                }
                if (model.category === "Epidemics" &&
                    model.discrete_state !== false &&
                    defaults["fraction_infected"] === undefined &&
                    defaults["percentage_infected"] === undefined) {
                    defaults["percentage_infected"] = 5;
                }
                if (model.requires_community_assignment) {
                    defaults["community_detection_algorithm"] = model.community_detection_default || "louvain_communities";
                    defaults["community_detection_k"] = 2;
                }
                if (model.category === "Opinions" && model.discrete_state !== false && model.statuses) {
                    const statusNames = Object.keys(model.statuses);
                    const equalShare = statusNames.length > 0 ? 100 / statusNames.length : 0;
                    defaults["initial_status_percentages"] = statusNames.reduce((acc, statusName) => {
                        acc[statusName] = equalShare;
                        return acc;
                    }, {});
                }
                if (name === "VoterZealotModel") {
                    defaults["zealot_percentage"] = 5;
                }
                if (name === "AlgorithmicBiasMediaModel") {
                    const mediaCount = Math.max(1, parseInt(defaults["k"]) || 1);
                    defaults["media_opinions"] = Array.from({ length: mediaCount }, () => 0.5);
                }

                clearPlayState();
                clearSeedSelection();
                setResults(null);
                setModelParams(defaults);
                setActiveTab(model.discrete_state === false ? "opinion_evolution" : "trends");
            };

            const handleCategoryChange = (cat) => {
                setSelectedCategory(cat);
                const firstModel = getDefaultModelForCategory(cat);
                if (firstModel) {
                    selectModel(firstModel);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                resetGraphState();

                const reader = new FileReader();
                reader.onload = (event) => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let format = "graphml";
                    if (ext === "gml") format = "gml";
                    else if (ext === "txt" || ext === "csv") format = "edgelist";

                    setGraphParams(prev => ({
                        ...prev,
                        file_content: event.target.result,
                        file_format: format,
                        file_name: file.name
                    }));
                };
                reader.readAsText(file);
            };

            const handleGraphTypeChange = (value) => {
                resetGraphState();
                setGraphType(value);
            };

            const updateGraphParams = (updater) => {
                resetGraphState();
                setGraphParams(updater);
            };

            const getGraphSignature = () => JSON.stringify({
                graphType,
                graphParams
            });

            const generateNetwork = async ({ silent = false } = {}) => {
                if (!silent) {
                    setLoading(true);
                    setLoadingMessage("Generating network...");
                }
                setError("");
                try {
                    clearSeedSelection();
                    const payload = getGraphPayload();
                    const res = await fetch(apiBaseUrl + "/api/network", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    data.signature = getGraphSignature();
                    setNetworkPreview(data);
                    setResults(null);
                    setCurrentPlaybackStep(0);
                    setActiveTab("network");
                    if (data.node_count < 1500) {
                        setTimeout(() => {
                            renderNetworkPreview(data);
                        }, 50);
                    }
                    return data;
                } catch (err) {
                    setError(err.message || "Network generation failed.");
                    return null;
                } finally {
                    if (!silent) {
                        setLoading(false);
                        setLoadingMessage("");
                    }
                }
            };

            const runSimulation = async () => {
                setLoading(true);
                setLoadingMessage("Executing network simulation...");
                setError("");
                setResults(null);
                clearPlayState();

                try {
                    const preview = networkPreview && networkPreview.signature === getGraphSignature()
                        ? networkPreview
                        : await generateNetwork({ silent: true });

                    if (!preview) {
                        return;
                    }

                    const payload = {
                        model_class: selectedModelName,
                        category: selectedCategory,
                        graph_data: preview,
                        model_params: modelParams,
                        selected_seed_nodes: selectedSeedNodes,
                        iterations: iterations
                    };

                    const res = await fetch(apiBaseUrl + "/api/simulate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (data.error) {
                        setError(data.error);
                        return;
                    }

                    data.continuousVariable = detectContinuousVariable(data);
                    data.absoluteStatusHistory = data.absolute_status_history || data.absoluteStatusHistory || buildOpinionHistory(data);
                    data.isContinuous = data.discrete_state === false;

                    if (selectedCategory === "Opinions" && Array.isArray(data.absoluteStatusHistory)) {
                        let minOp = Infinity;
                        let maxOp = -Infinity;
                        data.absoluteStatusHistory.forEach(snapshot => {
                            Object.values(snapshot).forEach(value => {
                                if (typeof value === "number" && Number.isFinite(value)) {
                                    if (value < minOp) minOp = value;
                                    if (value > maxOp) maxOp = value;
                                }
                            });
                        });
                        if (!Number.isFinite(minOp) || !Number.isFinite(maxOp)) {
                            minOp = 0;
                            maxOp = 1;
                        } else if (Math.abs(maxOp - minOp) < 1e-5) {
                            minOp = 0;
                            maxOp = 1;
                        }
                        data.minOpinion = minOp;
                        data.maxOpinion = maxOp;
                    }

                    setResults(data);
                    setCurrentPlaybackStep(0);
                    setActiveTab(data.discrete_state === false ? "opinion_evolution" : "trends");
                    // Render charts automatically
                    setTimeout(() => {
                        if (data.discrete_state !== false) {
                            renderTrendsChart(data);
                        }
                        if (selectedCategory === "Epidemics") {
                            renderPrevalenceChart(data);
                            renderPhasePortrait(data);
                        } else if (data.discrete_state === false) {
                            renderOpinionEvolution(data);
                            renderOpinionDistributionChart(data, 0);
                        }
                        scheduleCytoscapeInit(data);
                    }, 50);
                } catch (err) {
                    setError(err.message || "Network error while running simulation.");
                } finally {
                    setLoading(false);
                    setLoadingMessage("");
                }
            };

            // Color Palette for Compartments / Opinions
            const getStatusColor = (statusCode, value = null, statuses = {}, minOp = 0, maxOp = 1, isContinuous = false) => {
                // If continuous opinions (floating values)
                if (isContinuous && value !== null) {
                    const norm = (maxOp === minOp) ? 0.5 : (value - minOp) / (maxOp - minOp);
                    // Blue rgb(59, 130, 246) to Red rgb(239, 68, 68)
                    const r = Math.floor(59 + norm * (239 - 59));
                    const g = Math.floor(130 + norm * (68 - 130));
                    const b = Math.floor(246 + norm * (68 - 246));
                    return `rgb(${r}, ${g}, ${b})`;
                }

                // Epidemic classes
                const colors = {
                    0: "#38bdf8", // Susceptible (Sky Blue)
                    1: "#f97316", // Infected / Asymptomatic (Orange)
                    2: "#ef4444", // Infected (Symptomatic) (Red)
                    3: "#22c55e", // Removed / Recovered (Green)
                    4: "#10b981", // Removed/Recovered (Emerald)
                    "-1": "#64748b", // Blocked (Slate)
                };
                return colors[statusCode] || "#6366f1";
            };

            const getContinuousValue = (state, preferredKey = null) => {
                if (typeof state === "number" && Number.isFinite(state)) {
                    return state;
                }

                if (!state || typeof state !== "object") {
                    return 0;
                }

                if (preferredKey !== null && state[preferredKey] !== undefined) {
                    const preferredValue = state[preferredKey];
                    if (typeof preferredValue === "number" && Number.isFinite(preferredValue)) {
                        return preferredValue;
                    }
                }

                for (const value of Object.values(state)) {
                    if (typeof value === "number" && Number.isFinite(value)) {
                        return value;
                    }
                }

                for (const value of Object.values(state)) {
                    if (value && typeof value === "object" && !Array.isArray(value)) {
                        const nestedValue = getContinuousValue(value, preferredKey);
                        if (typeof nestedValue === "number" && Number.isFinite(nestedValue)) {
                            return nestedValue;
                        }
                    }
                }

                return 0;
            };

            const getOpinionSnapshot = (snapshot) => {
                if (!snapshot || typeof snapshot !== "object" || Array.isArray(snapshot)) {
                    return {};
                }

                if (snapshot.status && typeof snapshot.status === "object" && !Array.isArray(snapshot.status)) {
                    return snapshot.status;
                }

                return snapshot;
            };

            const buildOpinionHistory = (data) => {
                if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.iterations)) {
                    return [];
                }

                const nodeIds = data.nodes.map(node => String(node.id));
                const history = [];
                const currentStatus = {};

                nodeIds.forEach(nodeId => {
                    currentStatus[nodeId] = 0;
                });

                data.iterations.forEach(snapshot => {
                    const statusMap = getOpinionSnapshot(snapshot);
                    nodeIds.forEach(nodeId => {
                        let rawValue;
                        if (Object.prototype.hasOwnProperty.call(statusMap, nodeId)) {
                            rawValue = statusMap[nodeId];
                        } else if (Object.prototype.hasOwnProperty.call(statusMap, Number(nodeId))) {
                            rawValue = statusMap[Number(nodeId)];
                        }

                        if (rawValue !== undefined) {
                            const resolvedValue = typeof rawValue === "number" && Number.isFinite(rawValue)
                                ? rawValue
                                : getContinuousValue(rawValue, data.continuousVariable);
                            if (typeof resolvedValue === "number" && Number.isFinite(resolvedValue)) {
                                currentStatus[nodeId] = resolvedValue;
                            }
                        }
                    });
                    history.push({ ...currentStatus });
                });

                return history;
            };

            const getContinuousBinColor = (value, minOp = 0, maxOp = 1, bins = 10) => {
                if (typeof value !== "number" || !Number.isFinite(value)) {
                    return "#64748b";
                }

                const clampedBins = Math.max(2, bins);
                const span = maxOp - minOp;
                const normalized = span === 0 ? 0.5 : (value - minOp) / span;
                const safeNormalized = Math.min(1, Math.max(0, normalized));
                const binIndex = Math.min(
                    clampedBins - 1,
                    Math.max(0, Math.floor(safeNormalized * clampedBins))
                );

                const palette = [
                    "#2563eb",
                    "#3b82f6",
                    "#6366f1",
                    "#8b5cf6",
                    "#a855f7",
                    "#d946ef",
                    "#ec4899",
                    "#f43f5e",
                    "#ef4444",
                    "#f97316",
                ];

                return palette[Math.min(binIndex, palette.length - 1)];
            };

            const getOpinionValuesAtStep = (data, step = currentPlaybackStep) => {
                if (!data || !Array.isArray(data.nodes)) {
                    return [];
                }

                const history = Array.isArray(data.absoluteStatusHistory) && data.absoluteStatusHistory.length > 0
                    ? data.absoluteStatusHistory
                    : buildOpinionHistory(data);

                if (!Array.isArray(history) || history.length === 0) {
                    return [];
                }

                const safeStep = Math.max(0, Math.min(step, history.length - 1));
                const snapshot = history[safeStep] || {};

                return data.nodes
                    .map(node => getContinuousValue(snapshot[node.id], data.continuousVariable))
                    .filter(value => typeof value === "number" && Number.isFinite(value));
            };

            const buildOpinionDistributionSeries = (data, step = currentPlaybackStep, binCount = 12) => {
                if (data && data.discrete_state !== false) {
                    const iterationsList = Array.isArray(data.iterations) ? data.iterations : [];
                    const safeStep = Math.max(0, Math.min(step, iterationsList.length - 1));
                    const iteration = iterationsList[safeStep] || {};
                    const nodeCount = iteration.node_count || {};
                    const statusEntries = Object.entries(data.statuses || {})
                        .sort((a, b) => Number(a[1]) - Number(b[1]));

                    return {
                        labels: statusEntries.map(([statusName]) => statusName),
                        counts: statusEntries.map(([, statusCode]) => {
                            const raw = nodeCount[statusCode] !== undefined ? nodeCount[statusCode] : nodeCount[String(statusCode)];
                            return typeof raw === "number" ? raw : parseInt(raw, 10) || 0;
                        }),
                        minBound: 0,
                        maxBound: Math.max(1, ...(statusEntries.map(([, statusCode]) => {
                            const raw = nodeCount[statusCode] !== undefined ? nodeCount[statusCode] : nodeCount[String(statusCode)];
                            return typeof raw === "number" ? raw : parseInt(raw, 10) || 0;
                        }))),
                    };
                }

                const values = getOpinionValuesAtStep(data, step);
                const bins = Math.max(4, binCount);

                if (values.length === 0) {
                    return {
                        labels: Array.from({ length: bins }, (_, i) => `${i}`),
                        counts: Array(bins).fill(0),
                        minBound: 0,
                        maxBound: 1,
                    };
                }

                let minBound = data && typeof data.minOpinion === "number" ? data.minOpinion : Math.min(...values);
                let maxBound = data && typeof data.maxOpinion === "number" ? data.maxOpinion : Math.max(...values);

                if (!Number.isFinite(minBound) || !Number.isFinite(maxBound)) {
                    minBound = 0;
                    maxBound = 1;
                }

                if (Math.abs(maxBound - minBound) < 1e-6) {
                    const padding = Math.max(0.05, Math.abs(maxBound) * 0.1);
                    minBound -= padding;
                    maxBound += padding;
                }

                const counts = Array(bins).fill(0);
                values.forEach(value => {
                    const normalized = (value - minBound) / (maxBound - minBound);
                    const clamped = Math.min(0.999999, Math.max(0, normalized));
                    const index = Math.min(bins - 1, Math.floor(clamped * bins));
                    counts[index] += 1;
                });

                const labels = Array.from({ length: bins }, (_, idx) => {
                    const start = minBound + ((maxBound - minBound) * idx) / bins;
                    const end = minBound + ((maxBound - minBound) * (idx + 1)) / bins;
                    return `${start.toFixed(2)} - ${end.toFixed(2)}`;
                });

                return { labels, counts, minBound, maxBound };
            };

            const renderOpinionDistributionChart = (data, step = currentPlaybackStep) => {
                if (opinionDistributionChartRef.current) opinionDistributionChartRef.current.destroy();
                if (!data) return;

                const canvas = document.getElementById("opinionDistributionChart");

                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    title: (items) => items[0]?.label || "",
                                    label: (item) => `${item.formattedValue} nodes`,
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: false
                                },
                                ticks: {
                                    color: isDarkMode ? "#94a3b8" : "#475569",
                                    maxRotation: 45,
                                    minRotation: 45,
                                    autoSkip: true
                                },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: "Node count",
                                    color: isDarkMode ? "#f8fafc" : "#1e293b"
                                },
                                ticks: { color: isDarkMode ? "#94a3b8" : "#475569" },
                                grid: { color: isDarkMode ? "#334155" : "#cbd5e1" }
                            }
                        }
                    }
                });
            };

            const isThresholdParameter = (paramName, paramInfo = {}) => {
                const name = String(paramName || "").toLowerCase();
                const descr = String(paramInfo.descr || "").toLowerCase();
                return (
                    name.includes("threshold") ||
                    descr.includes("threshold") ||
                    name === "epsilon"
                );
            };

            const formatBuilderLabel = (name) => {
                return String(name || "")
                    .replace(/_/g, " ")
                    .replace(/\b\w/g, c => c.toUpperCase());
            };

            const parseBuilderStructuredValue = (raw, fallback = "") => {
                if (raw === undefined || raw === null || raw === "") return fallback;
                if (typeof raw !== "string") return raw;
                const trimmed = raw.trim();
                if (!trimmed) return fallback;
                if ((trimmed.startsWith("[") && trimmed.endsWith("]")) || (trimmed.startsWith("{") && trimmed.endsWith("}"))) {
                    try {
                        return JSON.parse(trimmed);
                    } catch (err) {
                        return fallback;
                    }
                }
                return trimmed;
            };

            const isBuilderIntegerParam = (paramName, paramInfo = {}) => {
                const name = String(paramName || "").toLowerCase();
                const kind = String(paramInfo.kind || "").toLowerCase();
                return (
                    kind === "int" ||
                    ["k", "bins", "iterations", "count", "size", "period", "phase", "age", "n", "m"].includes(name)
                );
            };

            const isBuilderFloatParam = (paramName, paramInfo = {}) => {
                const name = String(paramName || "").toLowerCase();
                const kind = String(paramInfo.kind || "").toLowerCase();
                return (
                    kind === "float" ||
                    name.includes("rate") ||
                    name.includes("prob") ||
                    name.includes("share") ||
                    name.includes("weight") ||
                    name.includes("epsilon") ||
                    name.includes("gamma") ||
                    name.includes("mu") ||
                    name.includes("sigma") ||
                    name.includes("theta") ||
                    name.includes("strength") ||
                    name.includes("threshold") ||
                    name.includes("target") ||
                    name.includes("alpha") ||
                    name.includes("min") ||
                    name.includes("max")
                );
            };

            const getBuilderParamOptions = (paramName, paramInfo = {}, blockType = "") => {
                const name = String(paramName || "").toLowerCase();
                if (Array.isArray(paramInfo.choices) && paramInfo.choices.length > 0) {
                    return paramInfo.choices;
                }
                if (name === "op") {
                    return ["==", "!=", "<", ">", "<=", ">=", "IN"];
                }
                if (name === "var_type" || name === "value_type") {
                    return ["ATTRIBUTE", "STATUS"];
                }
                if (name === "mode") {
                    return ["bins", "hist", "line", "mean"];
                }
                if (name === "scope") {
                    return ["node", "edge", "graph", "global"];
                }
                if (name === "family") {
                    return OPINION_DISTRIBUTIONS;
                }
                if (name === "distribution") {
                    return OPINION_DISTRIBUTIONS;
                }
                if (name === "algorithm" || name === "community_detection_algorithm") {
                    return communityDetectionOptions.map(option => option.value);
                }
                if (name === "type" && blockType === "ValidationHint") {
                    return ["float", "int", "bool", "string", "list", "dict"];
                }
                if (name === "kind" && blockType === "RuleAlias") {
                    return ["PARAM", "GLOBAL", "EDGE_VARIABLE", "VARIABLE", "CONSTANT", "STATUS", "BIN"];
                }
                return null;
            };

            const renderBuilderParamControl = (selectedNode, paramName, paramInfo = {}, statusesList = []) => {
                const value = selectedNode?.data?.params?.[paramName];
                const name = String(paramName || "");
                const typeName = String(selectedNode?.data?.type || "");
                const options = getBuilderParamOptions(name, paramInfo, typeName);
                const label = paramInfo.descr ? `${formatBuilderLabel(name)} - ${paramInfo.descr}` : formatBuilderLabel(name);
                const commonClass = `w-full border rounded px-2 py-1.5 ${isDarkMode ? "bg-slate-950 border-slate-800 text-slate-200" : "bg-white border-slate-200 text-slate-800"}`;
                const updateParam = (nextValue) => updateNodeData(selectedNode.id, {
                    params: {
                        ...selectedNode.data.params,
                        [paramName]: nextValue
                    }
                });

                if (name === "triggering_status" && statusesList.length > 0) {
                    return (
                        <div key={name} class="space-y-1">
                            <label class="text-[10px] text-slate-400 block">{label}</label>
                            <select

                                onChange={(e) => updateParam(e.target.value)}
                                class={commonClass}
                            >
                                <option value="">None</option>
                                {statusesList.map(n => (
                                    <option key={n.id} value={n.data.name}>{n.data.name}</option>

                            </select>
                        </div>
